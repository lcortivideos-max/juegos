<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Abismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: cueva submarina en 2D a pantalla completa; el submarino avanza de izquierda a derecha */
:root {
  --bg: #031a26;
  --ink: #e6fbff;
  --muted: #8fb8c4;
  --panel: rgba(4, 30, 44, 0.88);
  --line: rgba(126, 240, 255, 0.22);
  --accent: #ffd23f;
  --onaccent: #241a00;
  --gold: #7ef0ff;
  --ongold: #022a33;
  --goldline: rgba(126, 240, 255, 0.4);
  --goldtint: rgba(126, 240, 255, 0.1);
  --veil: rgba(2, 14, 22, 0.5);
  --shadow: rgba(0, 0, 0, 0.45);
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Juego Abismo"></canvas></div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const SEG = 18, R = 15;
  let segs = [], obstacles = [], pearls = [], bubbles = [], particles = [];
  let worldX = 0, genX = 0, center = 0, drift = 0, speed = 170, dist = 0, t = 0;
  let sub = { x: 0, y: 0, vy: 0 }, holding = false, invuln = 0, shake = 0, menuT = 0;

  function gapAt() { return clamp(H * (0.66 - dist / 26000), H * 0.36, H * 0.66); }
  function genSeg() {
    drift += rand(-0.35, 0.35); drift = clamp(drift, -2.2, 2.2);
    center += drift * 2.2;
    const g = gapAt(), m = 30 + g / 2;
    if (center < m) { center = m; drift = Math.abs(drift); }
    if (center > H - m) { center = H - m; drift = -Math.abs(drift); }
    const wob = Math.sin(genX * 0.02) * 10 + Math.sin(genX * 0.053) * 6;
    segs.push({ x: genX, top: center - g / 2 + wob, bot: center + g / 2 + wob });
    // perlas siguiendo el centro
    if (Math.floor(genX / SEG) % 9 === 0 && Math.random() < 0.55) {
      const off = rand(-g * 0.22, g * 0.22);
      for (let i = 0; i < 5; i++) pearls.push({ x: genX + i * 28, y: center + off + wob, got: false });
    }
    // obstáculos: estalactitas, estalagmitas y medusas
    if (genX > 900 && Math.floor(genX / SEG) % 13 === 0 && Math.random() < 0.6 + Math.min(0.3, dist / 40000)) {
      const r = Math.random();
      if (r < 0.4) obstacles.push({ type: 'up', x: genX, len: g * rand(0.32, 0.5) });
      else if (r < 0.8) obstacles.push({ type: 'down', x: genX, len: g * rand(0.32, 0.5) });
      else obstacles.push({ type: 'jelly', x: genX, cy: center + wob, amp: g * 0.28, ph: rand(0, 6), r: 16 });
    }
    genX += SEG;
  }
  function wallAt(x) {
    const i = Math.floor((x - segs[0].x) / SEG);
    const a = segs[clamp(i, 0, segs.length - 1)], b = segs[clamp(i + 1, 0, segs.length - 1)];
    const f = clamp((x - a.x) / SEG, 0, 1);
    return { top: a.top + (b.top - a.top) * f, bot: a.bot + (b.bot - a.bot) * f };
  }
  function reset() {
    segs = []; obstacles = []; pearls = []; bubbles = []; particles = [];
    worldX = 0; genX = -40; center = H / 2; drift = 0; speed = 170; dist = 0; invuln = 0; shake = 0;
    while (genX < W + 200) genSeg();
    sub = { x: Math.max(70, W * 0.26), y: H / 2, vy: 0 };
  }

  function spikeHit(dx, d, len) { if (d >= len) return false; const hw = 20 * (1 - clamp(d / len, 0, 1)) + 3; return Math.abs(dx) < hw + R * 0.6; }
  function burst(x, y, color, n) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: rand(-120, 120), vy: rand(-140, 60), life: rand(0.3, 0.6), color }); }

  const shell = Arcade.create({
    id: 'abismo', title: ['El', 'Abismo'], bg: '#031a26',
    tagline: 'Pilota el submarino por la cueva más profunda del océano.',
    how: ['<b>Mantén pulsado</b> para subir y <b>suelta</b> para bajar.', 'No toques las paredes, las rocas ni las medusas.', 'Recoge perlas por el camino. La cueva se estrecha y el submarino acelera.'],
    coinLabel: 'Perlas', coinSingular: 'perla', coinValue: 5, rivalTop: 3200, statLabel: 'Metros',
    crashTitle: '¡Casco dañado!', reviveLabel: 'Reparar y seguir', reviveReward: 'reparar el submarino', countdown: true,
    onStart() { reset(); },
    onGo() { holding = false; },
    onRevive() {
      obstacles = obstacles.filter((o) => o.x - worldX > sub.x + 260 || o.x - worldX < sub.x - 60);
      const w = wallAt(worldX + sub.x); sub.y = (w.top + w.bot) / 2; sub.vy = 0; invuln = 2;
    },
    onMenu() { reset(); }
  });

  function press(on) { holding = on; if (on) Arcade.audio(); }
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); press(true); });
  addEventListener('pointerup', () => press(false));
  addEventListener('pointercancel', () => press(false));
  addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); press(true); } });
  addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') press(false); });

  function update(dt) {
    t += dt;
    const playing = shell.playing();
    if (playing) {
      speed = Math.min(390, 170 + dist / 60);
      sub.vy += (holding ? -980 : 720) * dt; sub.vy = clamp(sub.vy, -380, 420);
      sub.y += sub.vy * dt;
      worldX += speed * dt; dist += speed * dt;
      shell.setBase(dist / 10); shell.stat = dist / 10;
      if (invuln > 0) invuln -= dt;
      if (holding && Math.random() < 0.6) bubbles.push({ x: sub.x - 24, y: sub.y + rand(-4, 4), r: rand(2, 5), vx: -speed * 0.2 - rand(20, 60), life: 1 });
    } else if (shell.state === 'menu') {
      menuT += dt; worldX += 90 * dt;
      const w = wallAt(worldX + sub.x); sub.y += ((w.top + w.bot) / 2 + Math.sin(menuT * 1.4) * 20 - sub.y) * Math.min(1, dt * 2);
    }
    while (genX < worldX + W + 200) genSeg();
    while (segs.length && segs[1] && segs[1].x < worldX - 40) segs.shift();
    obstacles = obstacles.filter((o) => o.x - worldX > -80);
    pearls = pearls.filter((p) => p.x - worldX > -40 && !p.got);

    if (playing) {
      const sx = worldX + sub.x;
      // perlas
      for (const p of pearls) {
        if (!p.got && Math.abs(p.x - sx) < 22 && Math.abs(p.y - sub.y) < 22) {
          p.got = true; shell.coin(1); shell.tone(1175, 1760, 0.08, 'sine', 0.07); burst(sub.x + 10, sub.y, '#bff8ff', 6);
        }
      }
      if (invuln <= 0) {
        const w = wallAt(sx);
        let hit = sub.y - R * 0.8 < w.top || sub.y + R * 0.8 > w.bot;
        for (const o of obstacles) {
          const ox = o.x - worldX; if (Math.abs(ox - sub.x) > 60) continue;
          const ww = wallAt(o.x);
          if (o.type === 'down') { if (spikeHit(ox - sub.x, sub.y - R * 0.7 - ww.top, o.len)) hit = true; }
          else if (o.type === 'up') { if (spikeHit(ox - sub.x, ww.bot - (sub.y + R * 0.7), o.len)) hit = true; }
          else { const jy = o.cy + Math.sin(t * 1.8 + o.ph) * o.amp; if (Math.hypot(ox - sub.x, jy - sub.y) < o.r + R * 0.75) hit = true; }
        }
        if (hit) { shake = 0.4; burst(sub.x, sub.y, '#ffd23f', 14); shell.noise(0.5, 0.45, 600); shell.crash(); }
      }
    }
    for (const b of bubbles) { b.x += b.vx * dt; b.y -= 40 * dt; b.life -= dt * 0.9; }
    bubbles = bubbles.filter((b) => b.life > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt);
  }

  // Dibujo
  function draw() {
    const depth = clamp(dist / 30000, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${192 - depth * 20}, 80%, ${18 - depth * 8}%)`);
    g.addColorStop(1, `hsl(${205 - depth * 15}, 85%, ${6 - depth * 3}%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 10);
    // rayos de luz
    ctx.globalAlpha = 0.07 * (1 - depth);
    ctx.fillStyle = '#bff8ff';
    for (let i = 0; i < 4; i++) {
      const x = ((i * 260 - worldX * 0.1) % (W + 300) + W + 300) % (W + 300) - 150;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0); ctx.lineTo(x + 220, H); ctx.lineTo(x + 120, H); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // rocas lejanas
    ctx.fillStyle = 'rgba(2, 40, 56, 0.6)';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, H * 0.72 + Math.sin((x + worldX * 0.3) * 0.012) * 30 + Math.sin((x + worldX * 0.3) * 0.031) * 14);
    ctx.lineTo(W, H); ctx.fill();
    // paredes
    const rock = ctx.createLinearGradient(0, 0, 0, H); rock.addColorStop(0, '#0b2f3d'); rock.addColorStop(1, '#06202b');
    ctx.fillStyle = rock;
    ctx.beginPath(); ctx.moveTo(-10, -10);
    for (const s of segs) ctx.lineTo(s.x - worldX, s.top);
    ctx.lineTo(W + 20, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, H + 10);
    for (const s of segs) ctx.lineTo(s.x - worldX, s.bot);
    ctx.lineTo(W + 20, H + 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(126, 240, 255, 0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); segs.forEach((s, i) => (i ? ctx.lineTo(s.x - worldX, s.top) : ctx.moveTo(s.x - worldX, s.top))); ctx.stroke();
    ctx.beginPath(); segs.forEach((s, i) => (i ? ctx.lineTo(s.x - worldX, s.bot) : ctx.moveTo(s.x - worldX, s.bot))); ctx.stroke();
    // corales en el suelo
    for (const s of segs) {
      const k = Math.floor(s.x / SEG);
      if (k % 7 === 0) { const x = s.x - worldX; ctx.strokeStyle = k % 2 ? '#ff6f91' : '#ffb347'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, s.bot); ctx.quadraticCurveTo(x - 6, s.bot - 14, x + 2, s.bot - 22 - (k % 3) * 5); ctx.stroke(); }
    }
    // obstáculos
    for (const o of obstacles) {
      const x = o.x - worldX, w = wallAt(o.x);
      if (o.type === 'down') {
        ctx.fillStyle = '#0e3a4b'; ctx.beginPath(); ctx.moveTo(x - 20, w.top - 2); ctx.lineTo(x + 20, w.top - 2); ctx.lineTo(x + 3, w.top + o.len); ctx.lineTo(x - 3, w.top + o.len); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(126,240,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      } else if (o.type === 'up') {
        ctx.fillStyle = '#0e3a4b'; ctx.beginPath(); ctx.moveTo(x - 20, w.bot + 2); ctx.lineTo(x + 20, w.bot + 2); ctx.lineTo(x + 3, w.bot - o.len); ctx.lineTo(x - 3, w.bot - o.len); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(126,240,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      } else {
        const y = o.cy + Math.sin(t * 1.8 + o.ph) * o.amp;
        const glow = ctx.createRadialGradient(x, y, 2, x, y, 34); glow.addColorStop(0, 'rgba(255,120,220,.45)'); glow.addColorStop(1, 'rgba(255,120,220,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 34, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff8ad8'; ctx.beginPath(); ctx.arc(x, y, o.r, Math.PI, 0); ctx.quadraticCurveTo(x + o.r, y + 6, x, y + 4); ctx.quadraticCurveTo(x - o.r, y + 6, x - o.r, y); ctx.fill();
        ctx.strokeStyle = '#ffb3e8'; ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 5, y + 4); ctx.quadraticCurveTo(x + i * 5 + Math.sin(t * 5 + i) * 5, y + 16, x + i * 5, y + 26); ctx.stroke(); }
      }
    }
    // perlas
    for (const p of pearls) {
      const x = p.x - worldX; if (x < -20 || x > W + 20) continue;
      const pg = ctx.createRadialGradient(x - 3, p.y - 3, 1, x, p.y, 8); pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#7ef0ff');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, p.y, 7, 0, Math.PI * 2); ctx.fill();
    }
    // burbujas
    ctx.strokeStyle = 'rgba(200, 250, 255, 0.6)'; ctx.lineWidth = 1.2;
    for (const b of bubbles) { ctx.globalAlpha = b.life; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // submarino
    const blink = invuln > 0 && Math.floor(t * 12) % 2 === 0;
    if (!blink) drawSub(sub.x, sub.y, clamp(sub.vy / 900, -0.35, 0.35));
    for (const p of particles) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // oscuridad de profundidad
    const v = ctx.createRadialGradient(sub.x + 60, sub.y, 80, sub.x + 60, sub.y, Math.max(W, H));
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,5,10,${0.35 + depth * 0.4})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  function drawSub(x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    const cone = ctx.createRadialGradient(20, 0, 4, 120, 0, 140); cone.addColorStop(0, 'rgba(255,240,170,.35)'); cone.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(22, -4); ctx.lineTo(170, -60); ctx.lineTo(170, 60); ctx.lineTo(22, 4); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8a91c'; ctx.fillRect(-6, -22, 14, 10);
    ctx.fillStyle = '#e8a91c'; ctx.fillRect(-2, -28, 3, 8);
    ctx.fillStyle = '#0a4a5c'; ctx.beginPath(); ctx.arc(8, -1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7ef0ff'; ctx.beginPath(); ctx.arc(9, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c98a10'; const pr = Math.sin(t * 40) * 7;
    ctx.fillRect(-32, -pr / 2 - 1, 5, pr + 2);
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); shell.paintHud();
    requestAnimationFrame(frame);
  }
  resize(); reset();
  requestAnimationFrame(frame);
  window.__game = { shell, press, get sub() { return sub; }, auto() { const w = wallAt(worldX + sub.x + 40); press(sub.y > (w.top + w.bot) / 2 + 6); } };
})();
</script>
</body>
</html>
