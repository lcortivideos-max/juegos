<title>Check-In</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Outfit:wght@400;600;800&display=swap">

<style>
/* Layout: calle de ciudad en 3D a pantalla completa; arriba lo que llevas y el progreso hasta el hotel; abajo la tarjeta del trato */
:root {
  --bg: #0a0d24;
  --ink: #f2f0ff;
  --muted: #a7a3c9;
  --panel: rgba(14, 16, 42, 0.9);
  --line: rgba(170, 160, 255, 0.2);
  --accent: #ff3d8b;
  --onaccent: #fff4f8;
  --gold: #ffd166;
  --ongold: #2b1d00;
  --goldline: rgba(255, 209, 102, 0.4);
  --goldtint: rgba(255, 209, 102, 0.1);
  --veil: rgba(6, 8, 24, 0.45);
  --shadow: rgba(0, 0, 0, 0.5);
  --good: #3ddc97;
  --bad: #ff5a5f;
  --display: "Righteous", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Outfit", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
#app { background: #0a0d24; }
.ci-top { position: absolute; z-index: 5; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.ci-bag { display: flex; gap: 6px; }
.ci-item { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 8px 4px 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); transition: opacity .3s, filter .3s; }
.ci-item .ic { font-size: 15px; line-height: 1; }
@media (max-width: 440px) { .ci-item .tx { display: none; } .ci-item { padding: 5px 7px; } .ci-item .ic { font-size: 17px; } }
.ci-item.lost { opacity: .35; filter: grayscale(1); text-decoration: line-through; }
.ci-item.lost.pop { animation: ciLost .5s ease-out; }
@keyframes ciLost { 0% { transform: scale(1.25); background: var(--bad); } 100% { transform: scale(1); } }
.ci-trip { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 0; }
.ci-trip .city { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.ci-trip .city b { color: var(--ink); }
.ci-dots { display: flex; gap: 4px; align-items: center; }
.ci-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.18); }
.ci-dots i.ok { background: var(--good); }
.ci-dots i.ko { background: var(--bad); }
.ci-dots i.now { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.ci-dots .h { font-size: 13px; margin-left: 2px; }

.ci-offer { position: absolute; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translate(-50%, 0); width: min(440px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 10px; transition: transform .25s ease, opacity .25s ease; }
.ci-offer.off { transform: translate(-50%, 30px); opacity: 0; pointer-events: none; }
.ci-who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ci-who .nm { font-family: var(--display); font-size: 19px; }
.ci-who .rl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ci-say { margin: 0; font-size: 16px; line-height: 1.4; background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px 12px; position: relative; }
.ci-say::before { content: ""; position: absolute; top: -7px; left: 22px; border: 7px solid transparent; border-top: 0; border-bottom-color: rgba(255,255,255,.06); }
.ci-timer { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.ci-timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold) 40%, var(--good)); transform-origin: left; }
.ci-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ci-btns button { appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-size: 18px; padding: 14px 10px; border-radius: 14px; transition: transform .08s ease; }
.ci-btns button:active { transform: scale(.96); }
.ci-btns .no { background: rgba(255,255,255,.1); color: var(--ink); border: 1px solid var(--line); }
.ci-btns .yes { background: var(--good); color: #062a1b; }
.ci-btns button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.ci-fx { position: absolute; z-index: 8; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: clamp(28px, 9vw, 42px); text-align: center; pointer-events: none; text-shadow: 0 4px 24px rgba(0,0,0,.6); white-space: nowrap; }
.ci-fx.show { animation: ciFx 1.3s ease-out forwards; }
@keyframes ciFx { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 70% { opacity: 1; transform: translate(-50%, -55%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -75%) scale(1); } }
.ci-why { position: absolute; z-index: 8; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); width: min(420px, calc(100% - 32px)); text-align: center; font-size: 14px; line-height: 1.4; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; pointer-events: none; transition: opacity .3s; }
.ci-coin { position: absolute; z-index: 9; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6c8, var(--gold) 55%, #b8860b); box-shadow: 0 0 10px rgba(255,209,102,.7); pointer-events: none; }

.ci-hotel { position: absolute; z-index: 9; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, transparent 40%, rgba(6,8,24,.7)); }
.ci-hcard { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--goldline); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: ciUp .4s ease-out; }
@keyframes ciUp { from { transform: translateY(30px); opacity: 0; } }
.ci-hcard .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ci-hcard .room { font-family: var(--display); font-size: 28px; color: var(--gold); line-height: 1.1; }
.ci-hcard .stars { font-size: 20px; letter-spacing: 4px; color: var(--gold); }
.ci-hcard p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4; }
.ci-hcard p b { color: var(--ink); }
.ci-hcard .bonus { font-family: var(--display); font-size: 20px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .ci-fx.show, .ci-hcard, .ci-item.lost.pop { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Juego Check-In: una calle de ciudad de noche"></canvas>
  <div class="ci-top" id="ciTop" hidden>
    <div class="ci-bag" id="ciBag"></div>
    <div class="ci-trip"><span class="city" id="ciCity"></span><div class="ci-dots" id="ciDots"></div></div>
  </div>
  <div class="ci-offer off" id="ciOffer" aria-live="polite">
    <div class="ci-who"><span class="nm" id="ciName"></span><span class="rl" id="ciRole"></span></div>
    <p class="ci-say" id="ciSay"></p>
    <div class="ci-timer"><i id="ciTimer"></i></div>
    <div class="ci-btns"><button class="no" id="ciNo">No, gracias</button><button class="yes" id="ciYes">Aceptar</button></div>
  </div>
  <div class="ci-fx" id="ciFx"></div>
  <div class="ci-why" id="ciWhy" hidden></div>
  <div class="ci-hotel" id="ciHotel" hidden>
    <div class="ci-hcard">
      <span class="k" id="ciHk">Check-in en el hotel</span>
      <span class="room" id="ciRoom"></span>
      <span class="stars" id="ciStars"></span>
      <p id="ciHtext"></p>
      <span class="bonus" id="ciBonus"></span>
      <button class="sh-btn" id="ciNext">Siguiente viaje</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="vendor/three.min.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- Viajes ----------
  const CITIES = [
    { name: 'Madrid', hotel: 'Hotel Aurora', sky: ['#060a26', '#2a1550', '#ff7a59'], fog: 0x1b1238, rain: false },
    { name: 'Nueva York', hotel: 'The Grand Liberty', sky: ['#03061a', '#14214f', '#3b7bd6'], fog: 0x10173a, rain: true },
    { name: 'Tokio', hotel: 'Hotel Sakura Tower', sky: ['#05031a', '#2b0f4a', '#ff3d8b'], fog: 0x1a0d33, rain: true },
    { name: 'Dubái', hotel: 'Palm Royale', sky: ['#0a0718', '#3a1d3f', '#ffb347'], fog: 0x24142c, rain: false },
    { name: 'Miami', hotel: 'Ocean Drive Palace', sky: ['#07051f', '#3d0f5c', '#00d1c1'], fog: 0x1c0e3a, rain: false },
    { name: 'Londres', hotel: 'The Kensington', sky: ['#05080f', '#1c2433', '#6b7f99'], fog: 0x161c26, rain: true },
    { name: 'París', hotel: 'Hôtel Lumière', sky: ['#080616', '#2b1c46', '#f7a1c4'], fog: 0x1d1530, rain: false }
  ];
  const PER_TRIP = 7;
  const ITEMS = [{ id: 'cartera', ic: '👛', nm: 'Cartera' }, { id: 'movil', ic: '📱', nm: 'Móvil' }, { id: 'maleta', ic: '🧳', nm: 'Maleta' }];

  // ---------- Personajes y tratos ----------
  const FIRST = ['Lucía', 'Marcos', 'Carmen', 'Javi', 'Sofía', 'Diego', 'Elena', 'Raúl', 'Nora', 'Iván', 'Paula', 'Hugo', 'Marta', 'Óscar', 'Alba', 'Leo', 'Inés', 'Bruno', 'Vera', 'Samuel'];
  // Cada rol: cómo viste y qué ofrece si es honrado
  const ROLES = [
    { rl: 'Taxista', top: 0x1d1d1f, bot: 0x2b2b30, hat: 'cap', hatC: 0xf2c200, prop: 'keys',
      honest: [['Voy hacia tu hotel. Te acerco un par de calles sin cobrarte, que me pilla de camino.', 8], ['Te ahorro la cuesta: sube y te dejo en la esquina siguiente.', 7]] },
    { rl: 'Florista', top: 0xd8476b, bot: 0x2f2a3a, hat: null, prop: 'flowers',
      honest: [['Hoy regalo una flor a cada turista. ¡Bienvenido a la ciudad!', 5], ['Me han sobrado rosas. Llévate una para la habitación.', 5]] },
    { rl: 'Músico callejero', top: 0x2f6f5e, bot: 0x22252e, hat: 'beanie', hatC: 0xc0392b, prop: 'guitar',
      honest: [['¿Te gusta? Toma una entrada para mi concierto del viernes, es gratis.', 6], ['Escucha una canción y llévate mi disco de regalo.', 6]] },
    { rl: 'Repartidora', top: 0xf06a2a, bot: 0x1f2633, hat: 'cap', hatC: 0xf06a2a, prop: 'box',
      honest: [['El cliente no ha contestado y la pizza se enfría. ¿La quieres?', 7], ['Me sobra un menú del día. Para ti, que se va a tirar.', 7]] },
    { rl: 'Camarero', top: 0xf4f1ea, bot: 0x111114, hat: null, prop: 'tray',
      honest: [['Estamos de inauguración: un café gratis para quien pase.', 6], ['Prueba nuestro zumo natural, invita la casa.', 5]] },
    { rl: 'Guía turística', top: 0x2e86de, bot: 0x2d2d3a, hat: 'cap', hatC: 0x2e86de, prop: 'map',
      honest: [['Toma un mapa de la ciudad con descuentos en museos.', 6], ['¿Buscas tu hotel? Está recto, dos calles más. Toma este folleto con ofertas.', 7]] },
    { rl: 'Encuestadora', top: 0x8e44ad, bot: 0x2c2c38, hat: null, prop: 'board',
      honest: [['Una pregunta rápida sobre turismo y te llevas un vale de 10 monedas.', 10], ['¿Dos minutos para una encuesta? Te damos un vale de regalo.', 9]] },
    { rl: 'Señora del barrio', top: 0x9b6b43, bot: 0x3b3346, hat: null, prop: 'bag', old: true,
      honest: [['Ay, gracias por ayudarme con la bolsa. Toma, para que te tomes algo.', 10], ['Hijo, estas galletas las he hecho yo. Coge unas para el viaje.', 6]] },
    { rl: 'Vendedor de periódicos', top: 0x5d6d7e, bot: 0x2a2f38, hat: 'flat', hatC: 0x4a3b2c, prop: 'paper',
      honest: [['El periódico de hoy trae un cupón de regalo. Este te lo doy yo.', 6], ['Hoy el diario es gratis por aniversario. ¡Toma!', 5]] }
  ];
  // Frases de timador: demasiado buenas para ser verdad
  const TOO_GOOD = [
    '¡Un móvil último modelo, nuevo, por solo 5 monedas!',
    'Has ganado un crucero de lujo. Solo necesito tu cartera un segundo para el sorteo.',
    'Te doy 500 monedas si me prestas el móvil para una llamada.',
    'Reloj de oro auténtico, de 3.000 a 10 monedas. ¡Precio de amigo!',
    'Te cambio tu maleta por 1.000 monedas, ahora mismo.',
    'Invierte 1 moneda conmigo y mañana tendrás 2.000. Garantizado.',
    'Eres el visitante un millón. ¡Te llevas un coche! Déjame tu cartera para el papeleo.'
  ];
  const HURRY = ['¡Rápido, que se acaba!', '¡Decide ya, solo ahora!', '¡Corre, que viene alguien!', '¡Última oportunidad, ya mismo!', '¡Venga, venga, sin pensarlo!'];
  const TELL_TEXT = {
    bueno: 'prometía algo demasiado bueno',
    prisa: 'te metía prisa',
    gafas: 'llevaba gafas de sol de noche',
    mano: 'escondía una mano a la espalda'
  };

  // ---------- Escena 3D ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 220);
  function resize() {
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.7 ? 58 : 50; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  function skyTex(city) {
    return canvasTex(16, 512, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, city.sky[0]); gr.addColorStop(0.55, city.sky[1]); gr.addColorStop(0.82, city.sky[2]); gr.addColorStop(1, city.sky[1]);
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    });
  }

  const hemi = new THREE.HemisphereLight(0x8a90ff, 0x2a1a2f, 0.75); scene.add(hemi);
  const moon = new THREE.DirectionalLight(0xbfc8ff, 0.45); moon.position.set(-8, 14, 6); scene.add(moon);
  const warm = new THREE.PointLight(0xffc27a, 1.3, 16, 2); scene.add(warm);
  const shopLight = new THREE.PointLight(0xff4fa3, 0.9, 12, 2); scene.add(shopLight);

  const world = new THREE.Group(); scene.add(world);
  const fill = new THREE.PointLight(0xfff0e0, 0.9, 7, 2); scene.add(fill);

  // Calzada, aceras y bordillos
  const ROAD_W = 7, WALK_X = 3.5 + 1.6;
  const roadTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#16161d'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.fillStyle = '#e8e2c8'; g.fillRect(w / 2 - 3, 0, 6, h * 0.55);
  });
  roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping; roadTex.repeat.set(1, 18);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, 240), new THREE.MeshPhongMaterial({ map: roadTex, shininess: 60, specular: 0x333344 }));
  road.rotation.x = -Math.PI / 2; road.position.z = -100; scene.add(road);
  const walkTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#4a4757'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(20,18,30,.55)'; g.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); }
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  });
  walkTex.wrapS = walkTex.wrapT = THREE.RepeatWrapping; walkTex.repeat.set(1.2, 60);
  [-1, 1].forEach((s) => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.18, 240), new THREE.MeshLambertMaterial({ map: walkTex }));
    sw.position.set(s * (ROAD_W / 2 + 1.8), 0.09, -100); scene.add(sw);
    const curb = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 240), new THREE.MeshLambertMaterial({ color: 0x8c8899 }));
    curb.position.set(s * (ROAD_W / 2 + 0.08), 0.1, -100); scene.add(curb);
  });

  // Fachadas con ventanas encendidas
  function facadeTex(base, lit) {
    return canvasTex(128, 256, (g, w, h) => {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      const cols = 4, rows = 8, cw = w / cols, rh = h / rows;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const on = Math.random() < 0.55;
        g.fillStyle = on ? pick(lit) : 'rgba(10,12,30,.9)';
        g.fillRect(x * cw + cw * 0.18, y * rh + rh * 0.22, cw * 0.64, rh * 0.56);
        if (on && Math.random() < 0.4) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x * cw + cw * 0.18, y * rh + rh * 0.22, cw * 0.64, rh * 0.18); }
      }
    });
  }
  const FACADES = [
    facadeTex('#24223a', ['#ffd89b', '#ffe9c2', '#fff2d9']),
    facadeTex('#1c2533', ['#9fd8ff', '#d7f0ff', '#ffe2a8']),
    facadeTex('#2c1f2b', ['#ffb36b', '#ffd27f', '#ffcf9e']),
    facadeTex('#1e1e26', ['#fff4d6', '#cfe6ff', '#ffd6a5']),
    facadeTex('#2a2633', ['#ffc8dd', '#ffe5b4', '#e0d4ff'])
  ];
  FACADES.forEach((t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; });
  function neonTex(text, color) {
    return canvasTex(256, 96, (g, w, h) => {
      g.fillStyle = 'rgba(10,8,20,.85)'; g.fillRect(0, 0, w, h);
      g.font = 'bold 54px Righteous, Arial Rounded MT Bold, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = color; g.shadowBlur = 22; g.fillStyle = color; g.fillText(text, w / 2, h / 2 + 3);
      g.shadowBlur = 0; g.fillStyle = '#fff'; g.globalAlpha = 0.75; g.fillText(text, w / 2, h / 2 + 3);
    });
  }
  const NEONS = [['BAR', '#ff3d8b'], ['24H', '#3df5ff'], ['PIZZA', '#ffb347'], ['SUSHI', '#ff5a5f'], ['CLUB', '#b26bff'], ['CAFÉ', '#ffd166'], ['TAPAS', '#ff7a59'], ['DISCO', '#3ddc97'], ['FARMACIA', '#3ddc97'], ['RAMEN', '#ff3d8b']]
    .map(([t, c]) => ({ tex: neonTex(t, c), color: new THREE.Color(c) }));
  const lampGlow = canvasTex(64, 64, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,230,180,1)'); r.addColorStop(0.3, 'rgba(255,200,120,.45)'); r.addColorStop(1, 'rgba(255,180,100,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
  const poolTex = canvasTex(64, 64, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,205,140,.55)'); r.addColorStop(1, 'rgba(255,190,120,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });

  const buildings = [], lamps = [], cars = [];
  const bMats = FACADES.map((t, i) => {
    const m = new THREE.MeshLambertMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.85, color: [0x9a96b8, 0x8fa3c2, 0xb39a9a, 0x9a9aa6, 0xb0a0b8][i] });
    return m;
  });
  function makeBuilding() {
    const w = rand(5, 9), d = rand(5, 9), h = rand(9, 34);
