<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Invasores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: pantalla de fósforo tipo CRT bajo el marcador; formación de invasores arriba, búnkeres y cañón abajo; debajo queda una franja para arrastrar el dedo */
:root {
  --bg: #020604;
  --ink: #eafff0;
  --muted: #8fbf9f;
  --panel: rgba(4, 18, 10, 0.9);
  --line: rgba(92, 255, 138, 0.25);
  --accent: #5cff8a;
  --onaccent: #02220e;
  --gold: #ffd23f;
  --ongold: #2a1e00;
  --goldline: rgba(255, 210, 63, 0.45);
  --goldtint: rgba(255, 210, 63, 0.09);
  --veil: rgba(0, 6, 3, 0.45);
  --shadow: rgba(0, 0, 0, 0.55);
  --display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
.iv-filter { position: absolute; z-index: 11; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 8px 12px; font-size: 13px; background: var(--panel); }
.sh-logo .b { text-shadow: 0 0 18px rgba(92, 255, 138, 0.55); }
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Juego Invasores"></canvas></div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const approach = (v, t, s) => (Math.abs(t - v) <= s ? t : v + Math.sign(t - v) * s);
  const PIX = '"Press Start 2P", "Courier New", monospace';
  const LW = 224; // ancho lógico de la pantalla (en píxeles del "monitor")

  // ---------- Sprites (arte original, 1 = píxel encendido) ----------
  const ALIENS = [
    [[ // Ojo: 30 puntos
      '..######..', '.##....##.', '##..##..##', '##..##..##', '.##....##.', '..######..', '.#.#..#.#.', '#..#..#..#'
    ], [
      '..######..', '.##....##.', '##.##...##', '##.##...##', '.##....##.', '..######..', '..#.##.#..', '.#..##..#.'
    ]],
    [[ // Escarabajo: 20 puntos
      '....###....', '..#######..', '#.##.#.##.#', '###########', '#.#######.#', '#..#...#..#', '...#...#...', '..##...##..'
    ], [
      '....###....', '..#######..', '..##.#.##..', '###########', '.#########.', '.#.#...#.#.', '#..#...#..#', '...##.##...'
    ]],
    [[ // Seta robot: 10 puntos
      '....####....', '..########..', '.##.####.##.', '############', '..##....##..', '.##.####.##.', '##........##', '............'
    ], [
      '....####....', '..########..', '.##.####.##.', '############', '..##....##..', '..##.##.##..', '...##..##...', '..##....##..'
    ]]
  ];
  const ROW_TYPE = [0, 1, 1, 2, 2], ROW_PTS = [30, 20, 20, 10, 10];
  const CANNON = ['......#......', '.....###.....', '.....###.....', '..#########..', '.###########.', '#############', '#.#.#.#.#.#.#', '.###########.'];
  const SAUCER = ['.....######.....', '...##########...', '..#.##.##.##.#..', '################', '..###..##..###..', '...#........#...'];
  const BOOM = ['..#...#...#..', '#..#..#..#..#', '.#..#...#..#.', '...#.#.#.#...', '##.........##', '...#.#.#.#...', '.#..#...#..#.', '#..#..#..#..#'];
  const SPLAT = ['#..#..#.', '.#.##.#.', '..####..', '########', '..####..', '.#.##.#.', '#..#..#.'];
  const PBOOM = [
    ['.....#....#....', '..#....#.....#.', '....#.#..#.....', '.#...###...#...', '...##.####..#..', '..###########..', '.#############.', '###############'],
    ['#.......#....#.', '...#.#.....#...', '.#....#.#.....#', '....#######.#..', '..#.###.###....', '.#####.#####.#.', '#.###########..', '.##############']
  ];
  const STAR = ['...#...', '..###..', '#######', '.#####.', '..###..', '.##.##.', '##...##'];
  const STAR2 = ['...#...', '...#...', '..###..', '#######', '..###..', '...#...', '...#...'];

  function mkSprite(rows, col) {
    const h = rows.length, w = rows[0].length, c = document.createElement('canvas');
    c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = col || '#fff';
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (rows[y][x] === '#') g.fillRect(x, y, 1, 1);
    return c;
  }
  const SPR = {
    aliens: ALIENS.map((t) => t.map((f) => mkSprite(f))),
    cannon: mkSprite(CANNON), saucer: mkSprite(SAUCER), boom: mkSprite(BOOM), splat: mkSprite(SPLAT),
    pboom: PBOOM.map((f) => mkSprite(f)), star: mkSprite(STAR, '#ffd23f'), star2: mkSprite(STAR2, '#fff2a8')
  };

  // ---------- Filtros de color (celofán del mueble) ----------
  const FILTERS = [
    { id: 'color', name: 'color' }, { id: 'verde', name: 'verde', col: '#4dff7a' }, { id: 'ambar', name: 'ámbar', col: '#ffb43a' }
  ];
  let filterIdx = 0;
  try { filterIdx = clamp(parseInt(localStorage.getItem('invasores_filtro') || '0', 10) || 0, 0, FILTERS.length - 1); } catch (e) {}

  // ---------- Estado ----------
  let FH = 256, groundY = 244, playerY = 230, bunkerY = 198;
  let aliens = [], aliveCount = 0, spawnN = 0;
  const form = { x: 24, y: 34, dir: 1, acc: 0, frame: 0, note: 0, lastNote: 0 };
  let player = { x: LW / 2, dead: false, deadT: 0 }, invuln = 0, fireCd = 0;
  let bullet = null, bombs = [], stars = [], saucer = null, saucerT = 20, saucerSnd = 0;
  let bunkers = [], ground = new Uint8Array(LW);
  let particles = [], booms = [], popups = [], banner = null;
  let wave = 1, phase = 'spawn', phaseT = 0, fireT = 1.5, pity = 0, invaded = false;
  let attract = true, ai = { tx: LW / 2, t: 0 }, hintT = 0;
  let t = 0, shake = 0, hitstop = 0;

  const waveF = () => Math.max(0.5, 1 - 0.08 * (wave - 1));
  const stepInterval = () => (0.018 + 0.36 * Math.pow(aliveCount / 55, 1.4)) * waveF();
  const maxBombs = () => Math.min(5, 2 + Math.floor(wave / 2));
  const bombSpeed = () => Math.min(132, 62 + wave * 7);

  function layout() {
    groundY = FH - 12; playerY = FH - 26; bunkerY = FH - 58;
    bunkers.forEach((b, i) => { b.x = Math.round(LW * (i + 0.5) / 4) - 11; b.y = bunkerY; });
  }
  function makeBunkers() {
    bunkers = [];
    for (let i = 0; i < 4; i++) {
      const d = new Uint8Array(22 * 16);
      for (let y = 0; y < 16; y++) for (let x = 0; x < 22; x++) {
        const cx = x + 0.5 - 11;
        let on = y >= 9 ? true : (cx * cx) / 121 + ((y + 0.5 - 10) * (y + 0.5 - 10)) / 100 <= 1;
        const ax = x + 0.5 - 11, ay = y + 0.5 - 16.5;
        if (ax * ax + ay * ay < 4.6 * 4.6) on = false; // arco inferior
        d[y * 22 + x] = on ? 1 : 0;
      }
      const c = document.createElement('canvas'); c.width = 22; c.height = 16;
      bunkers.push({ d, c, g: c.getContext('2d'), dirty: true, x: 0, y: 0 });
    }
    layout();
  }
  function paintBunker(b) {
    const img = b.g.createImageData(22, 16);
    for (let i = 0; i < b.d.length; i++) if (b.d[i]) { img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = 255; img.data[i * 4 + 3] = 255; }
    b.g.putImageData(img, 0, 0); b.dirty = false;
  }
  function bunkerAt(px, py) {
    for (const b of bunkers) {
      const lx = Math.floor(px - b.x), ly = Math.floor(py - b.y);
      if (lx >= 0 && lx < 22 && ly >= 0 && ly < 16) return b.d[ly * 22 + lx] ? { b, lx, ly } : null;
    }
    return null;
  }
  function erode(b, lx, ly, rad) {
    const r = Math.ceil(rad);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = lx + dx, y = ly + dy; if (x < 0 || x >= 22 || y < 0 || y >= 16) continue;
      const d = Math.hypot(dx, dy);
      if (d <= rad * 0.5 || (d <= rad && Math.random() < 0.5)) b.d[y * 22 + x] = 0;
    }
    b.dirty = true;
  }

  function alienPos(a) {
    const w = SPR.aliens[a.type][0].width;
    return { x: form.x + a.c * 16 + ((16 - w) >> 1), y: form.y + a.r * 16, w, h: 8 };
  }
  function bounds() {
    let l = 1e9, r = -1e9, bot = -1e9;
    for (const a of aliens) if (a.alive) { const p = alienPos(a); l = Math.min(l, p.x); r = Math.max(r, p.x + p.w); bot = Math.max(bot, p.y + 8); }
    return { l, r, bot };
  }

  function setupWave() {
    aliens = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 11; c++) aliens.push({ r, c, type: ROW_TYPE[r], alive: true, idx: (4 - r) * 11 + c });
    aliveCount = 55; spawnN = 0; phase = 'spawn';
    form.x = 24; form.y = 34 + Math.min(wave - 1, 6) * 8; form.dir = 1; form.acc = 0; form.frame = 0;
    bombs = []; saucer = null; saucerT = rand(14, 22); fireT = 1.4; pity = 0;
    makeBunkers(); ground.fill(1);
    if (!attract) { shell.stat = wave; banner = { text: 'OLEADA ' + wave, sub: wave > 1 ? 'más abajo y más rápido' : 'defiende la base', t: 1.8 }; }
  }
  function resetPlayer() { player = { x: LW / 2, dead: false, deadT: 0 }; bullet = null; fireCd = 0.3; }
  function newGame() { attract = false; wave = 1; particles = []; booms = []; popups = []; stars = []; resetPlayer(); setupWave(); invuln = 0; hintT = 4; invaded = false; }
  function startAttract() { attract = true; wave = 1; banner = null; particles = []; booms = []; popups = []; stars = []; resetPlayer(); setupWave(); invuln = 0; }
  function nextWave() {
    if (!attract) { const bonus = 50 * wave; shell.addBase(bonus); popups.push({ x: LW / 2, y: FH * 0.55, text: '+' + bonus, col: '#5cff8a', life: 1.2 }); }
    wave++; bullet = null; setupWave();
  }

  // ---------- Efectos ----------
  function burst(x, y, n, sp, life, col) {
    for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(sp * 0.3, sp); particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.2, life: rand(life * 0.5, life), col }); }
  }
  const sfx = {
    shoot() { shell.tone(1400, 260, 0.09, 'square', 0.025); },
    kill() { shell.noise(0.16, 0.16, 2400); shell.tone(520, 70, 0.14, 'sawtooth', 0.035); },
    march(i) { const f = [116.5, 103.8, 92.5, 82.4][i]; shell.tone(f, f * 0.94, 0.12, 'square', 0.045); shell.tone(f / 2, f / 2, 0.14, 'triangle', 0.12); },
    saucer(k) { shell.tone(k ? 820 : 640, k ? 640 : 820, 0.11, 'triangle', 0.022); },
    saucerHit() { [660, 880, 1100, 1320, 1760].forEach((f, i) => shell.tone(f, f, 0.08, 'square', 0.03, i * 0.05)); shell.noise(0.3, 0.2, 1800); },
    star() { shell.tone(1320, 2200, 0.1, 'sine', 0.06); shell.tone(1760, 2640, 0.14, 'triangle', 0.04, 0.07); },
    bunker() { shell.noise(0.06, 0.08, 1200); },
    die() { shell.noise(0.8, 0.35, 700); shell.tone(220, 40, 0.7, 'sawtooth', 0.06); },
    clear() { [392, 494, 587, 784, 988].forEach((f, i) => shell.tone(f, f, 0.12, 'square', 0.035, i * 0.08)); },
    cancel() { shell.tone(900, 300, 0.06, 'square', 0.02); }
  };

  // ---------- Muertes y puntos ----------
  function killAlien(a) {
    const p = alienPos(a); a.alive = false; aliveCount--;
    booms.push({ x: p.x + p.w / 2 - 6, y: p.y, spr: SPR.boom, t: 0.2 });
    burst(p.x + p.w / 2, p.y + 4, 9, 55, 0.5);
    sfx.kill(); hitstop = Math.max(hitstop, 0.012);
    if (!attract) { shell.addBase(ROW_PTS[a.r]); shell.haptic('light'); }
    pity++;
    if (Math.random() < 0.085 || pity >= 13) { pity = 0; stars.push({ x: p.x + p.w / 2, y: p.y + 4, t: 0, ph: rand(0, TAU) }); }
  }
  function killSaucer() {
    const pts = [50, 100, 150, 200, 300][Math.floor(Math.random() * 5)];
    booms.push({ x: saucer.x + 1, y: 12, spr: SPR.boom, t: 0.35 });
    burst(saucer.x + 8, 15, 22, 80, 0.8);
    popups.push({ x: saucer.x + 8, y: 15, text: String(pts), col: '#ff4d6a', life: 1.3 });
    stars.push({ x: saucer.x + 8, y: 16, t: 0, ph: 0 });
    if (!attract) { shell.addBase(pts); shell.haptic('medium'); }
    sfx.saucerHit(); shake = Math.max(shake, 0.25); hitstop = 0.06; saucer = null;
  }
  function killPlayer(byInvasion) {
    if (player.dead) return;
    player.dead = true; player.deadT = 0; invaded = !!byInvasion; bullet = null;
    burst(player.x, playerY + 4, 34, 90, 1.1);
    sfx.die(); shake = 0.55;
    if (!attract) shell.crash();
  }
  function revive() {
    resetPlayer(); invuln = 2.6; bombs = []; stars = stars.filter((s) => s.y < playerY - 30);
    if (invaded) {
      const b = bounds(), want = bunkerY - 56;
      if (b.bot > want) form.y -= Math.ceil((b.bot - want) / 8) * 8;
      invaded = false;
    }
    form.acc = 0;
  }

  // ---------- Simulación ----------
  function stepFormation() {
    const b = bounds(), dx = (aliveCount <= 1 ? 3 : 2) * form.dir;
    if (b.r + dx > LW - 3 || b.l + dx < 3) { form.y += 8; form.dir *= -1; } else form.x += dx;
    form.frame ^= 1;
    if (t - form.lastNote > 0.075) { sfx.march(form.note); form.lastNote = t; }
    form.note = (form.note + 1) % 4;
    // los invasores se comen los búnkeres al pasar
    for (const a of aliens) if (a.alive) {
      const p = alienPos(a);
      if (p.y + 8 < bunkerY || p.y > bunkerY + 16) continue;
      for (const bk of bunkers) {
        if (p.x + p.w <= bk.x || p.x >= bk.x + 22) continue;
        for (let y = 0; y < 8; y++) for (let x = 0; x < p.w; x++) {
          const lx = p.x + x - bk.x, ly = p.y + y - bk.y;
          if (lx >= 0 && lx < 22 && ly >= 0 && ly < 16 && bk.d[ly * 22 + lx]) { bk.d[ly * 22 + lx] = 0; bk.dirty = true; }
        }
      }
    }
    const nb = bounds();
    if (nb.bot >= playerY) { if (attract) setupWave(); else killPlayer(true); }
  }

  function fireBomb() {
    const cols = [];
    for (let c = 0; c < 11; c++) { let low = null; for (const a of aliens) if (a.alive && a.c === c && (!low || a.r > low.r)) low = a; if (low) cols.push(low); }
    if (!cols.length) return;
    let shooter;
    if (Math.random() < 0.45) { let best = 1e9; for (const a of cols) { const p = alienPos(a), d = Math.abs(p.x + p.w / 2 - player.x); if (d < best) { best = d; shooter = a; } } }
    else shooter = cols[Math.floor(Math.random() * cols.length)];
    const p = alienPos(shooter);
    bombs.push({ x: Math.round(p.x + p.w / 2), y: p.y + 8, type: Math.floor(Math.random() * 3), t: 0, v: bombSpeed() * rand(0.9, 1.1) });
  }

  function updatePlayer(dt) {
    if (player.dead) return;
    let fire = false;
    if (attract) {
      ai.t -= dt;
      if (ai.t <= 0) { const live = aliens.filter((a) => a.alive); if (live.length) { const p = alienPos(live[Math.floor(Math.random() * live.length)]); ai.tx = p.x + p.w / 2; } ai.t = rand(0.5, 1.4); }
      let tx = ai.tx;
      if (saucer) tx = saucer.x + 8 + saucer.dir * 22;
      for (const s of stars) if (s.y > playerY - 50) tx = s.x;
      for (const b of bombs) if (b.y > playerY - 55 && b.y < playerY + 4 && Math.abs(b.x - player.x) < 11) tx = player.x + (b.x < player.x ? 30 : -30);
      player.x = approach(player.x, clamp(tx, 10, LW - 10), 110 * dt);
      fire = true;
    } else {
      if (keys.left || keys.right) { touchX = null; player.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 150 * dt; }
      else if (touchX != null) player.x = approach(player.x, touchX, 230 * dt);
      fire = touching || keys.fire;
    }
    player.x = clamp(player.x, 8, LW - 8);
    fireCd -= dt;
    if (fire && !bullet && fireCd <= 0 && phase !== 'clear') {
      bullet = { x: Math.round(player.x), y: playerY - 3 }; fireCd = 0.12; sfx.shoot();
    }
  }

  function updateBullet(dt) {
    if (!bullet) return;
    const steps = Math.ceil(300 * dt);
    for (let i = 0; i < steps && bullet; i++) {
      bullet.y -= 300 * dt / steps;
      const bx = bullet.x, by = bullet.y;
      if (by < 8) { booms.push({ x: bx - 4, y: 6, spr: SPR.splat, t: 0.15 }); bullet = null; break; }
      const hb = bunkerAt(bx, by) || bunkerAt(bx, by + 1);
      if (hb) { erode(hb.b, hb.lx, hb.ly, 2.6); burst(bx, by, 4, 30, 0.3); sfx.bunker(); bullet = null; break; }
      for (const a of aliens) {
        if (!a.alive || a.idx >= spawnN) continue;
        const p = alienPos(a);
        if (bx >= p.x && bx < p.x + p.w && by < p.y + 8 && by + 4 > p.y) { killAlien(a); bullet = null; break; }
      }
      if (!bullet) break;
      if (saucer && bx >= saucer.x && bx < saucer.x + 16 && by < 18 && by + 4 > 12) { killSaucer(); bullet = null; break; }
      for (let j = 0; j < bombs.length; j++) {
        const b = bombs[j];
        if (Math.abs(bx - b.x) <= 1.5 && by < b.y + 7 && by + 4 > b.y) {
          booms.push({ x: b.x - 4, y: b.y, spr: SPR.splat, t: 0.12 }); sfx.cancel(); bullet = null;
          if (b.type !== 2) bombs.splice(j, 1); // el tornillo es duro: se traga la bala
          break;
        }
      }
    }
  }

  function updateBombs(dt) {
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i]; b.t += dt;
      const steps = Math.ceil(b.v * dt) + 1; let gone = false;
      for (let k = 0; k < steps && !gone; k++) {
        b.y += b.v * dt / steps;
        const by = b.y + 7;
        for (let dx = -1; dx <= 1 && !gone; dx++) {
          const hb = bunkerAt(b.x + dx, by);
          if (hb) { erode(hb.b, hb.lx, hb.ly + 1, 3.4); burst(b.x, by, 4, 30, 0.3); gone = true; }
        }
        if (gone) break;
        if (!player.dead && b.x >= player.x - 6 && b.x <= player.x + 6 && by >= playerY + 1 && b.y <= playerY + 7) {
          gone = true;
          if (invuln <= 0) killPlayer(false); else burst(b.x, by, 5, 40, 0.3);
          break;
        }
        if (by >= groundY) {
          gone = true; booms.push({ x: b.x - 4, y: groundY - 7, spr: SPR.splat, t: 0.15 });
          for (let dx = -1; dx <= 1; dx++) if (b.x + dx >= 0 && b.x + dx < LW && Math.random() < 0.7) ground[b.x + dx] = 0;
        }
      }
      if (gone) bombs.splice(i, 1);
    }
  }

  function updateStars(dt) {
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i]; s.t += dt; s.y += 46 * dt;
      const sx = s.x + Math.sin(s.t * 4 + s.ph) * 2;
      if (!player.dead && Math.abs(sx - player.x) < 10 && s.y + 3 >= playerY && s.y - 3 <= playerY + 8) {
        stars.splice(i, 1);
        for (let k = 0; k < 10; k++) { const a = k / 10 * TAU; particles.push({ x: sx, y: s.y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, life: 0.45, col: '#ffd23f' }); }
        popups.push({ x: sx, y: playerY - 10, text: '+1 ★', col: '#ffd23f', life: 1 });
        if (!attract) { shell.coin(1); shell.haptic('medium'); }
        sfx.star(); continue;
      }
      if (s.y > groundY) { burst(sx, groundY, 5, 25, 0.4, '#ffd23f'); stars.splice(i, 1); }
    }
  }

  function updateSaucer(dt) {
    if (saucer) {
      saucer.x += saucer.dir * 40 * dt;
      saucerSnd -= dt; if (saucerSnd <= 0) { saucerSnd = 0.11; saucer.k = !saucer.k; if (!attract || shell.state === 'menu') sfx.saucer(saucer.k); }
      if (saucer.x < -20 || saucer.x > LW + 4) saucer = null;
    } else if (phase === 'play' && aliveCount >= 8) {
      saucerT -= dt;
      if (saucerT <= 0) { const d = Math.random() < 0.5 ? 1 : -1; saucer = { x: d > 0 ? -16 : LW, dir: d, k: false }; saucerT = rand(18, 28); }
    }
  }

  function sim(dt) {
    if (invuln > 0) invuln -= dt;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (hintT > 0 && touchX != null) hintT -= dt;
    if (attract && player.dead && player.deadT > 1.3) { resetPlayer(); invuln = 1.5; bombs = []; }
    updatePlayer(dt);
    updateBullet(dt);
    if (phase === 'clear') { phaseT -= dt; if (phaseT <= 0) nextWave(); }
    else if (phase === 'spawn') { spawnN += dt * 80; if (spawnN >= 55) { spawnN = 55; phase = 'play'; } }
    else if (!player.dead) {
      form.acc += dt; let g = 0;
      while (form.acc >= stepInterval() && g++ < 4 && !player.dead && aliveCount > 0) { form.acc -= stepInterval(); stepFormation(); }
      fireT -= dt;
      if (fireT <= 0) { if (bombs.length < maxBombs()) fireBomb(); fireT = clamp(1.1 - 0.09 * (wave - 1), 0.38, 1.1) * rand(0.55, 1.3); }
    }
    updateBombs(dt); updateStars(dt); updateSaucer(dt);
    if (phase === 'play' && aliveCount === 0) {
      phase = 'clear'; phaseT = 2; bombs = []; saucer = null;
      if (!attract) { banner = { text: '¡OLEADA ' + wave + '!', sub: 'superada', t: 2 }; sfx.clear(); shell.haptic('success'); }
    }
  }

  function update(dt) {
    t += dt;
    const st = shell.state;
    if (st === 'menu') { if (!attract) startAttract(); if (hitstop > 0) hitstop -= dt; else sim(dt); }
    else if (shell.playing()) { if (hitstop > 0) hitstop -= dt; else sim(dt); }
    if (player.dead) player.deadT += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.vx *= 1 - 2 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const b of booms) b.t -= dt; booms = booms.filter((b) => b.t > 0);
    for (const p of popups) { p.life -= dt; p.y -= 12 * dt; } popups = popups.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt);
    fbtn.hidden = document.getElementById('shMenu').hidden;
  }

  // ---------- Shell ----------
  const shell = Arcade.create({
    id: 'invasores', title: ['Inva', 'sores'], bg: '#020604',
    tagline: 'La formación baja paso a paso. Tú, un cañón y cuatro búnkeres.',
    how: [
      '<b>Mantén el dedo</b> en la mitad de abajo y arrástralo: el cañón te sigue y dispara solo mientras toques. Con teclado: <b>flechas</b> y <b>espacio</b>.',
      'Solo puede haber una bala tuya en pantalla, así que apunta bien. Los búnkeres te protegen, pero se desmoronan con cada impacto.',
      'Arriba vale <b>30</b>, en medio <b>20</b> y abajo <b>10</b>. El platillo misterioso da entre 50 y 300 puntos.',
      'A veces un invasor suelta una <b>estrella</b>: cázala con el cañón. Cada oleada empieza más abajo y marcha más rápido. Si te alcanzan o llegan al suelo, se acabó.'
    ],
    coinLabel: 'Estrellas', coinSingular: 'estrella', coinValue: 30, rivalTop: 8000, statLabel: 'Oleada',
    crashTitle: '¡Te han alcanzado!', reviveLabel: 'Otro cañón', reviveReward: 'un cañón nuevo', countdown: true,
    badges: () => (attract ? [] : ['Oleada ' + wave]),
    onStart() { newGame(); },
    onGo() {},
    onRevive() { revive(); },
    onMenu() { startAttract(); }
  });

  const fbtn = document.createElement('button');
  fbtn.className = 'sh-ghost iv-filter';
  const paintFilter = () => { fbtn.textContent = 'Filtro: ' + FILTERS[filterIdx].name; };
  fbtn.onclick = () => { filterIdx = (filterIdx + 1) % FILTERS.length; try { localStorage.setItem('invasores_filtro', String(filterIdx)); } catch (e) {} paintFilter(); };
  paintFilter(); document.getElementById('app').appendChild(fbtn);

  // ---------- Controles ----------
  let touching = false, touchX = null, touchId = null;
  const keys = { left: false, right: false, fire: false };
  const toLX = (cx) => clamp((cx - fx) / S, 8, LW - 8);
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault(); Arcade.audio();
    if (e.clientY < H * 0.4) return;
    touching = true; touchId = e.pointerId; touchX = toLX(e.clientX);
  });
  addEventListener('pointermove', (e) => { if (touching && e.pointerId === touchId) touchX = toLX(e.clientX); });
  const up = (e) => { if (e.pointerId === touchId) { touching = false; touchId = null; } };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'fire', ArrowUp: 'fire', w: 'fire', W: 'fire' };
  addEventListener('keydown', (e) => {
    if (e.key in KEYMAP) { if (e.target && e.target.tagName === 'BUTTON' && e.key === ' ') e.target.blur(); if (shell.state === 'play') e.preventDefault(); keys[KEYMAP[e.key]] = true; }
    if ((e.key === 'f' || e.key === 'F') && shell.state === 'menu') fbtn.onclick();
  });
  addEventListener('keyup', (e) => { if (e.key in KEYMAP) keys[KEYMAP[e.key]] = false; });
  addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; touching = false; });

  // ---------- Tamaño y capas ----------
  let W = 0, H = 0, DPR = 1, S = 1.6, fx = 0, fy = 0, safe = { t: 0, r: 0, b: 0, l: 0 };
  let buf, bctx, half, hctx, quarter, qctx, scan, back, vign, twinkles = [];
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return [c, c.getContext('2d')]; }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    const cs = getComputedStyle(probe);
    safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const top = safe.t + 64, bottom = safe.b + 10, side = Math.max(4, safe.l, safe.r);
    const aw = W - side * 2, ah = H - top - bottom;
    S = Math.max(0.5, Math.min(aw / LW, ah / 240));
    FH = Math.round(clamp(ah / S, 240, 300));
    const extra = Math.max(0, ah - FH * S);
    fx = Math.round((W - LW * S) / 2); fy = Math.round(top + extra * 0.3);
    layout();
    [buf, bctx] = mk(LW, FH); [half, hctx] = mk(LW / 2, FH / 2); [quarter, qctx] = mk(LW / 4, FH / 4);
    // líneas de barrido
    [scan] = mk(W * DPR, H * DPR); { const g = scan.getContext('2d'); const per = S * DPR >= 3 ? S * DPR : 3; g.fillStyle = 'rgba(0,0,0,0.34)';
      for (let y = ((fy * DPR) % per) - per; y < H * DPR; y += per) g.fillRect(0, y + per * 0.58, W * DPR, per * 0.42); }
    // fondo: planeta tenue y estrellas
    [back] = mk(W * DPR, H * DPR); { const g = back.getContext('2d'); g.scale(DPR, DPR);
      const R = Math.max(W, H) * 0.42, px = W * 0.82, py = fy + FH * S * 0.32;
      const gr = g.createRadialGradient(px - R * 0.3, py - R * 0.3, R * 0.1, px, py, R);
      gr.addColorStop(0, 'rgba(80,140,110,0.3)'); gr.addColorStop(0.7, 'rgba(34,80,58,0.18)'); gr.addColorStop(1, 'rgba(10,30,20,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(px, py, R, 0, TAU); g.fill();
      g.fillStyle = 'rgba(0,0,0,0.12)';
      [[-0.3, -0.2, 0.16], [0.1, 0.25, 0.11], [-0.45, 0.3, 0.08], [0.25, -0.35, 0.07], [-0.1, 0.05, 0.05]].forEach(([a, b, r]) => { g.beginPath(); g.arc(px + a * R, py + b * R, r * R, 0, TAU); g.fill(); });
      for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(200,255,220,${rand(0.08, 0.3)})`; const s = Math.random() < 0.15 ? 1.5 : 1; g.fillRect(rand(0, W), rand(0, H), s, s); }
    }
    twinkles = []; for (let i = 0; i < 18; i++) twinkles.push({ x: rand(0, W), y: rand(0, H), p: rand(0, TAU), s: rand(1, 2.5) });
    [vign] = mk(W * DPR, H * DPR); { const g = vign.getContext('2d'); g.scale(DPR, DPR);
      const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
    bunkers.forEach((b) => (b.dirty = true));
  }
  addEventListener('resize', resize);

  // ---------- Dibujo ----------
  const BOMB_PIX = [
    (f) => { const p = [0, 1, 0, -1], o = []; for (let r = 0; r < 7; r++) o.push([p[(r + f) % 4], r]); return o; },
    (f) => { const o = []; for (let r = 0; r < 7; r++) o.push([0, r]); const cr = (f * 2) % 6; o.push([-1, cr], [1, cr]); return o; },
    (f) => { const o = []; for (let r = 0; r < 7; r++) { o.push([0, r]); if ((r + f) % 3 === 0) o.push([r % 2 ? -1 : 1, r]); } return o; }
  ];
  function renderBuf() {
    const g = bctx; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, LW, FH);
    g.fillStyle = '#fff';
    for (let x = 0; x < LW; x++) if (ground[x]) g.fillRect(x, groundY, 1, 1);
    for (const b of bunkers) { if (b.dirty) paintBunker(b); g.drawImage(b.c, b.x, b.y); }
    for (const a of aliens) {
      if (!a.alive || a.idx >= spawnN) continue;
      const p = alienPos(a); g.drawImage(SPR.aliens[a.type][form.frame], p.x, p.y);
    }
    for (const b of booms) g.drawImage(b.spr, Math.round(b.x), Math.round(b.y));
    if (saucer) g.drawImage(SPR.saucer, Math.round(saucer.x), 12);
    if (!player.dead) {
      if (!(invuln > 0 && Math.floor(t * 12) % 2)) g.drawImage(SPR.cannon, Math.round(player.x) - 6, playerY);
    } else if (player.deadT < 1.1) g.drawImage(SPR.pboom[Math.floor(player.deadT * 10) % 2], Math.round(player.x) - 7, playerY);
    if (bullet) g.fillRect(bullet.x, Math.round(bullet.y), 1, 4);
    for (const b of bombs) { const f = Math.floor(b.t * 12) % 4; for (const [dx, dy] of BOMB_PIX[b.type](f)) g.fillRect(b.x + dx, Math.round(b.y) + dy, 1, 1); }
    for (const p of particles) if (!p.col) { g.globalAlpha = clamp(p.life * 2.5, 0, 1); g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    g.globalAlpha = 1;
    // celofán de colores
    g.globalCompositeOperation = 'source-atop';
    const F = FILTERS[filterIdx];
    if (F.col) { g.fillStyle = F.col; g.fillRect(0, 0, LW, FH); }
    else {
      g.fillStyle = '#ff3d5e'; g.fillRect(0, 0, LW, 26);
      g.fillStyle = '#f0fff4'; g.fillRect(0, 26, LW, bunkerY - 32);
      g.fillStyle = '#3dff6e'; g.fillRect(0, bunkerY - 6, LW, FH);
      g.fillStyle = '#fff'; g.fillRect(0, groundY + 1, LW, FH);
    }
    g.globalCompositeOperation = 'source-over';
    for (const s of stars) {
      const sx = Math.round(s.x + Math.sin(s.t * 4 + s.ph) * 2) - 3, sy = Math.round(s.y) - 3;
      g.drawImage(Math.floor(s.t * 6) % 3 === 0 ? SPR.star2 : SPR.star, sx, sy);
    }
    for (const p of particles) if (p.col) { g.fillStyle = p.col; g.globalAlpha = clamp(p.life * 2.5, 0, 1); g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    g.globalAlpha = 1;
    // brillo
    hctx.clearRect(0, 0, half.width, half.height); hctx.imageSmoothingEnabled = true; hctx.drawImage(buf, 0, 0, half.width, half.height);
    qctx.clearRect(0, 0, quarter.width, quarter.height); qctx.imageSmoothingEnabled = true; qctx.drawImage(half, 0, 0, quarter.width, quarter.height);
  }

  function text(str, x, y, size, col, glow) {
    ctx.font = `${Math.round(size)}px ${PIX}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = col; ctx.shadowBlur = glow == null ? 12 : glow; ctx.fillStyle = col; ctx.fillText(str, x, y); ctx.shadowBlur = 0;
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#020604'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(back, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const s of twinkles) { const a = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + s.p)); ctx.fillStyle = `rgba(210,255,225,${a})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
    renderBuf();
    let sx = 0, sy = 0;
    if (shake > 0) { const m = Math.min(1, shake * 2) * 5; sx = rand(-m, m); sy = rand(-m, m); }
    ctx.save(); ctx.translate(sx, sy);
    const fw = LW * S, fh = FH * S;
    ctx.imageSmoothingEnabled = false; ctx.drawImage(buf, fx, fy, fw, fh);
    ctx.imageSmoothingEnabled = true; ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5; ctx.drawImage(half, fx, fy, fw, fh);
    ctx.globalAlpha = 0.55; ctx.drawImage(quarter, fx - S * 2, fy - S * 2, fw + S * 4, fh + S * 4);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // textos
    for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); text(p.text, fx + p.x * S, fy + p.y * S, Math.max(9, S * 6), p.col, 10); }
    ctx.globalAlpha = 1;
    if (banner && !attract) {
      const a = clamp(banner.t * 3, 0, 1), cy = fy + fh * 0.5;
      ctx.globalAlpha = a;
      text(banner.text, W / 2, cy, Math.min(26, S * 10), '#5cff8a', 18);
      if (banner.sub) text(banner.sub.toUpperCase(), W / 2, cy + Math.min(26, S * 10) * 1.4, Math.min(11, S * 4.5), '#d8ffe4', 8);
      ctx.globalAlpha = 1;
    }
    if (!attract && hintT > 0 && (shell.state === 'play' || shell.state === 'count')) {
      ctx.globalAlpha = clamp(hintT, 0, 1) * (0.6 + 0.3 * Math.sin(t * 5));
      const hy = Math.min(H - safe.b - 16, fy + fh + Math.max(14, (H - safe.b - fy - fh) / 2));
      text('◀ ARRASTRA AQUÍ ▶', W / 2, hy, Math.max(9, Math.min(12, S * 5)), '#8fbf9f', 6);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(scan, 0, 0); ctx.drawImage(vign, 0, 0);
  }

  // ---------- Bucle ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); shell.paintHud();
    requestAnimationFrame(frame);
  }
  resize(); startAttract();
  requestAnimationFrame(frame);

  window.__game = {
    shell,
    get wave() { return wave; }, get phase() { return phase; }, get alive() { return aliveCount; },
    get player() { return player; }, get bullet() { return bullet; }, get bombs() { return bombs; }, get stars() { return stars; },
    get saucer() { return saucer; }, get form() { return form; }, get bunkers() { return bunkers; }, get invuln() { return invuln; },
    get FH() { return FH; }, get playerY() { return playerY; },
    killAll(keep) { let n = keep || 0; for (const a of aliens) if (a.alive) { if (n > 0) { n--; continue; } a.alive = false; aliveCount--; } },
    killOne() { const a = aliens.find((x) => x.alive); if (a) killAlien(a); },
    dropStar(x) { stars.push({ x: x == null ? player.x : x, y: playerY - 40, t: 0, ph: 0 }); },
    spawnSaucer() { saucer = { x: -16, dir: 1, k: false }; },
    hitPlayer() { invuln = 0; bombs.push({ x: Math.round(player.x), y: playerY - 10, type: 0, t: 0, v: 100 }); },
    invade() { form.y = playerY - 70; form.acc = 99; },
    bomb() { fireBomb(); }
  };
})();
</script>
</body>
</html>
