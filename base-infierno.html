<style>
/* Layout: vista en primera persona a pantalla completa; arriba el marcador común, el objetivo y el escáner; abajo la barra de vida/blindaje/munición, con el joystick encima a la izquierda y el botón de fuego a la derecha */
:root {
  --bg: #060406;
  --ink: #f3ece4;
  --muted: #a99d93;
  --panel: rgba(20, 13, 12, 0.92);
  --line: rgba(255, 120, 60, 0.24);
  --accent: #ff5a1f;
  --onaccent: #1c0700;
  --gold: #ffc83d;
  --ongold: #2a1b00;
  --goldline: rgba(255, 200, 61, 0.42);
  --goldtint: rgba(255, 200, 61, 0.1);
  --veil: rgba(6, 3, 3, 0.4);
  --shadow: rgba(0, 0, 0, 0.6);
  --hp: #ff4d4d;
  --ar: #4da3ff;
  --display: "Black Ops One", Impact, "Arial Black", system-ui, sans-serif;
  --body: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
#app { background: #cfe3f2; }
.sh-logo { letter-spacing: .02em; text-shadow: 0 3px 0 #3a0e02, 0 0 22px rgba(255, 90, 31, .45); }
.sh-hud { background: linear-gradient(180deg, rgba(10,8,12,.55), rgba(10,8,12,.28) 70%, transparent); padding-bottom: 14px !important; }
.sh-stat .k { color: #e9e2da; text-shadow: 0 1px 3px #000; }
.sh-stat .v { text-shadow: 0 2px 6px rgba(0,0,0,.8); }
.sh-logo .a { color: #e9e2da; text-shadow: 0 3px 0 #2a2422, 0 0 18px rgba(255, 220, 200, .18); }

.bi-ui { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.bi-obj { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 66px); display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 140px); }
.bi-obj .t { font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px 5px 8px; border-radius: 10px; background: rgba(10, 6, 6, .62); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 7px; width: max-content; max-width: 100%; }
.bi-obj .t i { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: 0 0 8px currentColor; }
.bi-obj .t.go { color: #8dffb0; }
.bi-obj .k { font-size: 12px; color: #e6ddd4; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 8px; background: rgba(10,6,6,.55); width: max-content; text-shadow: 0 1px 3px #000; }
.bi-obj .k b { color: var(--ink); }
.bi-map { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 64px); width: 92px; height: 92px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,140,80,.35), 0 6px 20px rgba(0,0,0,.5); }
.bi-boss { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 166px); width: min(260px, 64%); text-align: center; font-family: var(--display); font-size: 13px; letter-spacing: .12em; color: #ffb07a; text-shadow: 0 1px 6px #000; }
.bi-boss .bar { margin-top: 4px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,140,80,.5); overflow: hidden; }
.bi-boss .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3a1a, #ffb020); transform-origin: left; }
.bi-cross { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; opacity: .85; transition: transform .08s; }
.bi-cross::before, .bi-cross::after { content: ""; position: absolute; background: #fff; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
.bi-cross::before { left: 14px; top: 3px; width: 2px; height: 24px; clip-path: polygon(0 0, 100% 0, 100% 34%, 0 34%, 0 66%, 100% 66%, 100% 100%, 0 100%); }
.bi-cross::after { top: 14px; left: 3px; height: 2px; width: 24px; clip-path: polygon(0 0, 34% 0, 34% 100%, 0 100%, 0 0, 66% 0, 100% 0, 100% 100%, 66% 100%); }
.bi-cross.on::before, .bi-cross.on::after { background: #ff4a3a; }
.bi-cross.hit { transform: scale(1.35) rotate(45deg); }
.bi-dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px #000; opacity: .9; }
.bi-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 0, 0, .75) 100%); opacity: 0; }
.bi-tint { position: absolute; inset: 0; opacity: 0; }
.bi-fade { position: absolute; inset: 0; background: #000; opacity: 0; }
.bi-msg { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%); text-align: center; font-family: var(--display); font-size: clamp(26px, 8.5vw, 40px); line-height: 1.05; color: var(--ink); text-shadow: 0 3px 0 #000, 0 0 24px rgba(255, 90, 31, .6); white-space: nowrap; opacity: 0; }
.bi-msg small { display: block; font-family: var(--body); font-weight: 700; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #ffb07a; margin-top: 6px; }
.bi-msg.show { animation: biMsg 2.2s ease-out forwards; }
@keyframes biMsg { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.8); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 22% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -58%); } }
.bi-pop { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); font-family: var(--display); font-size: 20px; color: var(--gold); text-shadow: 0 2px 0 #000; white-space: nowrap; opacity: 0; }
.bi-pop.show { animation: biPop 1.1s ease-out forwards; }
@keyframes biPop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -24px); } }
.bi-note { position: absolute; left: 50%; bottom: calc(var(--barh) + 10px); transform: translateX(-50%); font-size: 13px; font-weight: 700; letter-spacing: .06em; padding: 5px 11px; border-radius: 10px; background: rgba(10,6,6,.7); border: 1px solid rgba(255,255,255,.1); white-space: nowrap; opacity: 0; transition: opacity .25s; }
.bi-note.show { opacity: 1; }

:root { --barh: calc(64px + env(safe-area-inset-bottom, 0px)); }
.bi-bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--barh); box-sizing: border-box; padding: 5px max(6px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 5px) max(6px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1.05fr 1.15fr 0.8fr 1.15fr 0.6fr; gap: 4px; background: linear-gradient(180deg, #6b655c 0, #4a453f 8%, #3a3631 100%); border-top: 3px solid #9a9286; box-shadow: 0 -2px 0 #24211e, inset 0 1px 0 rgba(255,255,255,.15); }
.bi-c { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; background: linear-gradient(180deg, #2a2724, #34302b); box-shadow: inset 0 2px 3px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.08); min-width: 0; overflow: hidden; }
.bi-c b { font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; color: #ff4a2a; text-shadow: 0 2px 0 #000; white-space: nowrap; }
.bi-c b small { font-size: 16px; }
.bi-c span { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #cfc6b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bi-c.am b { color: #ffc23a; }
.bi-c.ar b { color: #6fb4ff; }
.bi-c.hp.low b { animation: biLow .6s steps(2) infinite; }
@keyframes biLow { 50% { opacity: .4; } }
.bi-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; font-family: var(--display); font-size: 17px; }
.bi-slots i { font-style: normal; color: #5f584f; text-align: center; min-width: 14px; }
.bi-slots i.own { color: #ffc23a; }
.bi-slots i.cur { color: #fff; text-shadow: 0 0 6px #ffc23a; }
.bi-key { width: 18px; height: 26px; border-radius: 3px; border: 1px dashed rgba(255,255,255,.25); }
.bi-key.on { border: 0; box-shadow: 0 0 10px currentColor; background: linear-gradient(180deg, currentColor 0 62%, #fff 62% 72%, currentColor 72%); }
.bi-hpflash { animation: biHp .4s ease-out; }
@keyframes biHp { 0% { transform: scale(1.25); } }

.bi-ctl { position: absolute; inset: 0; z-index: 4; touch-action: none; }
.bi-joy { position: absolute; width: 124px; height: 124px; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--barh) + 16px); border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: radial-gradient(circle, rgba(0,0,0,.28), rgba(0,0,0,.18) 65%, rgba(0,0,0,.1)); box-shadow: 0 0 0 1px rgba(0,0,0,.3); pointer-events: none; transition: opacity .2s; opacity: .75; }
.bi-joy.on { opacity: 1; transition: none; }
.bi-joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.85), rgba(200,200,200,.5)); border: 1px solid rgba(0,0,0,.35); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.bi-fire, .bi-swap { position: absolute; border-radius: 50%; pointer-events: none; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: var(--display); color: #fff; text-shadow: 0 1px 3px #000; }
.bi-fire { width: 92px; height: 92px; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(var(--barh) + 18px); background: radial-gradient(circle at 50% 40%, rgba(255, 110, 40, .85), rgba(170, 30, 0, .75) 70%); border: 2px solid rgba(255, 220, 190, .85); box-shadow: 0 0 22px rgba(255, 80, 20, .35); font-size: 13px; letter-spacing: .08em; }
.bi-fire svg { width: 34px; height: 34px; margin-bottom: 2px; }
.bi-fire.on { transform: scale(.93); background: radial-gradient(circle at 50% 40%, rgba(255, 170, 80, .8), rgba(220, 50, 0, .6) 70%); }
.bi-swap { width: 60px; height: 60px; right: max(32px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(var(--barh) + 124px); background: rgba(20, 14, 12, .72); border: 2px solid rgba(255,255,255,.6); font-size: 10px; letter-spacing: .06em; }
.bi-swap svg { width: 26px; height: 26px; }
.bi-swap.on { transform: scale(.92); border-color: var(--gold); }
.bi-swap.off { opacity: .35; }

.bi-done { position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: auto; }
.bi-done .card { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 8px; animation: biUp .35s ease-out; }
@keyframes biUp { from { transform: translateY(24px); opacity: 0; } }
.bi-done h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; text-align: center; color: var(--accent); }
.bi-done .row { display: flex; justify-content: space-between; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.07); padding: 5px 2px; }
.bi-done .row span { color: var(--muted); }
.bi-done .row b { font-variant-numeric: tabular-nums; }
.bi-done .tot { font-family: var(--display); font-size: 22px; text-align: center; color: var(--gold); margin-top: 4px; }
.bi-done .nx { font-size: 12px; text-align: center; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .bi-msg.show, .bi-pop.show, .bi-done .card { animation-duration: .01s; } }
</style>
</head>
<body>

  <canvas id="c" aria-label="Juego Base Infierno: un puesto militar en el desierto, en primera persona"></canvas>

      <div class="bi-c ar" id="biArBox"><b><span id="biAr" style="all:unset">0</span><small>%</small></b><span>Blindaje</span></div>

    <div class="bi-fade" id="biFade"></div>

  <div class="bi-ctl" id="biCtl" hidden>

    <div class="bi-swap" id="biSwap"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3 1.4-1.4L21 9l-5.6 5.4L14 13l3-3H4zM20 16H7l3 3-1.4 1.4L3 15l5.6-5.4L10 11l-3 3h13z" fill="#fff"/></svg><span id="biSwapTx">ARMA</span></div>
    <div class="bi-fire" id="biFire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#fff"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#fff" stroke-width="2"/></svg>FUEGO</div>
  </div>
  <div class="bi-done" id="biDone" hidden><div class="card" id="biDoneCard"></div></div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const V3 = THREE.Vector3;

  // =====================================================================
  // Motor
  // =====================================================================
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  const DPR_MAX = Math.min(window.devicePixelRatio || 1, 1.25);
  let DPR = Math.min(DPR_MAX, 1);
  renderer.setPixelRatio(DPR);
  renderer.autoClear = false;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdbe6ee);
  scene.fog = new THREE.Fog(0xdbe6ee, 30, 115);
  const camera = new THREE.PerspectiveCamera(80, 1, 0.05, 130);
  camera.rotation.order = 'YXZ';
  const vmScene = new THREE.Scene();
  const vmCam = new THREE.PerspectiveCamera(60, 1, 0.01, 5);
  let viewW = 1, viewH = 1, pointScale = 300;
  const vmBase = new V3(0.12, -0.16, -0.42);
  function resize() {
    viewW = canvas.clientWidth || innerWidth; viewH = canvas.clientHeight || innerHeight;
    renderer.setSize(viewW, viewH, false);
    const a = viewW / viewH;
    camera.aspect = a; camera.fov = a < 0.75 ? 96 : a < 1.2 ? 80 : 62; camera.updateProjectionMatrix();
    vmCam.aspect = a; vmCam.fov = a < 0.75 ? 64 : 56; vmCam.updateProjectionMatrix();
    const hh = Math.tan(vmCam.fov * Math.PI / 360) * 0.6, hw = hh * a;
    vmBase.set(0.02, -hh * 0.6, -0.6);
    pointScale = viewH * DPR / (2 * Math.tan(camera.fov * Math.PI / 360));
    partGlow.mat.uniforms.uScale.value = pointScale; partGoo.mat.uniforms.uScale.value = pointScale; halo.mat.uniforms.uScale.value = pointScale;
  }

  const hemi = new THREE.HemisphereLight(0xdfeeff, 0x8a7258, 0.22); scene.add(hemi);
  // Luces dinámicas (siempre 3, para no recompilar shaders): fogonazo, proyectil/explosión, baliza del objetivo
  const DL = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xffffff, 0, 10, 2); scene.add(l); return l; });
  const vmAmb = new THREE.AmbientLight(0xffffff, 0.5); vmScene.add(vmAmb);
  const vmDir = new THREE.DirectionalLight(0xfff2e0, 0.75); vmDir.position.set(0.6, 1, 0.8); vmScene.add(vmDir);
  const vmFlashL = new THREE.PointLight(0xffaa55, 0, 1.2, 2); vmScene.add(vmFlashL);

  // =====================================================================
  // Texturas procedurales
  // =====================================================================
  function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function grain(g, w, h, amt, tint) {
    const d = g.getImageData(0, 0, w, h), a = d.data;
    for (let i = 0; i < a.length; i += 4) { const n = (Math.random() - 0.5) * amt; a[i] += n * (tint ? tint[0] : 1); a[i + 1] += n * (tint ? tint[1] : 1); a[i + 2] += n * (tint ? tint[2] : 1); }
    g.putImageData(d, 0, 0);
  }
  function toTex(c, nearest) {
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (nearest !== false) t.magFilter = THREE.NearestFilter;
    t.anisotropy = 4; return t;
  }
  function rivet(g, x, y) { g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x, y + 1, 3, 2); g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(x, y, 2, 2); }
  function streaks(g, S, n, a) { for (let i = 0; i < n; i++) { const x = Math.random() * S, y = Math.random() * S, l = rand(8, 46); const gr = g.createLinearGradient(0, y, 0, y + l); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x, y, rand(1, 3), l); } }
  function texMetal(base, rust) {
    const S = 128, c = mkC(S, S), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, S, S); grain(g, S, S, 22);
    for (let py = 0; py < 2; py++) for (let px = 0; px < 2; px++) {
      const x = px * 64, y = py * 64;
      g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + 2, y + 2, 60, 2); g.fillRect(x + 2, y + 2, 2, 60);
      g.fillStyle = 'rgba(0,0,0,.32)'; g.fillRect(x + 2, y + 60, 60, 2); g.fillRect(x + 60, y + 2, 2, 60);
      g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(x, y, 64, 1); g.fillRect(x, y, 1, 64);
      rivet(g, x + 6, y + 6); rivet(g, x + 55, y + 6); rivet(g, x + 6, y + 55); rivet(g, x + 55, y + 55);
    }
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 30, S, 3); g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, 33, S, 1);
    streaks(g, S, 18, 0.22);
    if (rust) for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(${140 + Math.random() * 60 | 0},${60 + Math.random() * 30 | 0},20,${rand(0.08, 0.3)})`; const r = rand(1, 5); g.fillRect(Math.random() * S, Math.random() * S, r, r * rand(1, 3)); }
    return toTex(c);
  }
  function texTech() {
    const S = 256, c = mkC(S, S), g = c.getContext('2d'), e = mkC(S, S), ge = e.getContext('2d');
    g.fillStyle = '#8f9aa6'; g.fillRect(0, 0, S, S); grain(g, S, S, 18);
    ge.fillStyle = '#000'; ge.fillRect(0, 0, S, S);
    // tubería vertical
    const pg = g.createLinearGradient(14, 0, 40, 0); pg.addColorStop(0, '#15181d'); pg.addColorStop(0.4, '#6a7280'); pg.addColorStop(1, '#16191e');

      <div class="row"><span>Bonus de nivel</span><b>+${Arcade.fmt(lvBonus)}</b></div>
      ${clean ? `<div class="row"><span>Limpieza total</span><b>+${Arcade.fmt(clean)}</b></div>` : ''}

  function nextLevel() {

  let fadeA = 0, last = performance.now(), T = 0, fpsAcc = 0, fpsN = 0, frameN = 0;
  const camShake = new V3();

    const ctlOn = playing && phase === 'play';

    if (playing) {

      if (phase === 'lift' || phase === 'complete') eye = P.eyeY + Math.min(1.6, phaseT * phaseT * 1.2);
      const bobA = Math.min(1, P.speed / 7.6), bobY = Math.abs(Math.sin(P.bob)) * 0.045 * bobA, bobX = Math.cos(P.bob) * 0.02 * bobA;
      P.shake = Math.max(0, P.shake - dt * 2.4);
      const sk = REDUCED ? 0 : P.shake * P.shake * 0.12;
      camera.position.set(P.x + Math.cos(P.yaw) * bobX + rand(-1, 1) * sk, eye + bobY + rand(-1, 1) * sk, P.z - Math.sin(P.yaw) * bobX + rand(-1, 1) * sk);

    }

    dl1Hold -= dt;
    let pl = null, pd = 1e9; for (const p of projs) { if (!p.on) continue; const d = p.p.distanceToSquared(camera.position); if (d < pd) { pd = d; pl = p; } }
    if (dl1Hold > 0) DL[1].intensity = Math.max(0, DL[1].intensity - dt * 6);
    else if (pl) { DL[1].color.copy(PCOLS[pl.kind]); DL[1].intensity = 1.4; DL[1].distance = 6; DL[1].position.copy(pl.p); }
    else DL[1].intensity = Math.max(0, DL[1].intensity - dt * 10);
    const pulse = 0.75 + 0.25 * Math.sin(T * 4);
    if (!P.key && keyPickup && !keyPickup.taken) { DL[2].color.setHex(KEYS[(level - 1) % KEYS.length].c); DL[2].intensity = 1.5 * pulse; DL[2].distance = 7; DL[2].position.set(keyPickup.x, 1.4, keyPickup.z); }
    else if (liftObj) { DL[2].color.setHex(P.key ? 0x3dff8a : KEYS[(level - 1) % KEYS.length].c); DL[2].intensity = (P.key ? 1.8 : 0.9) * pulse; DL[2].distance = 8; DL[2].position.set(liftObj.userData.x, 2.2, liftObj.userData.z); }

  }
  function updateProjectiles(dt) {
    for (const p of projs) {
      if (!p.on) continue;

  const _co = new THREE.Object3D();

        if (h < halo.cap) { halo.pos[h * 3] = c.x; halo.pos[h * 3 + 1] = _co.position.y; halo.pos[h * 3 + 2] = c.z; halo.col[h * 3] = 0.15; halo.col[h * 3 + 1] = 0.45; halo.col[h * 3 + 2] = 0.5; halo.size[h] = 0.75; halo.alpha[h] = 1; h++; }

    halo.geo.attributes.position.needsUpdate = true; halo.geo.attributes.color.needsUpdate = true; halo.geo.attributes.size.needsUpdate = true; halo.geo.attributes.alpha.needsUpdate = true;
  }
  const _vmEnv = new THREE.Color(0.3, 0.3, 0.3);
  function updateViewmodel(dt, now) {
    vmGuns.forEach((g, i) => (g.visible = i === P.cur));
    const g = vmGuns[P.cur];
    P.kick = Math.max(0, P.kick - dt * 7);

    vm.position.set(vmBase.x + Math.cos(P.bob) * 0.03 * bobA, vmBase.y - Math.abs(Math.sin(P.bob)) * 0.022 * bobA - swap - P.kick * 0.03, vmBase.z + P.kick * 0.09);

    vmFlashL.position.copy(g.userData.muzzle); vmFlashL.position.y += 0.05; vmFlashL.position.z += 0.1; vmFlashL.intensity = Math.max(0, vmFlashL.intensity - dt * 30);

  resize();
  setupLevel(3, true);
  joyHome();
  requestAnimationFrame(frame);

  // ---------- Ganchos de prueba ----------
  window.__free = (x, z) => !isSolid(cellOf(x), cellOf(z));
  window.__game = {

    get phase() { return phase; }, get level() { return level; }, get enemies() { return enemies; }, get pickups() { return pickups; }, get coins() { return coins; },

    toKey() { const k = keyPickup; if (k && !k.taken) { P.x = k.x + 0.3; P.z = k.z; } },

    giveAll() { P.weapons = [true, true, true]; P.ammo = { shells: 50, cells: 200 }; paintHudOwn(); },

    killAll() { enemies.forEach((e) => { if (!e.dead) kill(e); }); },
    spawn(type, d) { const o = { x: P.x - Math.sin(P.yaw) * (d || 5), z: P.z - Math.cos(P.yaw) * (d || 5) }; collide(o, 0.8); const e = spawnEnemy(type, o.x, o.z, true); killsTotal++; return e; },
