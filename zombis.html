<!doctype html>

<style>
/* Layout: ciudad nocturna en pixel art a ancho completo; el suelo queda abajo y las azoteas suben hacia el marcador */
:root {
  --bg: #0a0818;
  --ink: #f3eeff;
  --muted: #a9a1c9;
  --panel: rgba(16, 12, 34, 0.92);
  --line: rgba(160, 230, 120, 0.24);
  --accent: #8ff05a;
  --onaccent: #0d2a06;
  --gold: #ffd23f;
  --ongold: #2a1c00;
  --goldline: rgba(255, 210, 63, 0.45);
  --goldtint: rgba(255, 210, 63, 0.1);
  --veil: rgba(6, 4, 16, 0.42);
  --shadow: rgba(0, 0, 0, 0.55);
  --display: "Pixelify Sans", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
#app > canvas { image-rendering: pixelated; }
.sh-logo { letter-spacing: .02em; text-shadow: 0 3px 0 #2c5a14, 0 0 18px rgba(143, 240, 90, .35); }
.sh-logo .a { color: #f3eeff; text-shadow: 0 3px 0 #3a2f5c, 0 0 18px rgba(255, 240, 200, .25); }
.sh-stat .v { text-shadow: 0 2px 0 rgba(0,0,0,.6); }
</style>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const lo = document.createElement('canvas'), L = lo.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const approach = (v, t, s) => (Math.abs(t - v) <= s ? t : v + Math.sign(t - v) * s);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const FONT = '"Pixelify Sans", "Arial Black", system-ui, sans-serif';
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- Física (unidades = píxeles virtuales) ----------
  const GRAV = 900, HOLD_G = 360, V0 = 245, V_DBL = 225, HOLD_MAX = 0.22, MAXFALL = 430, FASTFALL = 400;
  const HW = 4, HH = 13, SH = 7, PXM = 10, ZONE_M = 250, MAX_UP = 36;

  // ---------- Sprites pixel art (con contorno automático) ----------
  function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
  function outline(src) {
    const w = src.width + 2, h = src.height + 2, c = mk(w, h), x = c.getContext('2d');
    x.drawImage(src, 1, 1);
    const d = x.getImageData(0, 0, w, h), a = d.data, op = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) op[i] = a[i * 4 + 3] > 40 ? 1 : 0;
    for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
      const i = y * w + X; if (op[i]) continue;
      if ((X > 0 && op[i - 1]) || (X < w - 1 && op[i + 1]) || (y > 0 && op[i - w]) || (y < h - 1 && op[i + w])) { a[i * 4] = 14; a[i * 4 + 1] = 8; a[i * 4 + 2] = 22; a[i * 4 + 3] = 255; }
    }
    x.putImageData(d, 0, 0);
    const wc = mk(w, h), wx = wc.getContext('2d'); wx.drawImage(c, 0, 0); wx.globalCompositeOperation = 'source-in'; wx.fillStyle = '#fff'; wx.fillRect(0, 0, w, h);
    return { c, w, h, white: wc };
  }
  function fromMap(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map((r) => r.length)), c = mk(w, h), x = c.getContext('2d');
    for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) { const ch = rows[j][i]; if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); } }
    return outline(c);
  }
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = (v) => clamp(Math.round(v * k), 0, 255);
    return '#' + [f(n >> 16 & 255), f(n >> 8 & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, '0')).join('');
  }

  // Protagonista: Leo, chaval de sudadera roja, gorra azul y mochila
  const HERO_PAL = { c: '#2f55d4', C: '#1c3290', h: '#5b3420', s: '#f4b98f', S: '#cf8a64', e: '#1a1020', r: '#e8343c', R: '#a51f2d', L: '#ff7a68', p: '#45a052', P: '#2c6a37', j: '#3e5fbf', J: '#283f86', w: '#f4f0e8', g: '#8e8aa0' };
  const GOLD_PAL = Object.assign({}, HERO_PAL, { w: '#ffd23f', g: '#c47f10' });
  const BLANK = '.............';
  const UP = [
    '....ccccc....',
    '...cccccccCC.',
    '...hhsssss...',
    '...hsssses...',
    '....sSsssS...',
    '..PPrrrrrL...',
    '..PprrrrrRs..',
    '..PprRrrrRs..',
    '..PprrrrrR...',
    '...RrrrrrR...'];
  const UP_JUMP = [
    '....ccccc....',
    '...cccccccCC.',
    '...hhsssss.s.',
    '...hsssses.s.',
    '....sSsssSr..',
    '..PPrrrrrLr..',
    '..PprrrrrR...',
    '..PprRrrrR...',
    '..PprrrrrR...',
    '...RrrrrrR...'];
  const LEGS = {
    r0: ['....jjjjJ....', '...jjJ..jjJ..', '..jjJ....jJ..', '.wwJ.....ww..', '.ww.......ww.'],
    r1: ['....jjjjJ....', '....jjJjJ....', '....jJ.jJ....', '....jJ.ww....', '...ww..ww....'],
    r2: ['....jjjjJ....', '....jJ.jjj...', '...jJ...jjJ..', '...ww....jw..', '..ww.....ww..'],
    r3: ['....jjjjJ....', '....jjjjJ....', '.....jJjJ....', '.....wwjJ....', '.....wwww....'],
    jump: ['....jjjjJ....', '...jjjjjjJ...', '..wwJ..jjJ...', '..ww...www...', BLANK],
    fall: ['....jjjjJ....', '....jJ.jjJ...', '...jJ...jjJ..', '..wwJ....ww..', '..ww.....ww..']
  };
  const SLIDE = [
    '...ccccc........',
    '..ccccccCC......',
    '..hssssess......',
    'PPhsSsss........',
    'PPrrrrrrLjjjj...',
    'PPrRrrrrrjjjJjww',
    '.PRrrrrrRJJ..www'];
  function heroSet(pal) {
    return {
      run: [LEGS.r0, LEGS.r1, LEGS.r2, LEGS.r3].map((lg, i) => fromMap(i % 2 ? [BLANK, ...UP, ...lg.slice(1)] : [...UP, ...lg], pal)),
      jump: fromMap([...UP_JUMP, ...LEGS.jump], pal), fall: fromMap([...UP, ...LEGS.fall], pal), slide: fromMap(SLIDE, pal)
    };
  }

  // Zombis originales
  const WALK_TOP = [
    '....zzzz....',
    '...zzzzzz...',
    '..zZzzzzzz..',
    '..yyzzyyzZ..',
    '..zzzzzzzZ..',
    '..zmmmzzZ...',
    '...zzzzZ....'];
  const WALK_A = ['zzzttttttT..', 'zZttttttTT..', '...ttTtttT..', '...tttttTT..', '...ttttTTT..', '...nnnnnN...', '...nnN.nN...', '...nN..nN...', '..nN...nN...', '..ff...ff...'];
  const WALK_B = ['...ttttttT..', 'zzzZttttTT..', 'zZ.ttTtttT..', '...tttttTT..', '...ttttTTT..', '...nnnnnN...', '...nN.nnN...', '....nN.nN...', '....nN..nN..', '....ff..ff..'];
  const RUN_A = ['zzzttttttT..', 'zZttttttTT..', '...ttTtttT..', '...tttttTT..', '...ttttTTT..', '...nnnnnN...', '..nnN..nNN..', '.nN.....nN..', 'nN.......nN.', 'ff.......ff.'];
  const RUN_B = ['...ttttttT..', 'zzzZttttTT..', 'zZ.ttTtttT..', '...tttttTT..', '...ttttTTT..', '...nnnnnN...', '....nnNN....', '....nNnN....', '...nN.nN....', '...ff.ff....'];
  const CRAWL_A = ['..zzz...........', '.zzzzz...tttt...', 'yzyzzZ.ttttttTT.', 'zzzzzZttttttTTnn', 'mmzZzzzTTTTTnnNf', '.zz..zz....nN.ff', 'zz....zz........'];
  const CRAWL_B = ['..zzz...........', '.zzzzz...tttt...', 'yzyzzZ.ttttttTT.', 'zzzzzZttttttTTnn', 'mmzZzzzTTTTTnnNf', '..zzzz.....nN.ff', '..zz.zz.........'];
  const BRUTE_TOP = [
    '......zzzzz.......',
    '.....zzzzzzz......',
    '.....yyzzyyZ......',
    '.....zzzzzzZ......',
    '.....zmmmmZ.......',
    '...oooozzZoooo....',
    '..ooooooooooooo...',
    'zzzoooooooooooOO..',
    'zzZzooooooooooOOz.',
    'zZ..ooooooooooOOzz',
    '....ozzzzzzzzoOOzZ',
    '....ozzzzzzzzzOO..',
    '....oozzzzzzzoOO..',
    '....nnnnnnnnnnN...'];
  const BRUTE_A = ['....nnnnNnnnnnN...', '....nnnN...nnnN...', '....nnN.....nnN...', '....nnN.....nnN...', '...ffff....ffff...'];
  const BRUTE_B = ['....nnnnNnnnnnN...', '.....nnnN.nnnN....', '.....nnN..nnN.....', '.....nnN..nnN.....', '....ffff.ffff.....'];
  const HANDS_A = ['z..z....z..z', 'zz.zz..zz.zz', 'zzzzz..zzzzz', '.zzzZ..zzzZ.', '..zzZ..zzZ..', '..zZ....zZ..', '..zZ....zZ..', '..tT....tT..', '..tT....tT..', '..tT....tT..'];
  const HANDS_B = ['.z.z....z.z.', '.zzzz..zzzz.', '.zzzzz.zzzzz', '.zzzZ..zzzZ.', '..zzZ..zzZ..', '..zZ....zZ..', '..zZ....zZ..', '..tT....tT..', '..tT....tT..', '..tT....tT..'];
  function zpal(base) {
    const p = Object.assign({ z: '#86b35a', y: '#fff27a', m: '#3a0f1c', t: '#7a5aa8', n: '#3c3550', f: '#2a2030', o: '#4a3a5e' }, base);
    p.Z = p.Z || shade(p.z, 0.66); p.T = p.T || shade(p.t, 0.62); p.N = p.N || shade(p.n, 0.62); p.O = p.O || shade(p.o, 0.62);
    return p;
  }
  const SHIRTS = ['#7a5aa8', '#4f7fa8', '#a85a5a'];

  const COIN_MAPS = [
    ['..yyyy..', '.yYYYYo.', 'yYYOOYYo', 'yYYOYYYo', 'yYYOYYYo', 'yYYOOYYo', '.yYYYYo.', '..oooo..'],
    ['..yyy...', '.yYYYo..', '.yYOYo..', '.yYOYo..', '.yYOYo..', '.yYOYo..', '.yYYYo..', '..ooo...'],
    ['...yy...', '..yYo...', '..yYo...', '..yYo...', '..yYo...', '..yYo...', '..yYo...', '...o....'],
    ['...y....', '...Y....', '...Y....', '...Y....', '...Y....', '...Y....', '...Y....', '...o....']];
  const COIN_PAL = { y: '#fff4b0', Y: '#ffd23f', O: '#e0a020', o: '#b87a10' };
  const POW_MAPS = {
    shield: [['.bbbbbbb.', 'bwwbbbbbB', 'bwbbbbbbB', 'bbbbbbbbB', 'bbbbbbbbB', '.bbbbbbB.', '..bbbbB..', '...bbB...', '....B....'], { b: '#5ac8ff', B: '#2a6ab8', w: '#eaffff' }],
    magnet: [['ww.....ww', 'ww.....ww', 'rr.....rr', 'rr.....rr', 'rrr...rrr', '.rrrrrrr.', '..rrrrr..'], { w: '#f4f4ff', r: '#ff4a5a' }],
    shoes: [['......ww.', '....wwww.', '..yy.ww..', '.yyyy....', 'yyyyyyyy.', 'yYYYYYYYy', 'ggggggggg'], { w: '#ffffff', y: '#ffd23f', Y: '#ff9a2a', g: '#7a5a20' }]
  };
  const CONE = ['..o..', '.ooo.', '.www.', '.ooo.', 'ooooo', 'KKKKK'];

  let SPR = null;
  function buildSprites() {
    const walk = SHIRTS.map((t) => { const p = zpal({ t }); return [fromMap([...WALK_TOP, ...WALK_A], p), fromMap([...WALK_TOP, ...WALK_B], p)]; });
    const rp = zpal({ z: '#a3bccb', Z: '#6a8396', y: '#ff4a3a', t: '#e07a28', n: '#2e3a4a' });
    const cp = zpal({ z: '#7fa868', y: '#d2ff6a', t: '#6d6a74', n: '#3a3446' });
    const bp = zpal({ z: '#8aa070', y: '#ffb02e', o: '#4a3a5e', n: '#5a4630', f: '#2a1e14' });
    const hp = zpal({ t: '#4f7fa8' });
    SPR = {
      hero: heroSet(HERO_PAL), gold: heroSet(GOLD_PAL), walk,
      run: [fromMap([...WALK_TOP, ...RUN_A], rp), fromMap([...WALK_TOP, ...RUN_B], rp)],
      crawl: [fromMap(CRAWL_A, cp), fromMap(CRAWL_B, cp)],
      brute: [fromMap([...BRUTE_TOP, ...BRUTE_A], bp), fromMap([...BRUTE_TOP, ...BRUTE_B], bp)],
      hands: [fromMap(HANDS_A, hp), fromMap(HANDS_B, hp)],
      coin: COIN_MAPS.map((m) => fromMap(m, COIN_PAL)),
      pow: Object.fromEntries(Object.entries(POW_MAPS).map(([k, [m, p]]) => [k, fromMap(m, p)])),
      cone: fromMap(CONE, { o: '#ff7a1a', w: '#f4f0e8', K: '#3a3040' }),
      cars: ['#7a3b3b', '#3b5a6e', '#6e6a3b', '#4e3b6e'].map(carSprite),
      dumpster: dumpsterSprite()
    };
  }
  function carSprite(col) {
    const c = mk(36, 17), x = c.getContext('2d'), R = mulberry(col.length * 977 + parseInt(col.slice(1), 16));
    x.fillStyle = col; x.fillRect(0, 7, 36, 5); x.fillRect(6, 1, 23, 7); x.fillRect(4, 4, 3, 4); x.fillRect(29, 4, 3, 4);
    x.fillStyle = shade(col, 1.45); x.fillRect(6, 1, 23, 1); x.fillRect(0, 7, 5, 1); x.fillRect(30, 7, 6, 1);
    x.fillStyle = shade(col, 0.7); x.fillRect(0, 11, 36, 1);
    x.fillStyle = '#1b2236'; x.fillRect(8, 2, 9, 5); x.fillRect(19, 2, 8, 5);
    x.fillStyle = '#7f93c4'; x.fillRect(9, 2, 1, 1); x.fillRect(10, 3, 1, 1); x.fillRect(12, 4, 1, 1); x.fillRect(11, 5, 1, 1); x.fillRect(20, 2, 2, 1);
    for (let i = 0; i < 7; i++) { x.fillStyle = R() < 0.5 ? '#6a3a20' : shade(col, 0.75); x.fillRect((R() * 34) | 0, 8 + ((R() * 3) | 0), 2, 1); }
    x.fillStyle = '#3a3646'; x.fillRect(0, 12, 36, 1);
    x.fillStyle = '#121018'; x.fillRect(4, 11, 8, 6); x.fillRect(24, 11, 8, 6);
    x.fillStyle = '#6a6578'; x.fillRect(6, 13, 4, 2); x.fillRect(26, 13, 4, 2);
    x.fillStyle = '#ffe9a0'; x.fillRect(0, 8, 2, 2); x.fillStyle = '#ff3040'; x.fillRect(34, 8, 2, 2);
    return outline(c);
  }
  function dumpsterSprite() {
    const c = mk(26, 15), x = c.getContext('2d');
    x.fillStyle = '#2f6a3e'; x.fillRect(1, 3, 24, 10);
    x.fillStyle = '#24502f'; x.fillRect(0, 0, 26, 3); x.fillStyle = '#4f9a5e'; x.fillRect(0, 0, 26, 1);
    x.fillStyle = '#245030'; for (let i = 4; i < 24; i += 5) x.fillRect(i, 4, 1, 8);
    x.fillStyle = '#7a4a24'; x.fillRect(3, 9, 3, 1); x.fillRect(17, 6, 2, 1); x.fillRect(20, 10, 3, 1);
    x.fillStyle = '#e85ab0'; x.fillRect(8, 6, 6, 1); x.fillRect(9, 7, 1, 2); x.fillRect(12, 7, 2, 1);
    x.fillStyle = '#121018'; x.fillRect(3, 13, 3, 2); x.fillRect(20, 13, 3, 2);
    return outline(c);
  }
  function buildFacade(w, h, seed) {
    const R = mulberry(seed), top = 26, c = mk(w, h + top), x = c.getContext('2d');
    const base = ['#2b2440', '#30263a', '#24283e', '#2d2236', '#332a3c'][(R() * 5) | 0];
    x.fillStyle = base; x.fillRect(0, top, w, h);
    for (let i = 0; i < (w * h) / 12; i++) { x.fillStyle = R() < 0.55 ? shade(base, 0.82) : shade(base, 1.14); x.fillRect((R() * w) | 0, top + ((R() * h) | 0), 2, 1); }
    x.fillStyle = shade(base, 0.7); x.fillRect(w - 2, top, 2, h); x.fillStyle = shade(base, 1.3); x.fillRect(0, top, 1, h);
    const gx = 11, gy = 14, cols = Math.max(1, Math.floor((w - 8) / gx)), ox = Math.floor((w - cols * gx) / 2) + 3;
    for (let wy = top + 9; wy < top + h - 18; wy += gy) for (let k = 0; k < cols; k++) {
      const wx = ox + k * gx, r = R();
      if (r < 0.17) { x.fillStyle = '#ffcf6e'; x.fillRect(wx, wy, 5, 7); x.fillStyle = '#fff1b8'; x.fillRect(wx + 1, wy + 1, 2, 3); x.fillStyle = '#c9893a'; x.fillRect(wx, wy + 6, 5, 1); }
      else if (r < 0.4) { x.fillStyle = '#0b0814'; x.fillRect(wx, wy, 5, 7); x.fillStyle = '#3a3456'; x.fillRect(wx + 3, wy, 2, 2); x.fillRect(wx, wy + 5, 1, 2); }
      else if (r < 0.52) { x.fillStyle = '#6a4626'; x.fillRect(wx - 1, wy + 1, 7, 2); x.fillRect(wx - 1, wy + 4, 7, 2); x.fillStyle = '#16101e'; x.fillRect(wx, wy, 5, 1); }
      else { x.fillStyle = '#1b1830'; x.fillRect(wx, wy, 5, 7); x.fillStyle = '#5f5a92'; x.fillRect(wx + 3, wy + 1, 1, 2); }
      x.fillStyle = shade(base, 0.6); x.fillRect(wx - 1, wy + 7, 7, 1);
    }
    // puerta a pie de calle
    const dx = 4 + ((R() * Math.max(1, w - 16)) | 0);
    x.fillStyle = '#120d1c'; x.fillRect(dx, top + h - 13, 8, 13); x.fillStyle = shade(base, 1.4); x.fillRect(dx - 1, top + h - 14, 10, 1);
    // cornisa iluminada por la luna
    x.fillStyle = '#4a3f62'; x.fillRect(0, top, w, 4); x.fillStyle = '#a39ad0'; x.fillRect(0, top, w, 1); x.fillStyle = '#231c33'; x.fillRect(0, top + 4, w, 1);
    // cosas en la azotea
    const r = R();
    if (r < 0.32 && w > 50) {
      const tx = 6 + ((R() * (w - 26)) | 0);
      x.fillStyle = '#3a2a22'; x.fillRect(tx + 2, top - 6, 1, 6); x.fillRect(tx + 11, top - 6, 1, 6);
      x.fillStyle = '#6a4a34'; x.fillRect(tx, top - 18, 14, 12); x.fillStyle = '#8a6448'; x.fillRect(tx, top - 18, 2, 12);
      x.fillStyle = '#4a3020'; x.fillRect(tx, top - 14, 14, 1); x.fillRect(tx, top - 10, 14, 1);
      x.fillStyle = '#2a1e18'; x.fillRect(tx - 1, top - 21, 16, 3); x.fillRect(tx + 3, top - 23, 8, 2);
    } else if (r < 0.6) {
      const tx = 4 + ((R() * (w - 12)) | 0);
      x.fillStyle = '#5a566a'; x.fillRect(tx, top - 22, 1, 22); x.fillRect(tx - 3, top - 18, 7, 1); x.fillRect(tx - 2, top - 13, 5, 1);
      x.fillStyle = '#ff3040'; x.fillRect(tx, top - 23, 1, 1);
    }
    if (R() < 0.6 && w > 40) { const ax = 4 + ((R() * (w - 18)) | 0); x.fillStyle = '#4c4860'; x.fillRect(ax, top - 6, 10, 6); x.fillStyle = '#6c6884'; x.fillRect(ax, top - 6, 10, 1); x.fillStyle = '#26232f'; x.fillRect(ax + 2, top - 4, 6, 3); }
    return { c, top };
  }

  // ---------- Capas de fondo ----------
  let BG = null;
  function buildBackground() {
    const R = mulberry(1234);
    const far = mk(420, 150), f = far.getContext('2d');
    for (let x = 0; x < 420;) {
      const w = 12 + ((R() * 30) | 0), h = 36 + ((R() * 100) | 0);
      f.fillStyle = '#1b1938'; f.fillRect(x, 150 - h, w, h);
      if (R() < 0.3) { f.fillRect(x + (w >> 1), 150 - h - 8, 1, 8); }
      for (let wy = 150 - h + 4; wy < 146; wy += 5) for (let wx = x + 2; wx < x + w - 2; wx += 4) if (R() < 0.09) { f.fillStyle = R() < 0.5 ? '#6a5a3a' : '#8a7444'; f.fillRect(wx, wy, 1, 2); f.fillStyle = '#1b1938'; }
      x += w + ((R() * 3) | 0);
    }
    const mid = mk(480, 190), m = mid.getContext('2d');
    for (let x = 0; x < 480;) {
      const w = 26 + ((R() * 44) | 0), h = 60 + ((R() * 120) | 0), y0 = 190 - h;
      m.fillStyle = '#130f28'; m.fillRect(x, y0, w, h);
      // azotea rota
      for (let k = 0; k < w; k += 3) { const d = R() < 0.35 ? (R() * 10) | 0 : 0; if (d) m.clearRect(x + k, y0, 3, d); }
      m.fillStyle = '#2c2756'; m.fillRect(x + w - 1, y0 + 6, 1, h - 6);
      for (let wy = y0 + 8; wy < 184; wy += 9) for (let wx = x + 3; wx < x + w - 4; wx += 7) {

        L.fillStyle = 'rgba(200,190,255,' + (0.35 + 0.15 * Math.sin(T * 2 + k)) + ')'; L.fillRect(px + (pw2 >> 1) - 2, py, 4, 1);

  }
  function drawScaffold(p) {

    L.fillStyle = '#5c6274';

    L.fillStyle = '#8a90a3'; L.fillRect(x + 3, y + 3, 1, yb - y - 3); L.fillRect(x + w - 5, y + 3, 1, yb - y - 3);
    L.fillStyle = '#4a4f60';
    const hgt = yb - y - 3;
    for (let k = 0; k < hgt; k += 2) { const t = k / hgt; L.fillRect(Math.round(x + 5 + t * (w - 10)), y + 3 + k, 1, 1); L.fillRect(Math.round(x + w - 6 - t * (w - 10)), y + 3 + k, 1, 1); }

  }
  function drawFacade(p) {

  }
  function drawCable(c) {
    const x = sx(c.x), y0 = sy(-84), y1 = sy(-11);
    L.fillStyle = '#1d1a28'; L.fillRect(x - 12, y0 - 2, 2, sy(0) - y0 + 2); L.fillRect(x - 12, y0 - 2, 13, 2);
    if (c.dead) { L.fillStyle = '#2a2638'; L.fillRect(x, y0, 1, 10); return; }
    const sway = Math.sin(c.t * 3) * 1.5;
    L.fillStyle = '#141018';
    for (let yy = y0; yy < y1; yy++) { const k = (yy - y0) / (y1 - y0); L.fillRect(Math.round(x + sway * k * k), yy, 1, 1); }

    if (Math.random() < 0.5) { L.fillStyle = '#eaffff'; L.fillRect(ex + irand(-3, 3), y1 + irand(-2, 3), 1, 1); L.fillStyle = '#7ad0ff'; L.fillRect(ex + irand(-4, 4), y1 + irand(-3, 4), 1, 1); }
    L.globalCompositeOperation = 'source-over';
  }
  function drawZombie(z) {
    const x = sx(z.x), y = sy(z.y);
    if (x < -30 || x > VW + 30) return;
    let s;
    const fr = Math.floor(z.t * (z.type === 'runner' && z.active ? 10 : z.type === 'brute' ? 3 : 4)) % 2;
    if (z.type === 'walker') s = SPR.walk[z.v][fr];
    else if (z.type === 'runner') s = SPR.run[z.active ? fr : 0];
    else if (z.type === 'crawler') s = SPR.crawl[fr];
    else if (z.type === 'brute') s = SPR.brute[fr];
    else {
      // alcantarilla
      const shakeX = z.state === 'rattle' ? irand(-1, 1) : 0, lidUp = z.state === 'up';
      if (z.state === 'rattle' || lidUp) { L.globalCompositeOperation = 'lighter'; L.fillStyle = 'rgba(140,255,100,0.25)'; L.fillRect(x - 7, y - 3, 14, 3); L.globalCompositeOperation = 'source-over'; }
      L.fillStyle = '#0c0a12'; L.fillRect(x - 6, y, 12, 2);
      if (!lidUp) { L.fillStyle = '#2a2636'; L.fillRect(x - 7 + shakeX, y - 1 - (z.state === 'rattle' && Math.random() < 0.5 ? 1 : 0), 14, 2); L.fillStyle = '#5a566a'; L.fillRect(x - 6 + shakeX, y - 1, 12, 1); }
      else { L.fillStyle = '#2a2636'; L.fillRect(x + 9, y - 4, 2, 4); L.fillStyle = '#5a566a'; L.fillRect(x + 9, y - 4, 1, 4); }
      if (z.rise <= 0) return;

      L.save(); L.beginPath(); L.rect(x - 10, y - 30, 20, 30); L.clip();
      if (z.dead) { const k = clamp(z.dT / 0.25, 0, 1); spr(s, x, y + s.h * k, { white: z.dT < 0.08 }); }

      L.restore();

    }
    if (z.dead) {
      if (z.knock) { spr(s, x + z.dT * 60, y - z.dT * 50 + z.dT * z.dT * 300, { rot: z.dT * 10, white: z.dT < 0.08 }); return; }
      const k = clamp(z.dT / 0.25, 0, 1);

  function draw() {
    L.setTransform(1, 0, 0, 1, 0, 0);
    drawBackground();
    L.save();
    const shx = shake > 0 ? Math.round(rand(-1, 1) * shake) : 0, shy = shake > 0 ? Math.round(rand(-1, 1) * shake) : 0;

    L.fillStyle = vignette; L.fillRect(0, 0, VW, VH);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lo, 0, 0, VW, VH, 0, 0, VW * S, VH * S);

    const st = shell.state;

    else if (st === 'play') { sim(dt); if (bannerT > 0) bannerT -= dt; }
    else if (st === 'dying') simDeath(dt);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 1 - 2 * dt; p.life -= dt; }
