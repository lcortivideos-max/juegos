<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Noche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Outfit:wght@400;600;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: autopista 3D a pantalla completa con cámara tras el coche; arriba el HUD común y debajo el tiempo y el progreso al control; abajo freno, velocímetro y nitro */
:root {
  --bg: #07041a;
  --ink: #f4f0ff;
  --muted: #a9a2d6;
  --panel: rgba(12, 8, 34, 0.88);
  --line: rgba(190, 160, 255, 0.22);
  --accent: #ff2e88;
  --onaccent: #fff3f8;
  --gold: #ffd166;
  --ongold: #2b1d00;
  --goldline: rgba(255, 209, 102, 0.4);
  --goldtint: rgba(255, 209, 102, 0.1);
  --veil: rgba(5, 3, 20, 0.42);
  --shadow: rgba(0, 0, 0, 0.55);
  --cyan: #2ef2ff;
  --bad: #ff4d5e;
  --good: #3ddc97;
  --display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --body: "Outfit", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
#app { background: #07041a; }
.tn-top { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 60px); display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; width: min(300px, calc(100% - 28px)); }
.tn-time { display: flex; align-items: baseline; gap: 8px; }
.tn-time .k { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.tn-time .v { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 0 0 18px rgba(46, 242, 255, .55), 0 2px 8px rgba(0,0,0,.6); min-width: 2.6ch; text-align: center; }
.tn-time .v small { font-size: 22px; opacity: .8; }
.tn-time.low .v { color: var(--bad); text-shadow: 0 0 18px rgba(255, 77, 94, .8); animation: tnPulse .5s ease-in-out infinite alternate; }
@keyframes tnPulse { to { transform: scale(1.08); } }
.tn-time.add .v { animation: tnAdd .6s ease-out; }
@keyframes tnAdd { 0% { transform: scale(1.5); color: var(--good); } 100% { transform: scale(1); } }
.tn-prog { width: 100%; display: flex; flex-direction: column; gap: 3px; }
.tn-prog .row { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.tn-prog .row b { color: var(--ink); font-weight: 800; }
.tn-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.tn-bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--cyan)); box-shadow: 0 0 10px var(--cyan); }
.tn-heat { width: 100%; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .14em; color: #ff8a9a; }
.tn-heat .tn-bar { flex: 1; height: 7px; }
.tn-heat .tn-bar i { background: linear-gradient(90deg, #3d7bff, #ff2e4d); box-shadow: 0 0 10px #ff2e4d; }
.tn-heat.hot { animation: tnBlink .35s steps(2) infinite; }
@keyframes tnBlink { 50% { color: #8fb3ff; } }

.tn-combo { position: absolute; z-index: 5; left: max(12px, env(safe-area-inset-left, 0px)); top: 42%; display: flex; flex-direction: column; gap: 4px; pointer-events: none; transition: opacity .2s; }
.tn-combo .x { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--gold); text-shadow: 0 0 14px rgba(255, 209, 102, .7); }
.tn-combo .k { font-size: 10px; letter-spacing: .2em; color: var(--muted); font-weight: 800; }
.tn-combo .tn-bar { width: 64px; height: 4px; }
.tn-combo .tn-bar i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tn-combo.off { opacity: 0; }

.tn-ctrl { position: absolute; z-index: 6; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; font-family: var(--display); color: #fff; touch-action: none; -webkit-user-select: none; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tn-nitro { right: max(16px, env(safe-area-inset-right, 0px)); width: 96px; height: 96px; background: radial-gradient(circle at 50% 35%, #7ff8ff, #1aa6ff 45%, #2a2fbf 100%); box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 0 26px rgba(46, 242, 255, .55), inset 0 -6px 14px rgba(0,0,40,.5); font-size: 15px; letter-spacing: .06em; text-shadow: 0 1px 4px rgba(0,0,60,.7); transition: filter .15s, transform .08s; }
.tn-nitro.empty { filter: grayscale(.85) brightness(.55); box-shadow: 0 0 0 3px rgba(255,255,255,.1); }
.tn-nitro.ready { animation: tnReady 1s ease-in-out infinite alternate; }
@keyframes tnReady { to { box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 0 40px rgba(46, 242, 255, .95), inset 0 -6px 14px rgba(0,0,40,.5); } }
.tn-nitro.on { transform: scale(.93); filter: brightness(1.3); }
.tn-segs { display: flex; gap: 4px; margin-top: 6px; }
.tn-segs i { width: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; position: relative; }
.tn-segs i b { position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(0); box-shadow: 0 0 6px #fff; }
.tn-brake { left: max(16px, env(safe-area-inset-left, 0px)); width: 72px; height: 72px; background: radial-gradient(circle at 50% 35%, #ff7a8a, #c4123a 60%, #6a0820); box-shadow: 0 0 0 3px rgba(255,255,255,.14), 0 0 18px rgba(255, 46, 77, .4), inset 0 -5px 12px rgba(40,0,10,.5); font-size: 12px; letter-spacing: .08em; transition: transform .08s, filter .15s; }
.tn-brake.on { transform: scale(.92); filter: brightness(1.25); }
.tn-nitro:focus-visible, .tn-brake:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.tn-speed { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 128px; height: 74px; pointer-events: none; text-align: center; }
.tn-speed svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tn-speed .v { position: absolute; left: 0; right: 0; bottom: 14px; font-family: var(--display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(255, 46, 136, .6), 0 2px 6px rgba(0,0,0,.7); }
.tn-speed .u { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 800; letter-spacing: .22em; color: var(--muted); }

.tn-shade { position: absolute; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top, 0px) + 175px); z-index: 4; pointer-events: none; background: linear-gradient(180deg, rgba(5,3,20,.72), rgba(5,3,20,.4) 55%, rgba(5,3,20,0)); }
.tn-pol { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; box-shadow: inset 34px 0 50px -20px rgba(255, 30, 60, .85), inset -34px 0 50px -20px rgba(40, 90, 255, .85); }
.tn-pol.flip { box-shadow: inset 34px 0 50px -20px rgba(40, 90, 255, .85), inset -34px 0 50px -20px rgba(255, 30, 60, .85); }
.tn-nfx { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(46, 242, 255, .28) 80%, rgba(120, 80, 255, .45)); transition: opacity .25s; }
.tn-dmg { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(255, 40, 40, .55)); }

.tn-pops { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.tn-pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); white-space: nowrap; text-align: center; text-shadow: 0 0 16px currentColor, 0 2px 6px rgba(0,0,0,.8); animation: tnPop 1.1s ease-out forwards; }
.tn-pop small { display: block; font-family: var(--body); font-weight: 800; font-size: .55em; letter-spacing: .1em; }
@keyframes tnPop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 70% { opacity: 1; transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -100%) scale(.95); } }
.tn-banner { position: absolute; z-index: 7; left: 50%; top: 31%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-family: var(--display); white-space: nowrap; }
.tn-banner .a { font-size: clamp(30px, 10vw, 44px); color: var(--ink); text-shadow: 0 0 22px var(--accent), 0 3px 10px rgba(0,0,0,.7); }
.tn-banner .b { font-family: var(--body); font-weight: 800; font-size: 14px; letter-spacing: .28em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-top: 4px; }
.tn-banner.show { animation: tnBan 2.2s ease-out forwards; }
@keyframes tnBan { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
.tn-hint { position: absolute; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; pointer-events: none; white-space: nowrap; transition: opacity .5s; }
.tn-hint .ar { font-family: var(--display); color: var(--cyan); font-size: 16px; }
.tn-hint.off { opacity: 0; }
@media (max-height: 600px) { .tn-time .v { font-size: 32px; } .tn-nitro { width: 84px; height: 84px; } .tn-brake { width: 62px; height: 62px; } }
@media (prefers-reduced-motion: reduce) { .tn-pop, .tn-banner.show, .tn-time.low .v, .tn-nitro.ready { animation-duration: .01s; animation-iteration-count: 1; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Turbo Noche: carrera nocturna por la autopista"></canvas>
  <div class="tn-shade" id="tnShade" hidden></div>
  <div class="tn-pol" id="tnPol"></div>
  <div class="tn-nfx" id="tnNfx"></div>
  <div class="tn-dmg" id="tnDmg"></div>
  <div class="tn-top" id="tnTop" hidden>
    <div class="tn-time" id="tnTimeBox"><span class="k">Tiempo</span><span class="v" id="tnTime">35</span></div>
    <div class="tn-prog">
      <div class="row"><span id="tnStage">Etapa <b>1</b> · Ciudad</span><span id="tnCp">Control 1.500 m</span></div>
      <div class="tn-bar"><i id="tnProg"></i></div>
    </div>
    <div class="tn-heat" id="tnHeat" hidden><span>POLICÍA</span><div class="tn-bar"><i id="tnHeatBar"></i></div></div>
  </div>
  <div class="tn-combo off" id="tnCombo"><span class="k">COMBO</span><span class="x" id="tnComboX">x2</span><div class="tn-bar"><i id="tnComboBar"></i></div></div>
  <div class="tn-speed" id="tnSpeedBox" hidden>
    <svg viewBox="0 0 128 74" aria-hidden="true">
      <path d="M10 66 A54 54 0 0 1 118 66" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6" stroke-linecap="round"/>
      <path id="tnArc" d="M10 66 A54 54 0 0 1 118 66" fill="none" stroke="url(#tnGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="170"/>
      <defs><linearGradient id="tnGrad" x1="0" x2="1"><stop offset="0" stop-color="#2ef2ff"/><stop offset=".6" stop-color="#ff2e88"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs>
    </svg>
    <span class="v" id="tnSpeed">0</span><span class="u">KM/H</span>
  </div>
  <button class="tn-ctrl tn-brake" id="tnBrake" aria-label="Frenar" hidden>FRENO</button>
  <button class="tn-ctrl tn-nitro empty" id="tnNitro" aria-label="Nitro" hidden>NITRO<span class="tn-segs"><i><b></b></i><i><b></b></i><i><b></b></i></span></button>
  <div class="tn-hint off" id="tnHint"><span class="ar">‹</span>Toca un lado para girar<span class="ar">›</span></div>
  <div class="tn-pops" id="tnPops"></div>
  <div class="tn-banner" id="tnBanner" hidden><div class="a" id="tnBanA"></div><div class="b" id="tnBanB"></div></div>
</div>
<script src="config.js"></script>
<script src="vendor/three.min.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = (v) => Math.floor(v).toLocaleString('es-ES');

  // ---------- Ajustes ----------
  const CP = 1500;              // metros entre controles
  const LANES = [-4.8, -1.6, 1.6, 4.8];
  const ROAD_HALF = 6.4, EDGE = 6.9, CAR_HW = 0.95, CAR_HL = 2.2;
  const START_TIME = 40, REVIVE_TIME = 20;
  const THEMES = [
    { name: 'Ciudad', top: '#05031c', mid: '#1c0b44', hor: '#ff2e88', fog: '#2a0f45', silo: '#130829', hemiS: 0x9a8cff, hemiG: 0x301040, hemiI: 1.0, moonI: 0.55, edge: '#2ef2ff', stars: 0.5, ground: ['#100b20', '#1a1230', '#100b20', '#1a1230'] },
    { name: 'Costa', top: '#020720', mid: '#0b2456', hor: '#3fb6cf', fog: '#0f2a4c', silo: '#081631', hemiS: 0x8ab8ff, hemiG: 0x10283a, hemiI: 1.0, moonI: 0.7, edge: '#ff4fd8', stars: 1, ground: ['#0e1d1a', '#17271f', '#3a3228', '#0a2a4a'] },
    { name: 'Desierto', top: '#1b0a33', mid: '#7a2a5c', hor: '#ff9a40', fog: '#6b2c45', silo: '#3a1630', hemiS: 0xffb08a, hemiG: 0x5a2a20, hemiI: 1.2, moonI: 0.5, edge: '#ffb347', stars: 0.15, ground: ['#5a2c1f', '#7a4128', '#7a4128', '#5a2c1f'] }
  ];
  THEMES.forEach((t) => { ['top', 'mid', 'hor', 'fog', 'silo', 'edge'].forEach((k) => (t[k + 'C'] = new THREE.Color(t[k]))); t.groundC = t.ground.map((c) => new THREE.Color(c)); });
  const themeIdx = (stageI) => ((stageI % 3) + 3) % 3;

  // ---------- Trazado ----------
  let PH = [0, 1, 2, 3, 4];
  function newTrack() { PH = PH.map(() => Math.random() * 100); }
  const A1 = 55, L1 = 420, A2 = 26, L2 = 190, A3 = 9, L3 = 97, B1 = 8, M1 = 230, B2 = 3.5, M2 = 105;
  const TX = (s) => A1 * Math.sin(s / L1 + PH[0]) + A2 * Math.sin(s / L2 + PH[1]) + A3 * Math.sin(s / L3 + PH[2]);
  const TDX = (s) => A1 / L1 * Math.cos(s / L1 + PH[0]) + A2 / L2 * Math.cos(s / L2 + PH[1]) + A3 / L3 * Math.cos(s / L3 + PH[2]);
  const TDDX = (s) => -(A1 / L1 / L1 * Math.sin(s / L1 + PH[0]) + A2 / L2 / L2 * Math.sin(s / L2 + PH[1]) + A3 / L3 / L3 * Math.sin(s / L3 + PH[2]));
  const TY = (s) => B1 * Math.sin(s / M1 + PH[3]) + B2 * Math.sin(s / M2 + PH[4]);
  const TDY = (s) => B1 / M1 * Math.cos(s / M1 + PH[3]) + B2 / M2 * Math.cos(s / M2 + PH[4]);

  let sP = 0, refX = 0, refY = 0; // posición del jugador en la pista
  function trackPos(s, lat, h, out) {
    const dx = TDX(s), n = Math.sqrt(1 + dx * dx);
    out.x = TX(s) - refX + lat / n; out.y = TY(s) - refY + h; out.z = -(s - sP) + lat * dx / n;
    return dx;
  }
  function place(o, s, lat, h, yaw, pitch) {
    const dx = trackPos(s, lat, h, o.position);
    o.rotation.set(pitch ? Math.atan(TDY(s)) : 0, -Math.atan(dx) + (yaw || 0), 0);
  }

  // ---------- Escena ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 620);
  scene.add(camera);
  let baseFov = 62;
  function resize() {
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    baseFov = w / h < 0.7 ? 66 : w / h < 1 ? 60 : 52; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  scene.fog = new THREE.Fog(0x2a0f45, 40, 300);

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  const radial = (stops) => canvasTex(64, 64, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); stops.forEach(([o, c]) => r.addColorStop(o, c)); g.fillStyle = r; g.fillRect(0, 0, w, w); });
  const glowTex = radial([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]);
  const softTex = radial([[0, 'rgba(255,255,255,.9)'], [1, 'rgba(255,255,255,0)']]);
  const streakTex = canvasTex(32, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.35, 'rgba(255,255,255,.75)'); gr.addColorStop(0.6, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const sg = g.createLinearGradient(0, 0, w, 0); sg.addColorStop(0, 'rgba(0,0,0,1)'); sg.addColorStop(0.5, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,1)');
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = sg; g.fillRect(0, 0, w, h);
  });
  const beamTex = canvasTex(64, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, h, 0, 0); gr.addColorStop(0, 'rgba(255,240,210,.15)'); gr.addColorStop(0.25, 'rgba(255,240,210,.6)'); gr.addColorStop(0.6, 'rgba(255,240,210,.3)'); gr.addColorStop(1, 'rgba(255,240,210,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(w * 0.32, h); g.lineTo(w * 0.68, h); g.lineTo(w, 0); g.lineTo(0, 0); g.closePath(); g.fill();
  });
  function sprite(color, size, opacity, tex) {
    const m = new THREE.SpriteMaterial({ map: tex || glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: opacity == null ? 1 : opacity });
    const s = new THREE.Sprite(m); s.scale.set(size, size, 1); return s;
  }
  const addMat = (color, tex, opacity) => new THREE.MeshBasicMaterial({ map: tex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: opacity == null ? 1 : opacity });
  function flatPlane(w, l, mat) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), mat); m.rotation.x = -Math.PI / 2; return m; }
  function box(g, w, h, l, x, y, z, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat); m.position.set(x, y, z); g.add(m); return m; }

  // Luces
  const hemi = new THREE.HemisphereLight(0x9a8cff, 0x301040, 1.0); scene.add(hemi);
  const moon = new THREE.DirectionalLight(0xc8d0ff, 0.55); moon.position.set(-10, 40, -120); scene.add(moon);
  const headL = new THREE.PointLight(0xfff0d8, 1.1, 46, 1.6); scene.add(headL);
  const fillL = new THREE.PointLight(0xffffff, 0.7, 12, 2); scene.add(fillL);

  // Cielo con degradado que sigue a la cámara
  const skyGeo = new THREE.SphereGeometry(520, 24, 16);
  const skyCol = new Float32Array(skyGeo.attributes.position.count * 3);
  skyGeo.setAttribute('color', new THREE.BufferAttribute(skyCol, 3));
  const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -10; scene.add(sky);
  const starGeo = new THREE.BufferGeometry(), starPos = new Float32Array(360 * 3);
  for (let i = 0; i < 360; i++) { const a = Math.random() * Math.PI * 2, e = rand(0.12, 1.3), r = 500; starPos[i * 3] = Math.cos(a) * Math.cos(e) * r; starPos[i * 3 + 1] = Math.sin(e) * r; starPos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, depthWrite: false }));

        c.on = false; c.o.visible = false; shell.coin(1); nitro = Math.min(3, nitro + 0.06);
        shell.tone(988, 1480, 0.08, 'square', 0.035); shell.tone(1480, 1976, 0.1, 'triangle', 0.03, 0.06);
        emit(car.position.x, 1.2, car.position.z - 1, 10, 0xffd166, 3, 3);
      }
    }

    // Controles y tiempo
    if (play) {
      if (sP >= nextCP) passCheckpoint();
      timer -= dt;
      if (timer < 10 && Math.ceil(timer) !== lastBeep && timer > 0) { lastBeep = Math.ceil(timer); shell.tone(1200, 1200, 0.06, 'square', 0.04); }
      if (timer <= 0) { timer = 0; crashOut('time'); }
      if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
      if (invuln > 0) invuln -= dt;
      shell.setBase(Math.floor(dist / 4) + bonus);
    }
    return ds;
  }

  // ---------- Pintado ----------
  const wT = [1, 0, 0];
  const curTop = new THREE.Color(), curMid = new THREE.Color(), curHor = new THREE.Color(), curFog = new THREE.Color();
  const skyY = (() => { const p = skyGeo.attributes.position, a = new Float32Array(p.count); for (let i = 0; i < p.count; i++) a[i] = p.getY(i) / 520; return a; })();
  function mixTheme(key, out) { out.setRGB(0, 0, 0); for (let t = 0; t < 3; t++) { const c = THEMES[t][key + 'C']; out.r += c.r * wT[t]; out.g += c.g * wT[t]; out.b += c.b * wT[t]; } return out; }
  function updateTheme(dt) {
    themeWeightsAt(sP + 40, W3);
    const k = 1 - Math.pow(0.25, dt);
    for (let t = 0; t < 3; t++) wT[t] = lerp(wT[t], W3[t], k);
    mixTheme('top', curTop); mixTheme('mid', curMid); mixTheme('hor', curHor); mixTheme('fog', curFog);
    scene.fog.color.copy(curFog);
    const c = skyGeo.attributes.color.array;
    for (let i = 0; i < skyY.length; i++) {
      const e = skyY[i];
      if (e < 0) tmpC.copy(curFog);
      else if (e < 0.08) tmpC.copy(curFog).lerp(curHor, e / 0.08);
      else if (e < 0.4) tmpC.copy(curHor).lerp(curMid, (e - 0.08) / 0.32);
      else tmpC.copy(curMid).lerp(curTop, Math.min(1, (e - 0.4) / 0.5));
      c[i * 3] = tmpC.r; c[i * 3 + 1] = tmpC.g; c[i * 3 + 2] = tmpC.b;
    }
    skyGeo.attributes.color.needsUpdate = true;
    let hi = 0, mi = 0;
    for (let t = 0; t < 3; t++) { hi += THEMES[t].hemiI * wT[t]; mi += THEMES[t].moonI * wT[t]; }
    hemi.intensity = hi; moon.intensity = mi;
    hemi.color.setRGB(0, 0, 0); hemi.groundColor.setRGB(0, 0, 0);
    for (let t = 0; t < 3; t++) { tmpC2.setHex(THEMES[t].hemiS); hemi.color.r += tmpC2.r * wT[t]; hemi.color.g += tmpC2.g * wT[t]; hemi.color.b += tmpC2.b * wT[t]; tmpC2.setHex(THEMES[t].hemiG); hemi.groundColor.r += tmpC2.r * wT[t]; hemi.groundColor.g += tmpC2.g * wT[t]; hemi.groundColor.b += tmpC2.b * wT[t]; }
    backdrops.forEach((b, i) => { b.material.opacity = wT[i]; b.visible = wT[i] > 0.01; mixTheme('silo', b.material.color); b.material.color.lerp(curFog, 0.25); });
    stars.material.opacity = THEMES.reduce((a, t, i) => a + t.stars * wT[i], 0);
    sun.material.opacity = wT[2]; sun.visible = wT[2] > 0.01; moonS.material.opacity = wT[1] + wT[0] * 0.35; moonS.visible = moonS.material.opacity > 0.01;
    accent.color.copy(mixTheme('edge', tmpC));
  }

  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tV = new THREE.Vector3(), lookV = new THREE.Vector3();
  let camInit = false;
  function updateCamera(dt, st) {
    const cx = car.position.x, cy = car.position.y, cz = car.position.z;
    const dx = TDX(sP), dy = TDY(sP);
    const attract = st === 'menu' || st === 'over';
    if (attract) {
      const a = T * 0.22;
      tV.set(cx + Math.sin(a) * 10.5, cy + 3.0 + Math.sin(T * 0.37) * 0.8, cz + Math.cos(a) * 10.5);
      lookV.set(cx, cy + 0.8, cz);
    } else {
      const back = 8.6 - Math.min(1.4, boostT * 0.7), up = 3.1;
      tV.set(cx - dx * back * 0.7 - latV * 0.06, cy + up + dy * -back * 0.5, cz + back);
      lookV.set(cx + dx * 12 + latV * 0.04, cy + 1.0 + dy * 12, cz - 12);
    }
    const k = camInit ? 1 - Math.pow(attract ? 0.2 : 0.004, dt) : 1; camInit = true;
    camPos.lerp(tV, k); camLook.lerp(lookV, 1 - Math.pow(0.0005, dt));
    camera.position.copy(camPos);
    if (shake > 0) { camera.position.x += rand(-1, 1) * shake * 0.25; camera.position.y += rand(-1, 1) * shake * 0.18; shake = Math.max(0, shake - dt * 2.2); }
    camera.lookAt(camLook);
    const fov = baseFov + (attract ? 0 : clamp((speed - 30) * 0.13, 0, 9) + (boostT > 0 ? 9 : 0));
    camera.fov = lerp(camera.fov, fov, 1 - Math.pow(0.02, dt)); camera.updateProjectionMatrix();
    sky.position.copy(camera.position); stars.position.copy(camera.position);
    backdrops.forEach((b) => b.position.set(camera.position.x, camera.position.y + 30, camera.position.z));
    sun.position.set(camera.position.x - 120, camera.position.y + 22, camera.position.z - 430);
    moonS.position.set(camera.position.x + 150, camera.position.y + 95, camera.position.z - 380);
  }

  function updateRender(dt, st, ds) {
    refX = TX(sP); refY = TY(sP);
    updateStrips(); spawnScenery(); updateScenery();
    // jugador
    trackPos(sP, lat, 0, car.position);
    const dx = TDX(sP);
    car.rotation.set(Math.atan(TDY(sP)), -Math.atan(dx) - latV * 0.03, 0);
    carBody.rotation.z = lerp(carBody.rotation.z, latV * 0.012, 0.2);
    carBody.rotation.x = lerp(carBody.rotation.x, (braking ? -0.02 : 0) + (boostT > 0 ? 0.025 : 0), 0.15);
    carBody.position.y = Math.sin(T * 30) * 0.004 * Math.min(1, speed / 30);
    carWheels.forEach((w, i) => { w.rotation.x -= speed * dt / 0.36; if (i < 2) w.rotation.y = -steer * 0.3; });
    car.visible = !(invuln > 0 && Math.floor(T * 12) % 2 === 0 && shell.state === 'play');
    const brk = braking ? 1 : 0;
    carGlows.forEach((g) => (g.material.opacity = 0.7 + brk * 0.3)); tailBar.material.opacity = 0.45 + brk * 0.5; tailBar.scale.x = 3.2 + brk * 1.2;
    flames.forEach((f, i) => { const on = boostT > 0; f.material.opacity = on ? rand(0.6, 1) : 0; f.scale.set(on ? rand(0.9, 1.6) : 0.1, on ? rand(0.9, 1.6) : 0.1, 1); f.material.color.setHex(Math.random() < 0.3 ? 0xff8a3a : 0x4ad8ff); });
    under.material.opacity = 0.26 + Math.sin(T * 4) * 0.06;
    headL.position.set(car.position.x, car.position.y + 4, car.position.z - 10);
    fillL.position.set(car.position.x, car.position.y + 3.2, car.position.z + 2.5);
    moon.position.set(car.position.x - 10, car.position.y + 40, car.position.z - 120); moon.target.position.copy(car.position); moon.target.updateMatrixWorld();
    // tráfico
    for (const c of traffic) {
      if (!c.on) continue;
      place(c.o, c.s, c.lat, 0, c.spin + (c.tLat - c.lat) * 0.04, true);
    }
    const flash = Math.floor(T * 8) % 2 === 0;
    for (const p of police) {
      if (!p.on) continue;
      place(p.o, p.s, p.lat, 0, (p.tLat - p.lat) * -0.03, true);
      const U = p.o.userData; U.rs.material.opacity = flash ? 1 : 0.15; U.bs.material.opacity = flash ? 0.15 : 1; U.rr.material.opacity = flash ? 0.55 : 0.05; U.br.material.opacity = flash ? 0.05 : 0.55;
      U.red.material.color.setHex(flash ? 0xff1030 : 0x400008); U.blue.material.color.setHex(flash ? 0x081040 : 0x2050ff);
    }
    // fichas
    for (const c of coins) { if (!c.on) continue; place(c.o, c.s, c.lat, 1.0 + Math.sin(T * 4 + c.s) * 0.12, 0); c.spin.rotation.y = T * 4 + c.s; c.st.rotation.y = T * 4 + c.s; }
    // arco
    if (gateS < sP - 25 && gateS < nextCP && gateS > -100) { gateS = nextCP; banner.material = banner2.material = BAN_CP; }
    gate.visible = gateS > sP - 30 && gateS < sP + 330;
    if (gate.visible) { place(gate, gateS, 0, 0, 0); gateGlows.forEach((g, i) => (g.material.opacity = 0.6 + 0.4 * Math.sin(T * 6 + i * 3))); }
    updateSparks(dt, ds);
    // líneas de velocidad
    const sl = clamp((speed - 55) / 30, 0, 1) * 0.35 + (boostT > 0 ? 0.6 : 0);
    speedLines.material.opacity = lerp(speedLines.material.opacity, st === 'play' ? sl : 0, 0.15);
    if (speedLines.material.opacity > 0.01) {
      const len = 2 + speed * 0.06 + (boostT > 0 ? 5 : 0);
      for (let i = 0; i < SLN; i++) {
        const d = slData[i]; d.z += speed * dt * 1.4; if (d.z > -1) { d.z = rand(-70, -30); d.a = Math.random() * Math.PI * 2; d.r = rand(1.8, 5.5); }
        const x = Math.cos(d.a) * d.r, y = Math.sin(d.a) * d.r * 0.8;
        slPos[i * 6] = x; slPos[i * 6 + 1] = y; slPos[i * 6 + 2] = d.z; slPos[i * 6 + 3] = x; slPos[i * 6 + 4] = y; slPos[i * 6 + 5] = d.z - len;
      }
      slGeo.attributes.position.needsUpdate = true;
    }
  }

  // ---------- HUD propio ----------
  const H = { top: $('tnTop'), time: $('tnTime'), timeBox: $('tnTimeBox'), stage: $('tnStage'), cp: $('tnCp'), prog: $('tnProg'), heat: $('tnHeat'), heatBar: $('tnHeatBar'), combo: $('tnCombo'), comboX: $('tnComboX'), comboBar: $('tnComboBar'), speedBox: $('tnSpeedBox'), speed: $('tnSpeed'), arc: $('tnArc'), pol: $('tnPol'), nfx: $('tnNfx'), dmg: $('tnDmg'), segs: [...document.querySelectorAll('.tn-segs b')] };
  let lastChrome = '';
  function paintChrome() {
    const st = shell.state, inRun = st === 'play' || st === 'count' || st === 'starting' || st === 'paused' || st === 'dying' || st === 'crashed' || st === 'ad';
    const key = st + inRun;
    if (key === lastChrome) return; lastChrome = key;
    H.top.hidden = !inRun; H.speedBox.hidden = !inRun; $('tnShade').hidden = !inRun;
    nitroBtn.hidden = brakeBtn.hidden = st !== 'play';
    if (st !== 'play') { touchId = null; brakeTouch = false; brakeBtn.classList.remove('on'); }
    if (!inRun) { H.combo.classList.add('off'); H.pol.style.opacity = 0; H.nfx.style.opacity = 0; $('tnHint').classList.add('off'); }
  }
  let lastHud = {};
  function setText(el, k, v) { if (lastHud[k] !== v) { lastHud[k] = v; el.textContent = v; } }
  function paintHudLocal(force) {
    if (force) lastHud = {};
    const tt = Math.max(0, timer);
    const tStr = tt < 10 ? tt.toFixed(1) : String(Math.ceil(tt));
    setText(H.time, 'time', tStr);
    const low = tt < 10 && shell.state === 'play';
    if (low !== wasLow) { H.timeBox.classList.toggle('low', low); wasLow = low; }
    const th = THEMES[themeIdx(stage - 1)];
    if (lastHud.stageK !== stage) { lastHud.stageK = stage; H.stage.innerHTML = `Etapa <b>${stage}</b> · ${th.name}`; }
    const left = Math.max(0, nextCP - sP);
    setText(H.cp, 'cp', 'Control ' + fmt(Math.ceil(left / 10) * 10) + ' m');
    H.prog.style.transform = `scaleX(${clamp(1 - left / CP, 0, 1)})`;
    const anyPol = police.some((p) => p.on) || heat > 0.01;
    if (H.heat.hidden === anyPol) H.heat.hidden = !anyPol;
    H.heatBar.style.transform = `scaleX(${heat})`; H.heat.classList.toggle('hot', heat > 0.6);
    const kmh = Math.round(speed * 3.6); setText(H.speed, 'spd', String(kmh));
    H.arc.setAttribute('stroke-dashoffset', String(170 - 170 * clamp(kmh / 400, 0, 1)));
    H.combo.classList.toggle('off', combo < 2); if (combo >= 2) { setText(H.comboX, 'cx', 'x' + combo); H.comboBar.style.transform = `scaleX(${clamp(comboT / 3, 0, 1)})`; }
    H.segs.forEach((b, i) => (b.style.transform = `scaleX(${clamp(nitro - i, 0, 1)})`));
    const ready = nitro >= 1;
    nitroBtn.classList.toggle('empty', !ready); nitroBtn.classList.toggle('ready', ready && boostT <= 0);
    let near = 999; police.forEach((p) => { if (p.on && !p.giveUp) near = Math.min(near, Math.abs(p.s - sP)); });
    H.pol.style.opacity = shell.state === 'play' && near < 70 ? String((1 - near / 70) * 0.9) : '0';
    H.pol.classList.toggle('flip', Math.floor(T * 8) % 2 === 0);
    H.nfx.style.opacity = boostT > 0 && shell.state === 'play' ? '1' : '0';
    H.dmg.style.opacity = String(dmgFlash * 0.9);
  }

  // ---------- Bucle ----------
  let last = performance.now();
  function frame(now) {
    const rdt = Math.min(0.05, (now - last) / 1000); last = now;
    const st = shell.state;
    let ds = 0, dt = rdt;
    if (st === 'menu' || st === 'over') { T += dt; ds = simulate(dt, 'attract'); }
    else if (st === 'play') { T += dt; ds = simulate(dt, running ? 'play' : 'idle'); if (hintT < 4.5) { hintT += dt; $('tnHint').classList.toggle('off', hintT > 4); } }
    else if (st === 'dying') { T += dt; ds = simulate(dt, 'coast'); }
    else if (st === 'count' || st === 'starting') { T += dt; if (hintT === 0 && stage === 1 && dist === 0) $('tnHint').classList.remove('off'); }
    dmgFlash = Math.max(0, dmgFlash - rdt * 2.5);
    updateTheme(rdt);
    updateRender(dt, st, ds);
    updateCamera(rdt, st);
    updateAudio(rdt);
    paintChrome();
    if (st !== 'menu' && st !== 'over') paintHudLocal();
    shell.paintHud();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize(); toAttract(); requestAnimationFrame(frame);

  window.__game = {
    shell,
    get info() { return { state: shell.state, s: Math.round(sP), speed: +speed.toFixed(1), kmh: Math.round(speed * 3.6), lat: +lat.toFixed(2), timer: +timer.toFixed(1), nitro: +nitro.toFixed(2), boost: +boostT.toFixed(2), stage, heat: +heat.toFixed(2), combo, nearMisses, crashes, traffic: traffic.filter((c) => c.on).length, police: police.filter((p) => p.on).length, coinsOnRoad: coins.filter((c) => c.on).length, points: shell.points, coins: shell.coins, endReason, running }; },
    steer(v) { steerOverride.v = v; },
    setTimer(t) { timer = t; },
    setHeat(h) { heat = h; },
    addNitro(n) { nitro = Math.min(3, nitro + n); },
    fireNitro,
    toStage(n) { const target = (n - 1) * CP - 60; stage = n - 1; nextCP = (n - 1) * CP; sP = target; dist = target; gateS = nextCP; resetScenery(sP - 30); clearTraffic(-1e9, 1e9); coins.forEach((c) => { c.on = false; c.o.visible = false; }); nextTrafficS = sP + 60; fillTraffic(); shell.stat = stage; },
    spawnCar(dz, lt, v) { const t = traffic.find((c) => !c.on); if (!t) return; t.on = true; t.o.visible = true; t.s = sP + dz; t.lat = t.tLat = lt; t.v = v == null ? 25 : v; t.prevRel = dz; t.missed = false; t.hitCd = 0; t.spin = 0; t.blinkT = 0; },
    clearCars() { clearTraffic(-1e9, 1e9); nextTrafficS = sP + 2000; },
    spawnPolice(r) { const p = spawnPolice(r); if (p) p.s = sP - 20; return !!p; },
    get lat() { return lat; }, set lat(v) { lat = v; }
  };
})();
</script>
