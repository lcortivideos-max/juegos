<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Órbita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: espacio profundo a pantalla completa; la nave se mueve en la parte baja y los asteroides caen */
:root {
  --bg: #070a1f;
  --ink: #eef1ff;
  --muted: #9aa3d6;
  --panel: rgba(12, 16, 44, 0.9);
  --line: rgba(150, 160, 255, 0.24);
  --accent: #8b6dff;
  --onaccent: #ffffff;
  --gold: #ffd447;
  --ongold: #2a2000;
  --goldline: rgba(255, 212, 71, 0.4);
  --goldtint: rgba(255, 212, 71, 0.1);
  --veil: rgba(4, 6, 20, 0.5);
  --shadow: rgba(0, 0, 0, 0.5);
  --display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --body: "Exo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Juego Órbita"></canvas></div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let W = 0, H = 0, DPR = 1, U = 1, nebula = null;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = clamp(Math.min(W, H) / 380, 0.9, 1.8); nebula = null;
    ship.y = H - 120 * U; ship.x = clamp(ship.x || W / 2, 20, W - 20); target = ship.x;
  }
  addEventListener('resize', resize);

  const SIZES = { L: { r: 36, hp: 3, pts: 30, next: 'M', drop: 0.4 }, M: { r: 23, hp: 2, pts: 20, next: 'S', drop: 0.22 }, S: { r: 13, hp: 1, pts: 10, next: null, drop: 0.1 } };
  let ship = { x: 0, y: 0 }, target = 0, rocks = [], bullets = [], stars = [], sparks = [], drops = [], popups = [];
  let fireT = 0, spawnT = 0, elapsed = 0, invuln = 0, triple = 0, shake = 0, kills = 0;
  const field = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1) }));

  function makeRock(size, x, y, vx, vy) {
    const s = SIZES[size], n = 9 + Math.floor(Math.random() * 4), pts = [];
    for (let i = 0; i < n; i++) pts.push(rand(0.72, 1.08));
    rocks.push({ size, x, y, vx, vy, r: s.r * U, hp: s.hp, pts, rot: rand(0, 6), vr: rand(-1.4, 1.4), hit: 0, hue: rand(250, 300) });
  }
  function spawnRock() {
    const diff = Math.min(1, elapsed / 100);
    const r = Math.random(), size = r < 0.45 + diff * 0.2 ? 'L' : r < 0.85 ? 'M' : 'S';
    makeRock(size, rand(30, W - 30), -50 * U, rand(-30, 30) * U, rand(70, 130 + diff * 120) * U);
  }
  function reset() {
    rocks = []; bullets = []; stars = []; sparks = []; drops = []; popups = [];
    fireT = 0; spawnT = 0.8; elapsed = 0; invuln = 0; triple = 0; shake = 0; kills = 0;
    ship.x = W / 2; target = ship.x;
  }
  function boom(x, y, n, col) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), v = rand(60, 260); sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), col }); } }

  function destroy(rk) {
    const s = SIZES[rk.size];
    shell.addBase(s.pts); kills++;
    boom(rk.x, rk.y, rk.size === 'L' ? 22 : 12, `hsl(${rk.hue},80%,75%)`);
    shell.noise(rk.size === 'L' ? 0.35 : 0.2, 0.18, 1200);
    if (s.next) for (const k of [-1, 1]) makeRock(s.next, rk.x + k * 8, rk.y, rk.vx + k * rand(50, 90) * U, rk.vy * 0.8);
    if (Math.random() < s.drop) stars.push({ x: rk.x, y: rk.y, vy: 90 * U, t: 0 });
    else if (Math.random() < 0.025) drops.push({ x: rk.x, y: rk.y, vy: 80 * U, kind: 'triple', t: 0 });
  }

  const shell = Arcade.create({
    id: 'orbita', title: ['Órbita', ''], bg: '#070a1f',
    tagline: 'Defiende tu órbita de la lluvia de asteroides.',
    how: ['<b>Arrastra el dedo</b> a izquierda y derecha para mover la nave. Dispara sola.', 'Los asteroides grandes se rompen en otros más pequeños. Recoge las <b>estrellas</b> que sueltan.', 'Si un asteroide te toca, pierdes. Busca el disparo triple.'],
    coinLabel: 'Estrellas', coinSingular: 'estrella', coinValue: 5, rivalTop: 5200, statLabel: 'Destruidos',
    crashTitle: '¡Nave alcanzada!', reviveLabel: 'Reparar la nave', reviveReward: 'reparar la nave', countdown: true,
    onStart() { reset(); },
    onGo() {},
    onRevive() { rocks.forEach((r) => boom(r.x, r.y, 6, '#bbaaff')); rocks = []; invuln = 2.2; },
    onMenu() { reset(); },
    badges: () => (triple > 0 ? [`Triple ${Math.ceil(triple)}`] : [])
  });

  // Control: arrastrar o teclado
  let dragging = false, keyDir = 0;
  const px = (e) => e.clientX - canvas.getBoundingClientRect().left;
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); Arcade.audio(); dragging = true; target = px(e); });
  canvas.addEventListener('pointermove', (e) => { if (dragging || e.pointerType === 'mouse') target = px(e); });
  addEventListener('pointerup', () => (dragging = false));
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1; if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1; });
  addEventListener('keyup', (e) => { if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) keyDir = 0; });

  function update(dt) {
    const playing = shell.playing();
    for (const s of field) { s.y += dt * 0.04 * s.z * (playing ? 2.5 : 1); if (s.y > 1) { s.y = 0; s.x = Math.random(); } }
    if (shell.state === 'menu') { ship.x += (W / 2 + Math.sin(performance.now() / 900) * W * 0.25 - ship.x) * Math.min(1, dt * 2); }
    if (!playing && shell.state !== 'dying') { updateFx(dt); return; }
    if (playing) {
      elapsed += dt;
      if (keyDir) target = clamp(target + keyDir * 520 * U * dt, 16, W - 16);
      ship.x += (clamp(target, 16, W - 16) - ship.x) * Math.min(1, dt * 14);
      if (invuln > 0) invuln -= dt;
      if (triple > 0) triple -= dt;
      fireT -= dt;
      if (fireT <= 0) {
        fireT = 0.15;
        bullets.push({ x: ship.x, y: ship.y - 22 * U, vx: 0 });
        if (triple > 0) { bullets.push({ x: ship.x - 8, y: ship.y - 16 * U, vx: -140 * U }); bullets.push({ x: ship.x + 8, y: ship.y - 16 * U, vx: 140 * U }); }
        shell.tone(1400, 900, 0.04, 'square', 0.015);
      }
      spawnT -= dt;
      if (spawnT <= 0) { spawnRock(); spawnT = clamp(1.25 - elapsed / 110, 0.38, 1.25) * rand(0.7, 1.3); }
      shell.stat = kills;
    }
    for (const b of bullets) { b.y -= 760 * U * dt; b.x += b.vx * dt; }
    bullets = bullets.filter((b) => b.y > -20 && !b.dead);
    for (const r of rocks) {
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; if (r.hit > 0) r.hit -= dt;
      if (r.x < r.r && r.vx < 0) r.vx *= -1; if (r.x > W - r.r && r.vx > 0) r.vx *= -1;
    }
    if (playing) {
      for (const b of bullets) for (const r of rocks) {
        if (r.dead || b.dead) continue;
        if (Math.hypot(b.x - r.x, b.y - r.y) < r.r) { b.dead = true; r.hp--; r.hit = 0.08; if (r.hp <= 0) { r.dead = true; destroy(r); } }
      }
      if (invuln <= 0) for (const r of rocks) {
        if (!r.dead && Math.hypot(ship.x - r.x, ship.y - r.y) < r.r * 0.85 + 13 * U) { shake = 0.5; boom(ship.x, ship.y, 30, '#ffd447'); shell.noise(0.6, 0.5, 700); shell.crash(); break; }
      }
      for (const s of stars) {
        s.t += dt; const d = Math.hypot(ship.x - s.x, ship.y - s.y);
        if (d < 120 * U) { s.x += (ship.x - s.x) * Math.min(1, dt * 6); s.y += (ship.y - s.y) * Math.min(1, dt * 6); } else s.y += s.vy * dt;
        if (d < 22 * U) { s.got = true; shell.coin(1); shell.tone(988, 1976, 0.1, 'triangle', 0.07); shell.haptic('light'); }
      }
      for (const p of drops) {
        p.t += dt; p.y += p.vy * dt;
        if (Math.hypot(ship.x - p.x, ship.y - p.y) < 26 * U) { p.got = true; triple = 8; popups.push({ x: p.x, y: p.y, txt: 'Disparo triple', life: 1.1 }); shell.tone(660, 1320, 0.2, 'square', 0.06); }
      }
    }
    rocks = rocks.filter((r) => !r.dead && r.y < H + 80);
    stars = stars.filter((s) => !s.got && s.y < H + 20);
    drops = drops.filter((p) => !p.got && p.y < H + 20);
    updateFx(dt);
  }
  function updateFx(dt) {
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.97; s.vy *= 0.97; s.life -= dt; }
    sparks = sparks.filter((s) => s.life > 0);
    for (const p of popups) { p.life -= dt; p.y -= 30 * dt; } popups = popups.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt);
  }

  function drawNebula() {
    if (!nebula) {
      nebula = document.createElement('canvas'); nebula.width = Math.round(W * DPR); nebula.height = Math.round(H * DPR);
      const n = nebula.getContext('2d'); n.scale(DPR, DPR);
      n.fillStyle = '#070a1f'; n.fillRect(0, 0, W, H);
      [[0.2, 0.25, '#4b2a9a'], [0.85, 0.55, '#1c4e9a'], [0.4, 0.85, '#7a2a7a']].forEach(([x, y, c]) => {
        const g = n.createRadialGradient(W * x, H * y, 10, W * x, H * y, Math.max(W, H) * 0.55);
        g.addColorStop(0, c + '88'); g.addColorStop(1, c + '00'); n.fillStyle = g; n.fillRect(0, 0, W, H);
      });
      // planeta
      const pr = Math.min(W, H) * 0.5, cx = W * 0.95, cy = H * 0.08;
      const pg = n.createRadialGradient(cx - pr * 0.3, cy + pr * 0.3, pr * 0.1, cx, cy, pr);
      pg.addColorStop(0, '#ff9e6b'); pg.addColorStop(0.6, '#a03c78'); pg.addColorStop(1, '#2a1240');
      n.fillStyle = pg; n.beginPath(); n.arc(cx, cy, pr, 0, Math.PI * 2); n.fill();
      n.strokeStyle = 'rgba(255,200,170,0.35)'; n.lineWidth = 3; n.beginPath(); n.ellipse(cx, cy, pr * 1.5, pr * 0.28, -0.35, 0, Math.PI * 2); n.stroke();
    }
    ctx.drawImage(nebula, 0, 0, W, H);
  }
  function drawShip(x, y) {
    const s = U;
    const fl = 10 + Math.random() * 10;
    const g = ctx.createLinearGradient(0, y + 12 * s, 0, y + (22 + fl) * s); g.addColorStop(0, '#9ff3ff'); g.addColorStop(1, 'rgba(120,80,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 6 * s, y + 12 * s); ctx.lineTo(x + 6 * s, y + 12 * s); ctx.lineTo(x, y + (24 + fl) * s); ctx.fill();
    ctx.fillStyle = '#d9dcff'; ctx.beginPath();
    ctx.moveTo(x, y - 24 * s); ctx.lineTo(x + 9 * s, y + 2 * s); ctx.lineTo(x + 22 * s, y + 12 * s); ctx.lineTo(x + 8 * s, y + 12 * s); ctx.lineTo(x, y + 8 * s);
    ctx.lineTo(x - 8 * s, y + 12 * s); ctx.lineTo(x - 22 * s, y + 12 * s); ctx.lineTo(x - 9 * s, y + 2 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8b6dff'; ctx.beginPath(); ctx.moveTo(x - 22 * s, y + 12 * s); ctx.lineTo(x - 9 * s, y + 2 * s); ctx.lineTo(x - 11 * s, y + 12 * s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 22 * s, y + 12 * s); ctx.lineTo(x + 9 * s, y + 2 * s); ctx.lineTo(x + 11 * s, y + 12 * s); ctx.fill();
    ctx.fillStyle = '#4ee6ff'; ctx.beginPath(); ctx.ellipse(x, y - 6 * s, 3.5 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
    drawNebula();
    for (const s of field) { ctx.globalAlpha = 0.3 + s.z * 0.7; ctx.fillStyle = '#e8ecff'; const sz = s.z * 1.8; ctx.fillRect(s.x * W, s.y * H, sz, sz * (shell.playing() ? 2.5 : 1)); }
    ctx.globalAlpha = 1;
    for (const r of rocks) {
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.beginPath(); r.pts.forEach((k, i) => { const a = i / r.pts.length * Math.PI * 2; ctx.lineTo(Math.cos(a) * r.r * k, Math.sin(a) * r.r * k); }); ctx.closePath();
      const g = ctx.createRadialGradient(-r.r * 0.3, -r.r * 0.3, 2, 0, 0, r.r * 1.1); g.addColorStop(0, r.hit > 0 ? '#ffffff' : `hsl(${r.hue},30%,58%)`); g.addColorStop(1, `hsl(${r.hue},35%,22%)`);
      ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = `hsla(${r.hue},80%,80%,0.5)`; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(r.r * 0.25, r.r * 0.1, r.r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#9ff3ff';
    for (const b of bullets) { ctx.fillRect(b.x - 1.5 * U, b.y - 9 * U, 3 * U, 14 * U); }
    for (const s of stars) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.t * 2); ctx.fillStyle = '#ffd447'; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 4.5 : 10) * U; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    for (const p of drops) {
      ctx.strokeStyle = '#8b6dff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 13 * U, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#c8b8ff'; ctx.font = `${12 * U}px Audiowide, sans-serif`; ctx.textAlign = 'center'; ctx.fillText('x3', p.x, p.y + 4 * U);
    }
    if (shell.state !== 'dying' && shell.state !== 'crashed' && shell.state !== 'over' && !(invuln > 0 && Math.floor(performance.now() / 80) % 2)) drawShip(ship.x, ship.y);
    for (const s of sparks) { ctx.globalAlpha = clamp(s.life * 2, 0, 1); ctx.fillStyle = s.col; ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    for (const p of popups) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.font = '18px Audiowide, sans-serif'; ctx.fillStyle = '#c8b8ff'; ctx.fillText(p.txt, p.x, p.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); shell.paintHud();
    requestAnimationFrame(frame);
  }
  resize(); reset();
  requestAnimationFrame(frame);
  window.__game = { shell, auto() { const th = rocks.filter((r) => r.y < ship.y && r.y > ship.y - 260).sort((a, b) => b.y - a.y)[0]; if (th && Math.abs(th.x - ship.x) < th.r + 30) target = th.x < ship.x ? Math.min(W - 20, th.x + th.r + 60) : Math.max(20, th.x - th.r - 60); else { const t2 = rocks.sort((a, b) => b.y - a.y)[0]; if (t2) target = t2.x; } } };
})();
</script>
</body>
</html>
