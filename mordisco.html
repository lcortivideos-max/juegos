<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mordisco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: laberinto de neón centrado bajo el marcador; Mordisco se come los dulces mientras le persiguen cuatro avispas */
:root {
  --bg: #0b0420;
  --ink: #fdf2ff;
  --muted: #b9a6d9;
  --panel: rgba(22, 8, 46, 0.9);
  --line: rgba(255, 120, 230, 0.25);
  --accent: #4ff5d2;
  --onaccent: #052a24;
  --gold: #ff6ad5;
  --ongold: #2a0420;
  --goldline: rgba(255, 106, 213, 0.45);
  --goldtint: rgba(255, 106, 213, 0.1);
  --veil: rgba(8, 3, 20, 0.42);
  --shadow: rgba(0, 0, 0, 0.5);
  --display: "Bungee", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Juego Mordisco"></canvas></div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const approach = (v, t, s) => (Math.abs(t - v) <= s ? t : v + Math.sign(t - v) * s);
  const FONT = '"Bungee", "Arial Black", system-ui, sans-serif';

  // ---------- Laberintos (mitad izquierda; se refleja) ----------
  const MAZES = [
    { start: [9, 16], half: [
      '##########', '#........#', '#o##.###.#', '#.##.###.#', '#.........', '#.##.#.###', '#....#...#', '####.###.#',
      '####.#....', '####.#.##-', '     ..#GG', '####.#.###', '####.#....', '####.#.###', '#........#', '#.##.###.#',
      '#o.#......', '##.#.#.###', '#....#...#', '#.######.#', '#.........', '#.##.#.###', '#.##.#...#', '#.........', '##########'] },
    { start: [9, 14], half: [
      '##########', '#.........', '#.##.####.', '#o##.####.', '#.........', '#.##.#.###', '#.##.#...#', '#....###.#',
      '####.#....', '####.#.##-', '     ..#GG', '####.#.###', '#....#....', '#.##.#.###', '#.........', '###.##.###',
      '#o.......#', '#.##.###.#', '#.##.#...#', '#....#.#..', '#.##.#.#.#', '#.##...#..', '#.##.###.#', '#.........', '##########'] }
  ];
  const COLS = 19, ROWS = 25, TUN = 10, OUT = { x: 9, y: 8 };
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  const NEON = ['#ff4fd8', '#3ee0ff', '#9dff5a', '#ffb43e', '#b07bff'];
  const ENEMY = [
    { name: 'Zumbi', col: '#ff3d7f', dark: '#5a0a2a', corner: [17, -3] },
    { name: 'Picota', col: '#ff9a2e', dark: '#5a2a00', corner: [1, -3] },
    { name: 'Ronda', col: '#c6f53a', dark: '#2f4a00', corner: [1, 27] },
    { name: 'Locuela', col: '#b583ff', dark: '#2e0f5c', corner: [17, 27] }
  ];
  const HOME = [[9, 8], [9, 10], [8, 10], [10, 10]];
  const MODES = [7, 20, 7, 20, 5, 20, 5, Infinity]; // dispersión / persecución alternas
  const BONUS = [
    { kind: 'piruleta', pts: 300 }, { kind: 'magdalena', pts: 500 }, { kind: 'rosquilla', pts: 700 }, { kind: 'helado', pts: 1000 }
  ];

  let grid = [], dots = null, dotsLeft = 0, dotsTotal = 0, startTile = [9, 16], homeDist = null;
  function loadMaze(level) {
    const m = MAZES[(level - 1) % MAZES.length];
    grid = m.half.map((h) => h + h.slice(0, 9).split('').reverse().join(''));
    startTile = m.start;
    dots = new Uint8Array(COLS * ROWS); dotsLeft = 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = grid[y][x]; const v = c === '.' ? 1 : c === 'o' ? 2 : 0;
      if (v && !(x === startTile[0] && y === startTile[1])) { dots[y * COLS + x] = v; dotsLeft++; }
    }
    dotsTotal = dotsLeft;
    // distancias hasta la puerta del panal para que los ojos vuelvan a casa
    homeDist = new Int16Array(COLS * ROWS).fill(-1);
    const q = [OUT.y * COLS + OUT.x]; homeDist[q[0]] = 0;
    for (let i = 0; i < q.length; i++) {
      const x = q[i] % COLS, y = (q[i] / COLS) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = (x + DX[d] + COLS) % COLS, ny = y + DY[d];
        if (wall(nx, ny)) continue; const k = ny * COLS + nx;
        if (homeDist[k] < 0) { homeDist[k] = homeDist[q[i]] + 1; q.push(k); }
      }
    }
    wallsDirty = true;
  }
  function cell(x, y) { if (y < 0 || y >= ROWS) return '#'; return grid[y][((x % COLS) + COLS) % COLS]; }
  function wall(x, y) { const c = cell(x, y); return c === '#' || c === '-' || c === 'G'; }

  // ---------- Estado ----------
  let W = 0, H = 0, DPR = 1, ts = 20, ox = 0, oy = 0, safe = { t: 0, r: 0, b: 0, l: 0 };
  let t = 0, level = 1, phase = 'play', phaseT = 0, hitstop = 0, invuln = 0, lifeT = 0;
  let modeIdx = 0, modeT = 0, frightT = 0, frightDur = 6, combo = 0, eatenCount = 0, bonus = null, bonusSpawned = 0;
  let deathT = 0, dying = false, shake = 0, wakka = false, sirenT = 0, hintT = 0;
  let player = null, enemies = [], particles = [], popups = [], attract = false;
  let wallsDirty = true, wallLayer = null, wallFlash = null, dotSprite = null, bgLayer = null;

  const lvlSpeed = () => ({
    player: Math.min(7.2, 6.3 + 0.18 * (level - 1)),
    enemy: Math.min(7.6, 5.8 + 0.32 * (level - 1))
  });

  function resetPositions() {
    player = { x: startTile[0], y: startTile[1], dir: 2, want: 2, moving: false, face: -1, look: 2, chomp: 0 };
    enemies = ENEMY.map((e, i) => ({
      i, x: HOME[i][0], y: HOME[i][1], dir: i === 0 ? 2 : 3, state: i === 0 ? 'active' : 'house',
      fright: false, reverse: false, face: -1, look: 2, bob: rand(0, TAU)
    }));
    lifeT = 0; modeIdx = 0; modeT = 0; frightT = 0; combo = 0; hitstop = 0; dying = false; deathT = 0;
  }
  function newGame() {
    level = 1; loadMaze(1); resetPositions(); phase = 'play'; invuln = 0; particles = []; popups = [];
    eatenCount = 0; bonus = null; bonusSpawned = 0; hintT = 4; frightDur = 6;
  }
  function nextLevel() {
    level++; shell.stat = level; loadMaze(level); resetPositions();
    eatenCount = 0; bonus = null; bonusSpawned = 0; frightDur = Math.max(1.6, 6 - (level - 1) * 0.7);
    phase = 'ready'; phaseT = 1.4;
  }

  // ---------- Movimiento en rejilla ----------
  function step(e, dist, atCenter) {
    let guard = 0;
    while (dist > 1e-6 && guard++ < 10) {
      if (e.dir < 0) { if (!atCenter(e) || e.dir < 0) return; }
      const dx = DX[e.dir], dy = DY[e.dir];
      // giro anticipado: el eje perpendicular se recentra a la vez que avanza
      if (dx) { const d = Math.round(e.y) - e.y; if (d) e.y += Math.sign(d) * Math.min(Math.abs(d), dist); }
      else { const d = Math.round(e.x) - e.x; if (d) e.x += Math.sign(d) * Math.min(Math.abs(d), dist); }
      const a = dx ? e.x : e.y, s = dx || dy;
      const toC = s > 0 ? Math.ceil(a - 1e-6) - a : a - Math.floor(a + 1e-6);
      let m;
      if (toC < 1e-6) {
        if (dx) e.x = Math.round(e.x); else e.y = Math.round(e.y);
        if (!atCenter(e) || e.dir < 0) return;
        m = Math.min(dist, 1);
      } else m = Math.min(dist, toC);
      e.x += DX[e.dir] * m; e.y += DY[e.dir] * m; dist -= m;
      if (e.x < -0.5) e.x += COLS; else if (e.x > COLS - 0.5) e.x -= COLS;
    }
  }

  function playerCenter(p) {
    const cx = Math.round(p.x), cy = Math.round(p.y);
    if (attract) p.want = aiDir(cx, cy);
    if (p.want >= 0 && !wall(cx + DX[p.want], cy + DY[p.want])) p.dir = p.want;
    if (p.dir >= 0 && wall(cx + DX[p.dir], cy + DY[p.dir])) { p.moving = false; return false; }
    return true;
  }
  function movePlayer(h) {
    const p = player, sp = lvlSpeed().player * (frightT > 0 ? 1.1 : 1);
    if (p.want >= 0 && p.want !== p.dir) {
      if (p.dir >= 0 && (p.want + 2) % 4 === p.dir) p.dir = p.want; // media vuelta inmediata
      else if (p.dir >= 0) {
        const along = DX[p.dir] ? p.x : p.y, off = Math.abs(along - Math.round(along));
        if (off < 0.42 && !wall(Math.round(p.x) + DX[p.want], Math.round(p.y) + DY[p.want])) p.dir = p.want;
      }
    }
    const bx = p.x, by = p.y;
    p.moving = true;
    step(p, sp * h, playerCenter);
    const moved = Math.abs(p.x - bx) + Math.abs(p.y - by);
    p.moving = moved > 1e-4;
    if (p.moving) { p.chomp += h * 16; p.look = p.dir; if (DX[p.dir]) p.face = DX[p.dir]; }
  }

  function enemySpeed(g) {
    if (g.state === 'eyes') return 13;
    if (g.state !== 'active') return 3.2;
    if (Math.round(g.y) === TUN && (g.x < 4.5 || g.x > 13.5)) return 3.2;
    if (g.fright) return 3.6;
    let s = lvlSpeed().enemy;
    if (g.i === 0 && dotsLeft < 30) s *= 1.08;
    return attract ? s * 0.92 : s;
  }
  function targetOf(g) {
    const px = Math.round(player.x), py = Math.round(player.y);
    const scatter = modeIdx % 2 === 0;
    const corner = ENEMY[g.i].corner;
    if (g.i === 0) return scatter && dotsLeft > 30 ? corner : [px, py];
    if (scatter) return corner;
    if (g.i === 1) { const d = player.dir >= 0 ? player.dir : 2; return [px + DX[d] * 4, py + DY[d] * 4]; }
    if (g.i === 2) return Math.hypot(g.x - px, g.y - py) < 7 ? [px, py] : corner;
    return Math.random() < 0.4 ? [px, py] : null; // Locuela: medio al azar
  }
  function enemyCenter(g) {
    const cx = Math.round(g.x), cy = Math.round(g.y);
    if (g.state === 'eyes' && cx === OUT.x && cy === OUT.y) { g.state = 'entering'; return false; }
    const back = (g.dir + 2) % 4;
    let opts = [3, 2, 1, 0].filter((d) => d !== back && !wall(cx + DX[d], cy + DY[d]));
    if (!opts.length) opts = [back];
    let best = opts[0];
    if (g.state === 'eyes') {
      let bd = 1e9;
      for (const d of [3, 2, 1, 0]) {
        const nx = (cx + DX[d] + COLS) % COLS, ny = cy + DY[d]; if (wall(nx, ny)) continue;
        const v = homeDist[ny * COLS + nx]; if (v >= 0 && v < bd) { bd = v; best = d; }
      }
    } else if (g.fright) best = opts[(Math.random() * opts.length) | 0];
    else {
      const tg = targetOf(g);
      if (!tg) best = opts[(Math.random() * opts.length) | 0];
      else {
        let bd = 1e9;
        for (const d of opts) { const v = (cx + DX[d] - tg[0]) ** 2 + (cy + DY[d] - tg[1]) ** 2; if (v < bd) { bd = v; best = d; } }
      }
    }
    g.dir = best;
    return true;
  }
  function moveEnemy(g, h) {
    const sp = enemySpeed(g) * h;
    g.bob += h * 5;
    if (g.state === 'house') { g.y = 10 + Math.sin(g.bob * 0.8) * 0.28; return; }
    if (g.state === 'leaving') {
      if (Math.abs(g.x - 9) > 1e-4) { g.x = approach(g.x, 9, sp); g.y = approach(g.y, 10, sp); }
      else { g.y = approach(g.y, OUT.y, sp); g.look = 3; if (g.y === OUT.y) { g.state = 'active'; g.dir = Math.random() < 0.5 ? 2 : 0; } }
      return;
    }
    if (g.state === 'entering') {
      g.x = 9; g.y = approach(g.y, 10, sp * 2); g.look = 1;
      if (g.y === 10) { g.state = 'leaving'; g.fright = false; }
      return;
    }
    if (g.reverse) { g.reverse = false; if (g.state === 'active') g.dir = (g.dir + 2) % 4; }
    step(g, sp, enemyCenter);
    g.look = g.dir; if (DX[g.dir]) g.face = DX[g.dir];
  }

  // IA del modo demostración: busca el dulce más cercano evitando avispas
  function aiDir(cx, cy) {
    const danger = new Uint8Array(COLS * ROWS);
    for (const g of enemies) {
      if (g.state !== 'active' || g.fright) continue;
      const gx = Math.round(g.x), gy = Math.round(g.y);
      for (let y = gy - 2; y <= gy + 2; y++) for (let x = gx - 2; x <= gx + 2; x++) if (y >= 0 && y < ROWS && Math.abs(x - gx) + Math.abs(y - gy) <= 2) danger[y * COLS + ((x + COLS) % COLS)] = 1;
    }
    const prev = new Int16Array(COLS * ROWS).fill(-1), start = cy * COLS + cx; prev[start] = start;
    const q = [start];
    for (let i = 0; i < q.length; i++) {
      const k = q[i], x = k % COLS, y = (k / COLS) | 0;
      if (i > 0 && dots[k]) { let c = k; while (prev[c] !== start) c = prev[c]; const nx = c % COLS, ny = (c / COLS) | 0; for (let d = 0; d < 4; d++) if ((cx + DX[d] + COLS) % COLS === nx && cy + DY[d] === ny) return d; }
      for (const d of [0, 1, 2, 3]) {
        const nx = (x + DX[d] + COLS) % COLS, ny = y + DY[d]; if (wall(nx, ny)) continue;
        const nk = ny * COLS + nx; if (prev[nk] >= 0 || (danger[nk] && i > 0)) continue;
        if (i === 0 && danger[nk]) continue;
        prev[nk] = k; q.push(nk);
      }
    }
    const opts = [0, 1, 2, 3].filter((d) => !wall(cx + DX[d], cy + DY[d]));
    return opts[(Math.random() * opts.length) | 0];
  }

  // ---------- Reglas ----------
  function burst(x, y, color, n, spd, size) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(0.3, 1) * (spd || 6);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 0.8), max: 0.8, color, size: (size || 0.12) * rand(0.6, 1.3) });
    }
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color: color || '#fff', life: 1 }); }

  function eatAt() {
    const p = player, cx = Math.round(p.x), cy = Math.round(p.y);
    if (Math.abs(p.x - cx) > 0.4 || Math.abs(p.y - cy) > 0.4 || cy < 0 || cy >= ROWS) return;
    const k = cy * COLS + ((cx + COLS) % COLS), v = dots[k];
    if (v) {
      dots[k] = 0; dotsLeft--; eatenCount++;
      if (v === 1) {
        if (!attract) { shell.addBase(10); wakka = !wakka; shell.tone(wakka ? 420 : 620, wakka ? 640 : 380, 0.055, 'triangle', 0.06); }
        burst(cx, cy, '#ffd6f3', 3, 3, 0.08);
      } else {
        if (!attract) { shell.addBase(50); shell.coin(1); shell.tone(180, 880, 0.28, 'sawtooth', 0.035); shell.tone(360, 1400, 0.22, 'sine', 0.05, 0.05); shell.haptic('medium'); }
        burst(cx, cy, '#ffe36a', 16, 9, 0.16); burst(cx, cy, '#ff6ad5', 10, 6, 0.14);
        shake = Math.max(shake, 0.12);
        startFright();
      }
      if (!bonus && ((bonusSpawned === 0 && eatenCount >= 70) || (bonusSpawned === 1 && eatenCount >= 160))) {
        bonusSpawned++; bonus = { ...BONUS[(level - 1) % BONUS.length], x: startTile[0], y: startTile[1], t: 9 };
        bonus.pts = BONUS[(level - 1) % BONUS.length].pts + Math.floor((level - 1) / 4) * 500;
      }
    }
    if (bonus && Math.abs(p.x - bonus.x) < 0.6 && Math.abs(p.y - bonus.y) < 0.6) {
      if (!attract) { shell.addBase(bonus.pts); shell.coin(1); shell.haptic('light'); [784, 988, 1175, 1568].forEach((f, i) => shell.tone(f, f, 0.09, 'square', 0.035, i * 0.06)); }
      popup(bonus.x, bonus.y, '+' + bonus.pts, '#ffe36a'); burst(bonus.x, bonus.y, '#ffe36a', 18, 7, 0.15);
      bonus = null;
    }
  }
  function startFright() {
    frightT = frightDur; combo = 0;
    for (const g of enemies) if (g.state === 'active' || g.state === 'house' || g.state === 'leaving') { g.fright = true; if (g.state === 'active') g.reverse = true; }
  }
  function collide() {
    for (const g of enemies) {
      if (g.state !== 'active') continue;
      const dx = Math.abs(g.x - player.x), dy = Math.abs(g.y - player.y);
      if (Math.min(dx, COLS - dx) > 0.62 || dy > 0.62) continue;
      if (g.fright) {
        combo++; const pts = 200 * 2 ** Math.min(combo - 1, 3);
        g.fright = false; g.state = 'eyes';
        popup(g.x, g.y, String(pts), '#7ef8ff'); burst(g.x, g.y, ENEMY[g.i].col, 20, 9, 0.16); burst(g.x, g.y, '#ffffff', 8, 5, 0.1);
        hitstop = 0.32; shake = Math.max(shake, 0.18);
        if (!attract) { shell.addBase(pts); shell.haptic('heavy'); shell.tone(300, 1500 + combo * 200, 0.2, 'square', 0.04); shell.tone(900, 2000, 0.12, 'sine', 0.05, 0.12); }
      } else if (invuln <= 0 && !dying) {
        if (attract) { burst(player.x, player.y, '#4ff5d2', 24, 8, 0.15); resetPositions(); invuln = 1.2; return true; }
        die(); return true;
      }
    }
    return false;
  }
  function die() {
    dying = true; deathT = 0; shake = 0.45;
    burst(player.x, player.y, '#4ff5d2', 30, 10, 0.18); burst(player.x, player.y, '#b583ff', 14, 6, 0.14);
    shell.tone(760, 80, 0.75, 'triangle', 0.08); shell.noise(0.35, 0.25, 900);
    shell.crash();
  }
  function levelClear() {
    if (attract) { loadMaze(level === 1 ? 2 : 1); level = level === 1 ? 2 : 1; resetPositions(); return; }
    phase = 'clear'; phaseT = 2;
    shell.haptic('success');
    [523, 659, 784, 1047, 1319].forEach((f, i) => shell.tone(f, f * 1.01, 0.14, 'square', 0.04, i * 0.09));
  }

  function sim(dt) {
    lifeT += dt;
    if (frightT > 0) {
      frightT -= dt;
      sirenT -= dt; if (sirenT <= 0 && !attract) { sirenT = 0.32; shell.tone(240, 330, 0.12, 'sine', 0.025); }
      if (frightT <= 0) { frightT = 0; for (const g of enemies) g.fright = false; }
    } else {
      modeT += dt;
      if (modeT >= MODES[modeIdx]) { modeT = 0; modeIdx++; for (const g of enemies) if (g.state === 'active') g.reverse = true; }
    }
    if (invuln > 0) invuln -= dt;
    if (bonus) { bonus.t -= dt; if (bonus.t <= 0) bonus = null; }
    const rel = [0, 1, 4, 7], k = Math.max(0.35, 1 - 0.15 * (level - 1));
    for (const g of enemies) if (g.state === 'house' && lifeT >= rel[g.i] * k) g.state = 'leaving';
    const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
    for (let s = 0; s < n; s++) {
      movePlayer(h); eatAt();
      for (const g of enemies) moveEnemy(g, h);
      if (collide()) return;
      if (hitstop > 0) return;
      if (dotsLeft === 0) { levelClear(); return; }
    }
  }

  // ---------- Shell ----------
  const shell = Arcade.create({
    id: 'mordisco', title: ['Mor', 'disco'], bg: '#0b0420',
    tagline: 'Cómete todos los dulces del laberinto de neón sin que te piquen las avispas.',
    how: [
      '<b>Desliza</b> el dedo hacia donde quieras ir (o usa las flechas). El giro se guarda hasta que haya hueco.',
      'Cómete todos los dulces para pasar de nivel. Las avispas cada vez van más rápido.',
      'Los <b>caramelos</b> gordos asustan a las avispas unos segundos: ¡muérdelas para ganar 200, 400, 800 y 1.600 puntos!',
      'De vez en cuando aparece un premio en el centro. También cuenta como caramelo. Por los lados hay túneles.'
    ],
    coinLabel: 'Caramelos', coinSingular: 'caramelo', coinValue: 50, rivalTop: 6000, statLabel: 'Nivel',
    crashTitle: '¡Te han pillado!', reviveLabel: 'Otra vida', reviveReward: 'una vida extra', countdown: true,
    onStart() { attract = false; newGame(); shell.stat = 1; },
    onGo() { player.want = player.want < 0 ? 2 : player.want; },
    onRevive() { resetPositions(); invuln = 2.2; frightT = 0; phase = 'play'; },
    onMenu() { startAttract(); }
  });
  function startAttract() { attract = true; level = 1; loadMaze(1); resetPositions(); phase = 'play'; invuln = 0; bonus = null; frightDur = 6; eatenCount = 0; bonusSpawned = 0; }

  // ---------- Controles ----------
  let sw = null;
  function setWant(d) { if (player && !attract) player.want = d; }
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); Arcade.audio(); sw = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointermove', (e) => {
    if (!sw) return;

      ctx.fillStyle = p.color; ctx.fillText(p.text, PX(p.x), PY(p.y) - (1 - p.life) * ts);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // pie: nivel y premios
    if (!attract) {
      const fy = oy + ROWS * ts + 16;
      if (fy < H - safe.b - 6) {
        ctx.font = `${Math.round(Math.min(15, ts * 0.75))}px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#b9a6d9';
        ctx.fillText('NIVEL ' + level, ox + ts * 0.3, fy);
        ctx.save();
        for (let k = 0; k < Math.min(level, 6); k++) { ctx.save(); ctx.translate(ox + COLS * ts - ts * (0.7 + k * 1.15), fy); drawBonusIcon(BONUS[(level - 1 - k) % BONUS.length].kind, ts * 0.3); ctx.restore(); }
        ctx.restore();
      }
    }
    // carteles
    const cy = PY(13);
    if (!attract && (phase === 'clear' || phase === 'ready')) {
      const txt = phase === 'clear' ? '¡LIMPIO!' : 'NIVEL ' + level;
      banner(txt, cy, phase === 'clear' ? '#ffe36a' : '#4ff5d2');
    } else if (!attract && hintT > 0 && level === 1 && (shell.state === 'play' || shell.state === 'count')) {
      ctx.globalAlpha = clamp(hintT, 0, 1);
      ctx.font = `800 ${Math.round(Math.min(15, ts * 0.75))}px "Nunito", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4ff5d2'; ctx.fillText('Desliza para girar', W / 2, oy + ROWS * ts + 16);
      ctx.globalAlpha = 1;
    }
  }
  function banner(txt, y, color) {
    ctx.save(); ctx.font = `${Math.round(Math.min(34, ts * 1.6))}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const bw = ctx.measureText(txt).width + 36, bh = Math.min(34, ts * 1.6) * 1.6;
    ctx.fillStyle = 'rgba(11,4,32,0.82)'; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(W / 2 - bw / 2, y - bh / 2, bw, bh, bh / 2); else ctx.rect(W / 2 - bw / 2, y - bh / 2, bw, bh); ctx.fill(); ctx.stroke();
    ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.55; ctx.fillText(txt, W / 2, y); ctx.restore();
  }

  // ---------- Bucle ----------
  function update(dt) {
    t += dt;
    const st = shell.state;
    if (st === 'menu') { attract = true; if (hitstop > 0) hitstop -= dt; else sim(dt); }
    else if (shell.playing()) {
      if (hitstop > 0) hitstop -= dt;
      else if (phase === 'clear') { phaseT -= dt; if (phaseT <= 0) nextLevel(); }
      else if (phase === 'ready') { phaseT -= dt; if (phaseT <= 0) phase = 'play'; }
      else { sim(dt); if (hintT > 0 && player.moving) hintT -= dt; }
    }
    if (dying) deathT += dt;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const p of popups) p.life -= dt * 0.9;
    popups = popups.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt);
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); shell.paintHud();
    requestAnimationFrame(frame);
  }
  resize(); startAttract();
  requestAnimationFrame(frame);

  const DIRN = { right: 0, down: 1, left: 2, up: 3 };
  window.__game = {
    shell,
    setDir(d) { setWant(typeof d === 'string' ? DIRN[d] : d); },
    get player() { return player; }, get enemies() { return enemies; }, get dotsLeft() { return dotsLeft; },
    get level() { return level; }, get phase() { return phase; }, get frightT() { return frightT; },
    tile() { return [Math.round(player.x), Math.round(player.y)]; },
    catchMe() { const g = enemies[0]; g.state = 'active'; g.fright = false; g.x = player.x; g.y = player.y; invuln = 0; },
    clearDots(keep) { let n = keep == null ? 1 : keep; for (let i = 0; i < dots.length; i++) if (dots[i]) { if (n > 0 && dots[i] === 1) { n--; continue; } dots[i] = 0; dotsLeft--; } },
    power() { startFright(); }
  };
})();
</script>
