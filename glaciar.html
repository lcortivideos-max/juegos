<!doctype html>
<html lang="es">
<head>

<title>Glaciar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
/* Layout: laberinto de bloques de hielo 13×15 entre el marcador y los controles táctiles; un pingüino con bufanda empuja bloques contra los copos */
:root {
  --bg: #d7ebff;
  --ink: #1f2b5c;
  --muted: #5d6c9e;
  --panel: rgba(250, 252, 255, 0.92);
  --line: rgba(60, 100, 180, 0.22);
  --accent: #2f86ff;
  --onaccent: #ffffff;
  --gold: #e8408f;
  --ongold: #ffffff;
  --goldline: rgba(232, 64, 143, 0.4);
  --goldtint: rgba(232, 64, 143, 0.08);
  --veil: rgba(190, 215, 245, 0.38);
  --shadow: rgba(40, 70, 140, 0.28);
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
.sh-logo { font-weight: 700 !important; }
#ctl { position: absolute; left: 0; right: 0; bottom: 0; height: calc(136px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; padding: 0 max(14px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(14px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; z-index: 4; pointer-events: none; }
#dpad { pointer-events: auto; touch-action: none; position: relative; width: 126px; height: 126px; flex: none; }
#dpad .b { position: absolute; width: 44px; height: 44px; box-sizing: border-box; border-radius: 13px; background: rgba(255, 255, 255, 0.62); border: 1.5px solid rgba(70, 120, 200, 0.32); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -3px 0 rgba(60, 100, 170, 0.18), 0 5px 14px rgba(40, 70, 140, 0.16); transition: transform .05s, background .05s; }
#dpad .b svg { width: 22px; height: 22px; fill: var(--ink); opacity: .8; }
#dpad .b.on { background: rgba(120, 190, 255, 0.85); border-color: #fff; transform: scale(.94); }
#dpad .u { left: 41px; top: 0; } #dpad .d { left: 41px; bottom: 0; } #dpad .l { left: 0; top: 41px; } #dpad .r { right: 0; top: 41px; }
#dpad .hub { position: absolute; left: 49px; top: 49px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.4); border: 1.5px solid rgba(70, 120, 200, 0.2); }
#ctl .mid { flex: 1; min-width: 0; text-align: center; font: 700 12px/1.35 var(--body); color: var(--muted); opacity: .9; }
#push { pointer-events: auto; touch-action: none; flex: none; width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; color: #fff; text-shadow: 0 2px 0 rgba(20, 60, 140, .35); background: radial-gradient(circle at 34% 28%, #bff0ff, #59b6ff 45%, #2a6fe0 100%); border: 2.5px solid rgba(255, 255, 255, 0.85); box-shadow: 0 10px 26px rgba(40, 110, 230, 0.38), inset 0 -6px 0 rgba(10, 40, 120, .22); transition: transform .06s, filter .06s; }
#push.on { transform: scale(.92); filter: brightness(1.12); }
@media (max-width: 350px) { #dpad { width: 114px; height: 114px; } #dpad .b { width: 40px; height: 40px; } #dpad .u, #dpad .d { left: 37px; } #dpad .l, #dpad .r { top: 37px; } #dpad .hub { left: 43px; top: 43px; } #push { width: 94px; height: 94px; font-size: 16px; } }
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="Juego Glaciar"></canvas>
  <div id="ctl" hidden>
    <div id="dpad" role="group" aria-label="Cruceta">
      <div class="hub"></div>
      <div class="b u" data-d="3" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M4 16 12 6l8 10z"/></svg></div>
      <div class="b l" data-d="2" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></div>
      <div class="b r" data-d="0" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg></div>
      <div class="b d" data-d="1" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M4 8l8 10 8-10z"/></svg></div>
    </div>
    <div class="mid">o desliza<br>en el tablero</div>
    <div id="push" role="button" aria-label="Empujar">EMPUJAR</div>
  </div>
</div>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (n) => (Math.random() * n) | 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (n) => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const FONT = '"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif';

  // ---------- Tablero ----------
  const COLS = 13, ROWS = 15, START = [6, 6];
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1]; // derecha, abajo, izquierda, arriba
  const EMPTY = 0, ICE = 1, GEM = 2;
  const CRUSH = [0, 400, 1600, 3200, 6400];
  const SLIDE_SPEED = 17, PLAYER_SPEED = 6.2;
  const COPOS = [
    { c: '#ff7eb6', d: '#c22d6c', l: '#ffd9ea' },
    { c: '#8ad94c', d: '#3c8614', l: '#e0ffc8' },
    { c: '#ffa64a', d: '#c45800', l: '#ffe6c6' },
    { c: '#a68bff', d: '#5634c6', l: '#e6ddff' }
  ];
  const grid = new Uint8Array(COLS * ROWS);
  const K = (x, y) => y * COLS + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  const G = (x, y) => (inb(x, y) ? grid[K(x, y)] : -1);

  // ---------- Estado ----------
  let W = 0, H = 0, DPR = 1, ts = 24, ox = 0, oy = 0, fw = 8, safe = { t: 0, r: 0, b: 0, l: 0 }, ctlH = 136;
  let t = 0, level = 1, phase = 'play', phaseT = 0, levelT = 0, angry = false, angryMsgT = 0, hatchCD = 0, revealT = 0;
  let P = null, eggs = new Map(), slides = [], enemies = [], player = null, particles = [], popups = [], flakes = [], glints = [];
  let attract = true, invuln = 0, shake = 0, wallShake = [0, 0, 0, 0], flashT = 0, gemDone = false, gemMsgT = 0, clearInfo = null;
  let noHatch = false, noClear = false, distMap = null, distT = 0, hintT = 0, glintT = 0, crushes = 0;
  let held = -1, queued = -1, pushQ = false;
  let bgLayer = null, floorLayer = null, spr = {};

  function params() {
    return {
      enemySpeed: Math.min(5.2, 2.8 + 0.28 * (level - 1)),
      maxActive: Math.min(4, 2 + Math.ceil(level / 2)),
      eggs: Math.min(12, 5 + level),
      angryAt: Math.max(24, 56 - 4 * (level - 1)),
      stun: Math.max(2.2, 3.8 - 0.15 * (level - 1)),
      chase: Math.min(0.78, 0.32 + 0.06 * (level - 1)),
      chew: level >= 2 ? Math.min(0.35, 0.08 * (level - 1)) : 0
    };
  }

  // ---------- Laberinto ----------
  function genMaze() {
    grid.fill(ICE);
    const NX = 7, NY = 8, seen = new Uint8Array(NX * NY);
    const st = [[3, 3]]; seen[3 * NX + 3] = 1; grid[K(6, 6)] = EMPTY;
    while (st.length) {
      const [cx, cy] = st[st.length - 1];
      const opts = [0, 1, 2, 3].filter((d) => { const nx = cx + DX[d], ny = cy + DY[d]; return nx >= 0 && ny >= 0 && nx < NX && ny < NY && !seen[ny * NX + nx]; });
      if (!opts.length) { st.pop(); continue; }
      const d = opts[irand(opts.length)], nx = cx + DX[d], ny = cy + DY[d];
      seen[ny * NX + nx] = 1; grid[K(cx * 2 + DX[d], cy * 2 + DY[d])] = EMPTY; grid[K(nx * 2, ny * 2)] = EMPTY;
      st.push([nx, ny]);
    }
    // algunos huecos extra para que haya recorridos en círculo
    let extra = 5 + irand(3), guard = 0;
    while (extra > 0 && guard++ < 400) {
      const x = irand(COLS), y = irand(ROWS);
      if ((x % 2) + (y % 2) === 1 && grid[K(x, y)] === ICE) { grid[K(x, y)] = EMPTY; extra--; }
    }
  }
  function placeSpecials() {
    const cand = [];
    for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) if (grid[K(x, y)] === ICE && Math.abs(x - START[0]) + Math.abs(y - START[1]) > 1) cand.push([x, y]);
    const gems = [];
    for (let tries = 0; gems.length < 3 && tries < 500; tries++) {
      const c = cand[irand(cand.length)];
      if (gems.some((g) => Math.abs(g[0] - c[0]) + Math.abs(g[1] - c[1]) < 3)) continue;
      gems.push(c);
    }
    for (const g of gems) grid[K(g[0], g[1])] = GEM;
    eggs = new Map();
    const ec = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[K(x, y)] === ICE && Math.abs(x - START[0]) + Math.abs(y - START[1]) >= 4) ec.push([x, y]);
    for (let i = 0; i < P.eggs && ec.length; i++) {
      const [x, y] = ec.splice(irand(ec.length), 1)[0];
      eggs.set(K(x, y), { c: (level - 1 + irand(2)) % COPOS.length, warn: -1 });
    }
  }

  function resetPlayer() {
    player = { x: START[0], y: START[1], dir: 1, p: 0, moving: false, back: false, walk: 0, pushT: 0, dead: false, deathT: 0, blink: 2 };
    held = -1; queued = -1; pushQ = false;
  }
  function buildLevel() {
    noClear = false; P = params(); genMaze(); placeSpecials();
    enemies = []; slides = []; resetPlayer();
    levelT = 0; angry = false; gemDone = false; hatchCD = 0.4; revealT = 1.8; clearInfo = null; distMap = null;
  }
  function newGame() { level = 1; buildLevel(); phase = 'play'; invuln = 0; particles = []; popups = []; hintT = 6; crushes = 0; }
  function nextLevel() {
    level++; shell.stat = level; buildLevel(); phase = 'ready'; phaseT = 1.4; invuln = 0;
  }
  function startAttract() { attract = true; level = 1 + irand(3); buildLevel(); level = 1; phase = 'play'; invuln = 0; particles = []; popups = []; }

  // ---------- Utilidades de ocupación ----------
  const ppos = () => [player.x + (player.moving ? DX[player.dir] * player.p : 0), player.y + (player.moving ? DY[player.dir] * player.p : 0)];
  const epos = (e) => (e.state === 'carried' || e.state === 'dead') ? [e.fx, e.fy] : [e.x + (e.moving ? DX[e.dir] * e.p : 0), e.y + (e.moving ? DY[e.dir] * e.p : 0)];
  const spos = (s) => [s.x + DX[s.dir] * s.p, s.y + DY[s.dir] * s.p];
  const alive = (e) => e.state !== 'dead' && e.state !== 'carried';
  function slideAt(x, y, except) {
    for (const s of slides) { if (s === except) continue; const [sx, sy] = spos(s); if (Math.abs(sx - x) < 0.999 && Math.abs(sy - y) < 0.999) return true; }
    return false;
  }
  const freeCell = (x, y) => inb(x, y) && grid[K(x, y)] === EMPTY && !slideAt(x, y);
  function enemyFree(x, y, self) {
    if (!freeCell(x, y)) return false;
    for (const e of enemies) {
      if (e === self || !alive(e)) continue;
      if (e.x === x && e.y === y && !e.moving) return false;
      if (e.moving && e.x + DX[e.dir] === x && e.y + DY[e.dir] === y) return false;
    }
    return true;
  }

  // ---------- Efectos ----------
  function shards(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(0.4, 1) * (spd || 6);
      particles.push({ k: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2.5, g: 12, rot: rand(0, TAU), vr: rand(-12, 12), life: rand(0.45, 0.85), color, size: rand(0.07, 0.17) });
    }
  }
  function sparkles(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(0.3, 1) * (spd || 4);
      particles.push({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, rot: rand(0, TAU), vr: rand(-3, 3), life: rand(0.5, 1.0), color, size: rand(0.12, 0.26) });
    }
  }
  function puffs(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(0.5, 2);
      particles.push({ k: 'puff', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, rot: 0, vr: 0, life: rand(0.35, 0.6), color: '#ffffff', size: rand(0.12, 0.24) });
    }
  }
  function popup(x, y, text, color, big) { popups.push({ x, y, text, color: color || '#2f86ff', life: 1, big: !!big }); }
  const score = (n) => { if (!attract) shell.addBase(n); };
  const coin = (n) => { if (!attract) shell.coin(n); };
  const sfx = (f) => { if (!attract) f(); };

  // ---------- Reglas ----------
  function breakBlock(x, y, byPlayer) {
    const k = K(x, y), kind = grid[k], egg = eggs.get(k);
    if (kind !== ICE) return;
    grid[k] = EMPTY; eggs.delete(k);
    shards(x, y, '#d8f5ff', 12, 6); shards(x, y, '#8fd3f5', 6, 5); puffs(x, y, 4);
    sfx(() => { shell.noise(0.22, 0.22, 3200); shell.tone(1100, 320, 0.12, 'triangle', 0.05); });
    if (byPlayer) {
      if (egg) {
        score(500); coin(1); popup(x, y, '+500', COPOS[egg.c].d);
        shards(x, y, COPOS[egg.c].c, 10, 5); sparkles(x, y, '#ff6fb0', 6, 3);
        sfx(() => { shell.tone(500, 1500, 0.14, 'square', 0.035, 0.04); shell.haptic('medium'); });
      } else score(30);
    }
  }
  function startSlide(x, y, d) {
    const k = K(x, y), s = { x, y, dir: d, p: 0, kind: grid[k], egg: eggs.get(k) || null, carried: [], dist: 0 };
    grid[k] = EMPTY; eggs.delete(k); slides.push(s);
    sfx(() => { shell.noise(0.2, 0.12, 2400); shell.tone(380, 180, 0.14, 'triangle', 0.05); });
  }
  function slideBlocked(s, nx, ny) {
    if (!inb(nx, ny) || grid[K(nx, ny)] !== EMPTY || slideAt(nx, ny, s)) return true;
    const px = player.x, py = player.y;
    if (px === nx && py === ny) return true;
    if (player.moving && px + DX[player.dir] === nx && py + DY[player.dir] === ny) return true;
    return false;
  }
  function updateSlide(s, h) {
    if (s.p === 0 && slideBlocked(s, s.x + DX[s.dir], s.y + DY[s.dir])) { stopSlide(s); return; }
    s.p += SLIDE_SPEED * h;
    if (s.p >= 1) { s.x += DX[s.dir]; s.y += DY[s.dir]; s.p -= 1; s.dist++; if (slideBlocked(s, s.x + DX[s.dir], s.y + DY[s.dir])) { s.p = 0; } }
    // aplastar lo que haya delante
    const [lx, ly] = spos(s), sg = DX[s.dir] || DY[s.dir], hz = !!DX[s.dir];
    for (const e of enemies) {
      if (!alive(e)) continue;
      const [ex, ey] = epos(e);
      const along = ((hz ? ex - lx : ey - ly)) * sg, perp = Math.abs(hz ? ey - ly : ex - lx);
      if (along > -0.25 && along < 0.98 && perp < 0.62) {
        e.state = 'carried'; e.moving = false; e.squash = s.dir; s.carried.push(e);
        sfx(() => { shell.tone(260, 80, 0.16, 'sawtooth', 0.045); shell.haptic('heavy'); });
      }
    }
    for (const e of s.carried) { e.fx = lx + DX[s.dir] * 0.62; e.fy = ly + DY[s.dir] * 0.62; }
  }
  function stopSlide(s) {
    slides.splice(slides.indexOf(s), 1);
    const k = K(s.x, s.y); grid[k] = s.kind; if (s.egg) eggs.set(k, s.egg);
    sfx(() => shell.tone(170, 90, 0.09, 'square', 0.05));
    if (s.dist > 0) { shake = Math.max(shake, 0.08); puffs(s.x + DX[s.dir] * 0.5, s.y + DY[s.dir] * 0.5, 4); }
    if (s.carried.length) {
      const n = s.carried.length, pts = CRUSH[Math.min(n, 4)];
      for (const e of s.carried) { e.state = 'dead'; e.t = 0.7; e.fx = s.x + DX[s.dir] * 0.58; e.fy = s.y + DY[s.dir] * 0.58; shards(e.fx, e.fy, COPOS[e.c].c, 12, 5); }
      score(pts); crushes += n; if (n >= 2) coin(n - 1);
      popup(s.x + DX[s.dir] * 0.6, s.y + DY[s.dir] * 0.6 - 0.3, '+' + nf(pts), '#e8408f', n >= 2);
      sparkles(s.x, s.y, '#ffffff', 8 + n * 4, 4);
      shake = Math.max(shake, 0.18 + 0.06 * n);
      sfx(() => { [660, 880, 1320, 1760].slice(0, n + 1).forEach((f, i) => shell.tone(f, f * 1.02, 0.1, 'square', 0.035, i * 0.06)); });
    }
    if (s.kind === GEM) checkGems();
  }
  function checkGems() {
    if (gemDone) return;
    const g = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[K(x, y)] === GEM) g.push([x, y]);
    if (g.length !== 3) return;
    const row = g.every((c) => c[1] === g[0][1]), col = g.every((c) => c[0] === g[0][0]);
    if (!row && !col) return;
    const v = g.map((c) => (row ? c[0] : c[1])).sort((a, b) => a - b);
    if (v[1] !== v[0] + 1 || v[2] !== v[1] + 1) return;
    const touching = g.some(([x, y]) => x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1);
    const pts = touching ? 5000 : 10000;
    gemDone = true; gemMsgT = 2.2; flashT = 0.5; shake = 0.35;
    score(pts); coin(touching ? 3 : 6);
    const mid = g.slice().sort((a, b) => (row ? a[0] - b[0] : a[1] - b[1]))[1];
    popup(mid[0], mid[1] - 0.6, '+' + nf(pts), '#e8408f', true);
    for (const c of g) { sparkles(c[0], c[1], '#ff8cc6', 14, 6); sparkles(c[0], c[1], '#fff3a0', 10, 5); }
    for (const e of enemies) if (alive(e)) stun(e, 6);
    sfx(() => { shell.haptic('success'); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => shell.tone(f, f, 0.16, 'square', 0.04, i * 0.07)); });
  }
  function stun(e, dur) { e.state = 'stun'; e.t = dur; e.chewT = 0; }
  function wallHit(side) {
    wallShake[side] = 0.5; shake = Math.max(shake, 0.22);
    sfx(() => { shell.noise(0.35, 0.32, 260); shell.tone(110, 55, 0.35, 'sine', 0.2); shell.tone(220, 440, 0.18, 'triangle', 0.04, 0.05); shell.haptic('medium'); });
    let n = 0;
    for (const e of enemies) {
      if (!alive(e)) continue;
      const [ex, ey] = epos(e);
      const on = side === 0 ? ex >= COLS - 1.35 : side === 2 ? ex <= 0.35 : side === 1 ? ey >= ROWS - 1.35 : ey <= 0.35;
      if (on) { stun(e, P.stun); n++; sparkles(ex, ey, '#ffe066', 5, 2); }
    }
    if (n) sfx(() => shell.tone(880, 1760, 0.2, 'sine', 0.05, 0.08));
  }
  function doPush() {
    const p = player, d = p.dir, nx = p.x + DX[d], ny = p.y + DY[d];
    p.pushT = 0.24;
    if (!inb(nx, ny)) { wallHit(d); return; }
    const v = grid[K(nx, ny)];
    if (v === EMPTY) { puffs(p.x + DX[d] * 0.6, p.y + DY[d] * 0.6, 2); return; }
    sfx(() => shell.haptic('light'));
    if (slideAt(nx, ny)) return;
    const bx = nx + DX[d], by = ny + DY[d];
    if (freeCell(bx, by)) startSlide(nx, ny, d);
    else if (v === ICE) breakBlock(nx, ny, true);
    else { sfx(() => shell.tone(140, 110, 0.12, 'square', 0.05)); wobble = { x: nx, y: ny, t: 0.3 }; }
  }
  let wobble = null;
  function hatchAt(k) {
    const egg = eggs.get(k), x = k % COLS, y = (k / COLS) | 0;
    eggs.delete(k); grid[k] = EMPTY;
    shards(x, y, '#d8f5ff', 12, 6); shards(x, y, COPOS[egg.c].c, 8, 4);
    enemies.push({ x, y, dir: irand(4), p: 0, moving: false, back: false, state: 'hatch', t: 0.6, c: egg.c, seed: rand(0, TAU), bob: rand(0, TAU), wait: 0, chewT: 0, look: 1 });
    sfx(() => { shell.tone(300, 900, 0.12, 'square', 0.04); shell.noise(0.15, 0.15, 2600); });
  }
  function defeatStunned(e) {
    const [ex, ey] = epos(e);
    e.state = 'dead'; e.pop = true; e.t = 0.5; e.fx = ex; e.fy = ey;
    score(100); popup(ex, ey - 0.3, '+100', '#2f86ff');
    sparkles(ex, ey, COPOS[e.c].c, 10, 4); sparkles(ex, ey, '#ffe066', 6, 3);

    rr(ctx, -r * 0.6, -r * 0.06, r * 1.2, r * 0.22, r * 0.11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (const sx of [-0.32, 0.04, 0.4]) ctx.fillRect(sx * r, -r * 0.06, r * 0.08, r * 0.22);
    ctx.fillStyle = '#ff4766';
    ctx.save();
    if (side) { ctx.translate(-r * 0.45, r * 0.04); ctx.rotate(walking ? 1.25 + Math.sin(ph * 2) * 0.15 : 0.35); rr(ctx, -r * 0.08, 0, r * 0.18, r * 0.52 + flut, r * 0.08); ctx.fill(); }
    else if (back) { ctx.translate(r * 0.05, r * 0.05); ctx.rotate(0.12 + flut / r); rr(ctx, -r * 0.08, 0, r * 0.17, r * 0.5, r * 0.08); ctx.fill(); ctx.rotate(-0.3); rr(ctx, -r * 0.08, 0, r * 0.15, r * 0.42, r * 0.08); ctx.fill(); }
    else { ctx.translate(-r * 0.32, r * 0.08); ctx.rotate(0.15 + flut / r); rr(ctx, -r * 0.08, 0, r * 0.18, r * 0.44, r * 0.08); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(-r * 0.08, r * 0.3, r * 0.18, r * 0.06); }
    ctx.restore();
    ctx.restore(); ctx.globalAlpha = 1;
    if (p.dead) {
      ctx.fillStyle = '#ffd23f';
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * TAU / 3; star4(ctx, PX(gx) + Math.cos(a) * r * 0.7, PY(gy) - r * 1.0 + Math.sin(a) * r * 0.25, r * 0.22, a); }
    }
  }

  function drawCopo(e) {
    const col = COPOS[e.c], r = ts * 0.42;
    const [ex, ey] = epos(e);
    let x = PX(ex), y = PY(ey);
    ctx.save(); ctx.translate(x, y);
    if (e.state === 'dead') {
      const k = 1 - e.t / (e.pop ? 0.5 : 0.7);
      if (e.pop) { ctx.globalAlpha = 1 - k; ctx.scale(1 + k * 0.8, 1 + k * 0.8); }
      else { ctx.globalAlpha = clamp(e.t / 0.3, 0, 1); if (DX[e.squash]) ctx.scale(0.32, 1.35); else ctx.scale(1.35, 0.32); }
    } else if (e.state === 'carried') { if (DX[e.squash]) ctx.scale(0.45, 1.25); else ctx.scale(1.25, 0.45); }
    else if (e.state === 'hatch') { const k = clamp(1 - e.t / 0.6, 0, 1); const s = k < 0.7 ? k / 0.7 * 1.15 : 1.15 - (k - 0.7) / 0.3 * 0.15; ctx.scale(s, s); }
    const stunned = e.state === 'stun', chewing = e.state === 'chew';
    if (e.state !== 'dead' && e.state !== 'carried') { ctx.fillStyle = 'rgba(30,60,130,0.2)'; ellipse(0, r * 0.88, r * 0.62, r * 0.18); ctx.fill(); }
    const hop = e.state === 'walk' && e.moving ? -Math.abs(Math.sin(e.bob)) * r * 0.16 : 0;
    if (chewing) ctx.translate(Math.sin(t * 50) * r * 0.08, 0);
    if (stunned) ctx.rotate(Math.sin(t * 6) * 0.15);
    ctx.translate(0, hop);
    // patitas
    ctx.fillStyle = col.d;
    const st = e.moving ? Math.sin(e.bob) * r * 0.12 : 0;
    ellipse(-r * 0.32, r * 0.78 + st, r * 0.16, r * 0.1); ctx.fill(); ellipse(r * 0.32, r * 0.78 - st, r * 0.16, r * 0.1); ctx.fill();
    // pelaje
    const n = 15;
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = i / (n * 2) * TAU + e.seed;
      const rad = i % 2 ? r * 0.8 : r * (1.0 + 0.07 * Math.sin(t * 10 + i * 1.7 + e.seed * 3));
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.05);
    bg.addColorStop(0, stunned ? '#ffffff' : col.l); bg.addColorStop(0.45, col.c); bg.addColorStop(1, col.d);
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = col.d; ctx.lineWidth = Math.max(1, r * 0.06); ctx.lineJoin = 'round'; ctx.stroke();
    if (angry && !stunned && !attract) { const ga = ctx.globalAlpha; ctx.globalAlpha = ga * 0.3; ctx.fillStyle = '#ff2a2a'; ctx.fill(); ctx.globalAlpha = ga; }
    // cuernecillos de escarcha
    ctx.fillStyle = '#ffffff';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * 0.3, -r * 0.72); ctx.lineTo(s * r * 0.48, -r * 1.12); ctx.lineTo(s * r * 0.56, -r * 0.66); ctx.closePath(); ctx.fill(); }
    // ojos
    const lx = (DX[e.look] || 0) * r * 0.08, ly = (DY[e.look] || 0) * r * 0.07;
    if (stunned || e.state === 'dead' || e.state === 'carried') {
      ctx.strokeStyle = '#2a1640'; ctx.lineWidth = Math.max(1, r * 0.07); ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#fff'; ellipse(s * r * 0.3, -r * 0.1, r * 0.22, r * 0.24); ctx.fill();
        ctx.beginPath(); for (let a = 0; a < TAU * 1.6; a += 0.4) { const rr2 = r * 0.02 + a * r * 0.022; ctx.lineTo(s * r * 0.3 + Math.cos(a * s + t * 6) * rr2, -r * 0.1 + Math.sin(a * s + t * 6) * rr2); } ctx.stroke();
      }
      ctx.beginPath(); for (let k = 0; k <= 4; k++) ctx.lineTo(-r * 0.22 + k * r * 0.11, r * 0.36 + (k % 2 ? -r * 0.05 : r * 0.03)); ctx.stroke();
    } else {
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#fff'; ellipse(s * r * 0.3, -r * 0.1, r * 0.23, r * 0.26); ctx.fill();
        ctx.fillStyle = '#2a1640'; ellipse(s * r * 0.3 + lx, -r * 0.06 + ly, r * 0.11, r * 0.13); ctx.fill();
        ctx.fillStyle = '#fff'; ellipse(s * r * 0.3 + lx - r * 0.04, -r * 0.11 + ly, r * 0.035, r * 0.035); ctx.fill();
      }
      ctx.strokeStyle = '#2a1640'; ctx.lineWidth = Math.max(1.2, r * 0.1); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.44); ctx.lineTo(-r * 0.12, -r * 0.3); ctx.moveTo(r * 0.55, -r * 0.44); ctx.lineTo(r * 0.12, -r * 0.3); ctx.stroke();
      const mo = chewing ? r * 0.16 + Math.abs(Math.sin(t * 25)) * r * 0.1 : r * 0.1;
      ctx.fillStyle = '#4a1236'; ellipse(0, r * 0.36, r * 0.22, mo); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-r * 0.14, r * 0.36 - mo * 0.7); ctx.lineTo(-r * 0.07, r * 0.36 - mo * 0.7 + r * 0.14); ctx.lineTo(-r * 0.01, r * 0.36 - mo * 0.7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r * 0.01, r * 0.36 - mo * 0.7); ctx.lineTo(r * 0.07, r * 0.36 - mo * 0.7 + r * 0.14); ctx.lineTo(r * 0.14, r * 0.36 - mo * 0.7); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
    if (stunned) {
      const fl = e.t < 1 && Math.floor(e.t * 8) % 2 === 0;
      ctx.fillStyle = fl ? '#ffffff' : '#ffd23f';
      for (let i = 0; i < 3; i++) { const a = t * 4 + i * TAU / 3; star4(ctx, x + Math.cos(a) * r * 0.75, y - r * 1.05 + Math.sin(a) * r * 0.25, r * 0.22, a); }
    }
    if (angry && e.state === 'walk' && !attract && Math.sin(t * 7 + e.seed) > 0.6) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ellipse(x + r * 0.8, y - r * 0.9 - (t * 20 % 6), r * 0.16, r * 0.16); ctx.fill();
    }
  }

  function banner(txt, y, color, sub) {
    const fs = Math.round(clamp(ts * 1.25, 18, 32));
    ctx.save(); ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sfs = Math.round(fs * 0.55);
    ctx.font = `700 ${sfs}px ${FONT}`; const sw2 = sub ? ctx.measureText(sub).width : 0;
    ctx.font = `700 ${fs}px ${FONT}`;
    const bw = Math.min(W - 24, Math.max(ctx.measureText(txt).width, sw2) + 40), bh = fs * (sub ? 2.5 : 1.7);
    ctx.shadowColor = 'rgba(40,80,160,0.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
    rr(ctx, W / 2 - bw / 2, y - bh / 2, bw, bh, Math.min(bh / 2, 22)); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = color; ctx.fillText(txt, W / 2, sub ? y - fs * 0.38 : y);
    if (sub) { ctx.font = `700 ${sfs}px ${FONT}`; ctx.fillStyle = '#5d6c9e'; ctx.fillText(sub, W / 2, y + fs * 0.6); }
    ctx.restore();
  }

  function draw() {
    ctx.drawImage(bgLayer, 0, 0, W, H);
    // nieve que cae
    ctx.fillStyle = '#ffffff';
    for (const f of flakes) { ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.arc(f.x * W + Math.sin(t * 0.8 + f.ph) * 8, f.y * H, f.r, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * shake * ts * 0.35, rand(-1, 1) * shake * ts * 0.35);
    ctx.drawImage(floorLayer, 0, 0, W, H);
    drawFrame();
    drawBlocks();
    for (const e of enemies) if (e.state === 'dead') drawCopo(e);
    for (const e of enemies) if (e.state !== 'dead') drawCopo(e);
    drawPenguin();
    // partículas
    for (const p of particles) {
      const a = clamp(p.life / 0.4, 0, 1), X = PX(p.x), Y = PY(p.y), s = p.size * ts;
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      if (p.k === 'shard') { ctx.save(); ctx.translate(X, Y); ctx.rotate(p.rot); ctx.fillRect(-s / 2, -s * 0.3, s, s * 0.6); ctx.restore(); }
      else if (p.k === 'star') star4(ctx, X, Y, s * (0.6 + p.life * 0.5), p.rot);
      else { ctx.globalAlpha = a * 0.8; ctx.beginPath(); ctx.arc(X, Y, s * (1.6 - p.life), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    if (flashT > 0) { ctx.fillStyle = `rgba(255,240,250,${flashT * 0.9})`; ctx.fillRect(ox, oy, COLS * ts, ROWS * ts); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = clamp(p.life * 1.6, 0, 1);
      const fs = Math.round(ts * (p.big ? 0.95 : 0.68)) * (p.life > 0.85 ? 1 + (p.life - 0.85) * 2 : 1);
      ctx.font = `700 ${fs}px ${FONT}`;
      const X = clamp(PX(p.x), ox + ts, ox + COLS * ts - ts), Y = PY(p.y) - (1 - p.life) * ts * 1.1;
      ctx.lineWidth = Math.max(3, ts * 0.16); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineJoin = 'round'; ctx.strokeText(p.text, X, Y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, X, Y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // fila de información bajo el tablero
    if (!attract) {
      const fy = oy + ROWS * ts + fw + 13;
      if (fy < H - ctlH - 4 || shell.state !== 'play') {
        const fs = Math.round(clamp(ts * 0.55, 11, 15));
        ctx.font = `700 ${fs}px ${FONT}`; ctx.textBaseline = 'middle';
        if (hintT > 0 && level === 1 && shell.state === 'play') {
          ctx.globalAlpha = clamp(hintT, 0, 1); ctx.textAlign = 'center'; ctx.fillStyle = '#2f86ff';
          ctx.fillText('Desliza para andar · toca para empujar', W / 2, fy); ctx.globalAlpha = 1;
        } else {
          ctx.textAlign = 'left'; ctx.fillStyle = '#5d6c9e'; ctx.fillText('NIVEL ' + level, ox - fw * 0.5, fy);
          const left = eggs.size + enemies.filter(alive).length + slides.filter((s) => s.egg).length;
          ctx.textAlign = 'right'; ctx.fillText('COPOS ' + left, ox + COLS * ts + fw * 0.5, fy);
          const tw = ctx.measureText('COPOS ' + left).width;
          for (let i = 0; i < Math.min(left, 8); i++) { ctx.fillStyle = COPOS[(level - 1) % 4].c; ctx.beginPath(); ctx.arc(ox + COLS * ts + fw * 0.5 - tw - 10 - i * fs * 0.85, fy, fs * 0.3, 0, TAU); ctx.fill(); }
        }
      }
    }
    const cy = oy + ROWS * ts * 0.45;
    if (!attract) {
      if (phase === 'ready') banner('NIVEL ' + level, cy, '#2f86ff', 'Copos: ' + P.eggs);
      else if (phase === 'clear' && clearInfo) banner('¡Nivel superado!', cy, '#e8408f', clearInfo.bonus ? `${clearInfo.secs} s · bonus +${nf(clearInfo.bonus)}` : `${clearInfo.secs} s`);
      else if (gemMsgT > 0) banner('¡Diamantes en fila!', cy, '#e8408f');
      else if (angryMsgT > 0) banner('¡Los copos se enfadan!', cy, '#ff5a3c');
    }
  }

  // ---------- Bucle ----------
  let ctlShown = false;
  function update(dt) {
    t += dt;
    const st = shell.state;
    if (st === 'menu') { if (!attract) startAttract(); sim(dt); }
    else if (st === 'play' && !attract) {
      if (phase === 'ready') { phaseT -= dt; if (revealT > 0) revealT -= dt; if (phaseT <= 0) { phase = 'play'; revealT = 1.6; } }
      else if (phase === 'clear') { phaseT -= dt; if (phaseT <= 0) nextLevel(); }
      else { sim(dt); if (hintT > 0 && (player.moving || player.pushT > 0)) hintT -= dt; }
    }
    if (player.dead) player.deathT += dt;
    for (const e of enemies) if (e.state === 'dead') e.t -= dt;
    enemies = enemies.filter((e) => e.state !== 'dead' || e.t > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt; p.rot += p.vr * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const p of popups) p.life -= dt * 0.8;
    popups = popups.filter((p) => p.life > 0);
    for (const g of glints) g.life -= dt;
    glints = glints.filter((g) => g.life > 0);
    for (const f of flakes) { f.y += f.v * dt / H; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); } }
    shake = Math.max(0, shake - dt); flashT = Math.max(0, flashT - dt); gemMsgT -= dt; angryMsgT -= dt;
    for (let i = 0; i < 4; i++) wallShake[i] = Math.max(0, wallShake[i] - dt);
    if (wobble) { wobble.t -= dt; if (wobble.t <= 0) wobble = null; }
    const show = st === 'play';
    if (show !== ctlShown) { ctlShown = show; ctl.hidden = !show; if (!show) releaseAll(); }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); shell.paintHud(); musicTick();
    requestAnimationFrame(frame);
  }
  resize(); startAttract();
  requestAnimationFrame(frame);

  // ---------- Gancho de pruebas ----------
  const DIRN = { right: 0, down: 1, left: 2, up: 3 };
  const dn = (d) => (typeof d === 'string' ? DIRN[d] : d);
  window.__game = {
    shell,
    get player() { return player; }, get enemies() { return enemies; }, get slides() { return slides; }, get eggs() { return eggs; },
    get level() { return level; }, get phase() { return phase; }, get angry() { return angry; }, get attract() { return attract; },
    get eggsLeft() { return eggs.size; }, get gemDone() { return gemDone; }, get crushes() { return crushes; }, get invuln() { return invuln; },
    get music() { return { on: music.on, steps: music.steps }; },
    get noHatch() { return noHatch; }, set noHatch(v) { noHatch = !!v; },
    cell(x, y) { return G(x, y); },
    tile() { return [player.x, player.y]; },
    clearBoard() { grid.fill(EMPTY); eggs.clear(); enemies = []; slides = []; noHatch = true; noClear = true; distMap = null; },
    setBlock(x, y, kind, eggColor) { grid[K(x, y)] = kind == null ? ICE : kind; eggs.delete(K(x, y)); if (eggColor != null) eggs.set(K(x, y), { c: eggColor, warn: -1 }); },
    addEnemy(x, y, state) { const e = { x, y, dir: 2, p: 0, moving: false, back: false, state: state || 'walk', t: state === 'stun' ? 5 : 0, c: irand(4), seed: rand(0, TAU), bob: 0, wait: state === 'idle' ? 1e9 : 0, chewT: 0, look: 1 }; if (e.state === 'idle') e.state = 'walk'; enemies.push(e); return e; },
    setPlayer(x, y, dir) { player.x = x; player.y = y; player.moving = false; player.p = 0; if (dir != null) player.dir = dn(dir); },
    face(d) { player.dir = dn(d); },
    move(d) { setDir(dn(d)); held = -1; },
    hold(d) { setDir(dn(d)); }, release() { held = -1; },
    push() { requestPush(); },
    gotoLevel(n) { level = n - 1; nextLevel(); },
    killAll() { noClear = false; eggs.clear(); for (const e of enemies) if (alive(e)) { e.state = 'dead'; e.t = 0.1; e.fx = e.x; e.fy = e.y; } },
    catchMe() { invuln = 0; const e = this.addEnemy(player.x, player.y, 'walk'); e.wait = 1e9; return e; }
  };
})();
</script>
</body>
